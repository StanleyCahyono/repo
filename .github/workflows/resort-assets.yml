# Downloads every resort's OpenStreetMap lifts & pistes and a freely licensed Wikimedia Commons photo ONCE, and
# commits them to this branch (src/assets/osm/*.json, src/assets/photo-*.webp, catalog photo credits).
# Only resorts still missing a snapshot or photo are fetched (pass --force locally to refresh).
# Runs on a push whose commit message contains [resort-assets], or manually.
name: Resort assets
on:
  push:
    branches: [claude/piste-today-glass-hud]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resort-assets
  cancel-in-progress: false
jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[resort-assets]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lifts and pistes (OpenStreetMap)
        run: node scripts/build-osm-snapshots.mjs
      - name: Photos (Wikimedia Commons)
        run: node scripts/build-resort-photos.mjs
      - name: Commit
        run: |
          git config user.name "piste-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets catalog/resorts
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Bundle OpenStreetMap lifts & pistes and Commons photos for every resort (automated)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
