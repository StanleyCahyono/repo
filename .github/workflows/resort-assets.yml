# Downloads every resort's OpenStreetMap lifts & pistes, nearby place names, road routes (OSRM) and a freely licensed
# Wikimedia Commons photo ONCE, and commits them to this branch (src/assets, catalog).
# Only resorts still missing a snapshot or photo are fetched (pass --force locally to refresh).
# Runs on a push whose commit message contains [resort-assets], or manually.
name: Resort assets
on:
  push:
    branches: [claude/piste-today-glass-hud]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resort-assets
  cancel-in-progress: false
jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[resort-assets]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lifts and pistes (OpenStreetMap)
        run: node scripts/build-osm-snapshots.mjs
      - name: Place labels (OpenStreetMap towns, peaks, lift stations)
        run: node scripts/build-osm-snapshots.mjs --places
      - name: Road routes (OSRM)
        run: node scripts/build-drive-routes.mjs --catalog
      - name: Photos (Wikimedia Commons)
        run: node scripts/build-resort-photos.mjs
      - name: Commit
        run: |
          git config user.name "piste-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets catalog
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Bundle resort map data, place labels, road routes and photos (automated)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
