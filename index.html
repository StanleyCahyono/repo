{"url":"https://events.sofwerx.org/peo-m-unmanned-surface-vehicle-usv","title":"SOFWERX PEO-M USV Poseidon's Fury","pub_date":"2026","tier":2},{"url":"https://events.sofwerx.org/peo-sw-distributed-micro-sensors","title":"SOFWERX PEO-SW Distributed Micro Sensors","pub_date":"2026","tier":2},{"url":"https://www.army.mil/article/285967/army_c5isr_center_kicks_off_2025_persistent_network_experimentation_campaign","title":"Army C5ISR Center kicks off 2025 persistent network experimentation campaign","pub_date":"2025","tier":1},{"url":"https://www.army.mil/article/294835/netcom_showcases_capabilities_at_technet_augusta_2026","title":"NETCOM showcases capabilities at TechNet Augusta 2026","pub_date":"2026","tier":1},{"url":"https://sam.gov/opp/a47aa9e47c03435889dfd3bb79297084/view","title":"FARA Data Fusion and Mission Systems sources sought (historical)","pub_date":"unknown","tier":1},{"url":"https://sam.gov/opp/17e1c0ef669648ed998ee751850c40be/view","title":"FLRAA Mission Systems notice","pub_date":"unknown","tier":1}]}},"regulatoryMatrix":[],"founderAnalysis":null,"registry":{"gaps":[]},"gaps":{},"survivors":{},"survivorsOrder":[],"mandate":"TASK: C4ISR STARTUP LANDSCAPE — DEEP RESEARCH MANDATE\n\nROLE\nAct as a combination of: defense-industry analyst; venture-capital market researcher; military technology architect; federal procurement analyst; software/hardware technical diligence analyst; startup strategist.\n\nYour objective is NOT merely to produce a list of defense startups. Your objective is to determine: Where, within the modern C4ISR ecosystem, are there important, funded, technically tractable problems that are still inadequately solved and could credibly support a new venture-backed company?\n\nThe end product should allow the founders to decide whether there is a real startup opportunity, what exact problem to investigate, who the customer would be, what incumbents exist, why existing products do not solve the problem, what expertise is necessary, how much capital a credible MVP would require, and how the company could obtain its first government or commercial deployment.\n\nFOUNDING-TEAM CONTEXT\nAssume the potential founders are: two university students; approximately $250,000 of founder capital available; one strong engineering/technical founder; one founder strong in business, finance, product and customer development; willing to recruit specialized engineers where necessary; interested primarily in C4ISR; interested in the United States defense market, but potentially allied markets later; one German founder expected to become a U.S. lawful permanent resident; one Indonesian founder who is not presently assumed to be a U.S. person for export-control purposes.\n\nDo NOT make definitive immigration, ITAR, EAR, FOCI, facility-clearance or security-clearance legal judgments. Instead: (1) identify when these issues could affect a business model; (2) explain the nature of the constraint; (3) identify what would need specialist legal review; (4) distinguish businesses that could probably begin using unclassified/commercial technology from businesses inherently dependent on classified or controlled information.\n\nThe founders do NOT need the eventual company to remain a two-person company. The relevant question is: Can two founders and ~$250k reach a sufficiently credible technical demonstration/customer-validation milestone to raise institutional capital or obtain government funding?\n\nCENTRAL RESEARCH PRINCIPLE\nDo not search for \"an idea nobody has thought of.\" That is usually a bad framework. Instead search for: important military workflows where existing capabilities remain expensive, fragmented, slow, unreliable, difficult to integrate, difficult to deploy, difficult to use, or insufficient under realistic operating conditions.\n\nDistinguish carefully between:\nCategory A — genuinely unsolved technical problem: technology cannot currently perform the task adequately.\nCategory B — integration problem: the technology exists, but systems cannot communicate/interoperate effectively.\nCategory C — workflow problem: capabilities exist, but users still perform significant manual work.\nCategory D — deployment problem: technology works in a lab/cloud environment but poorly at the tactical edge or under DDIL conditions.\nCategory E — procurement problem: solutions technically exist but acquisition structures prevent widespread adoption.\nCategory F — security/releasability problem: information exists but cannot easily be shared across security domains, organizations, services or allies.\nCategory G — usability problem: existing tools technically work but impose excessive training, cognitive burden or operator workload.\nCategory H — economic problem: existing capability works but is too expensive to deploy at necessary scale.\nCategory I — data problem: models/applications are constrained by fragmented, proprietary, poorly labeled, inaccessible or incompatible data.\nCategory J — no real startup opportunity: the supposed \"gap\" is actually adequately solved, insufficiently important, lacking a budget, inherently classified, dominated by incumbents, technically unrealistic, or economically unattractive.\nEvery proposed opportunity MUST be classified into one or more of these categories.\n\nPHASE 1 — DEFINE C4ISR FROM FIRST PRINCIPLES\nDo not immediately research companies. First map the system, starting from the complete information/decision chain: COLLECT → TRANSPORT → INGEST → NORMALIZE → STORE → PROCESS → FUSE → IDENTIFY / INTERPRET → VISUALIZE → DECIDE → COLLABORATE → DISSEMINATE → TASK → MONITOR → ASSESS. For each step determine: what happens; who performs it; what hardware is involved; what software is involved; what data formats/protocols matter; where humans remain in the loop; where latency occurs; what communications dependencies exist; what happens when connectivity disappears; what interoperability requirements exist; what security domain is normally involved; which military organizations own the capability; what major incumbent systems perform the function. Then create a high-level architecture diagram.\n\nPHASE 2 — BUILD THE C4ISR TAXONOMY\nBuild the market from the top down, beginning with these segments (change or subdivide if the evidence suggests a better structure): 1 Command-and-Control Applications; 2 Data Fabric / Data Mesh / Middleware; 3 ISR Collection; 4 ISR Processing, Exploitation and Dissemination; 5 Tactical Communications and Networking; 6 Edge Compute and Edge AI; 7 Geospatial / Situational Awareness / Track Management; 8 Coalition and Cross-Organization Interoperability (a major standalone investigation); 9 Cloud / DevSecOps / Software Deployment / ATO; 10 Identity / Security / Zero Trust / Cross-Domain Infrastructure; 11 Positioning, Navigation and Timing; 12 Electronic Warfare / Spectrum Awareness adjacent to C4ISR; 13 Autonomy Command and Control; 14 Sustainment / Logistics C2. For each: which workflows remain manual, which require several applications, where data is re-entered, where Excel/PowerPoint/email/chat/phone remain part of the workflow, which apps are being consolidated, which app ecosystems permit third-party software, where proprietary formats create lock-in, which layers are commoditized or already controlled by Palantir, Anduril, Raft, primes or government standards, cost of a credible prototype, hardware intensity, certification and manufacturing burden, and whether commercial technology provides a wedge. Critically distinguish \"AI analyzes ISR\" from an actual product: INPUT → PROCESS → OUTPUT → USER → DECISION.\n\nPHASE 3 — MAP THE GOVERNMENT CUSTOMER\nDo not refer generically to \"the Pentagon.\" For every segment identify the USER, OPERATIONAL SPONSOR, PROGRAM OFFICE, CONTRACTING ORGANIZATION, BUDGET OWNER, APPROPRIATION (RDT&E, Procurement, O&M, other), PROGRAM ELEMENT, and PROCUREMENT PATH (SBIR/STTR; Direct-to-Phase-II; STRATFI/TACFI; DIU CSO; prototype OT; production OT; Army xTech; AFWERX; SpaceWERX; Naval innovation pathways; BAA; FAR contract; subcontract to prime; CRADA; consortium OTA; direct commercial sale; allied procurement).\n\nPHASE 4 — MAP THE BUYING ORGANIZATIONS\nJoint: OSD, CDAO, Joint Staff/J6, DISA, DIU, DARPA, NSIN, combatant commands, OPEN DAGIR. Army: CPE C2IN, PM C2 Applications, PM C2 Data/AI, PM C2 Infrastructure, PM C2 Transport, PM Interoperability, Integration and Services, PEO IEW&S, Army Futures Command, Network CFT, Project Convergence, xTech, Army labs. Air Force: DAF PEO C3BM, ABMS, DAF Battle Network, ISR acquisition, AFWERX, AFRL. Navy/Marine Corps (confirm CURRENT structure): NAVWAR, current Navy mission-systems acquisition organization, legacy/current PEO C4I, Project Overmatch, Marine Corps C4 organizations, NavalX, NIWC Pacific, NIWC Atlantic. Space Force: C2 acquisition, space-domain awareness, BMC3, Space Systems Command, SpaceWERX. Build an organizational chart: USER → REQUIREMENT OWNER → PROGRAM OFFICE → CONTRACTING PATH → BUDGET.\n\nPHASE 5 — CREATE THE COMPANY UNIVERSE\nAt least 60 companies, startups and incumbents (seed: Anduril, Palantir, Vannevar Labs, Onebrief, Picogrid, TurbineOne, Second Front, Aalyria, Scale AI, Shield AI, Skydio, geospatial/data companies, tactical-network specialists; incumbents: Lockheed Martin, Northrop Grumman, RTX, L3Harris, General Dynamics Mission Systems, Leidos, SAIC, Booz Allen Hamilton, CACI, BAE Systems, other integrators). Discover more from award records, subcontract announcements, DIU catalog, SBIR awards, xTech, exercises, conference agendas, venture portfolios, prime teaming announcements. Forty required fields per company (founding, HQ, ownership, headcount, founders and backgrounds, funding, valuation, investors, products, exact problem solved, users, buyers, technical layer, mission layer, HW/SW mix, posture, contracts with amount/type/date/customer/prime-vs-sub/prototype-vs-production/ceiling-vs-obligated, deployments, exercises, partners, APIs, security RE THE GAP\n0–5 on: severity of pain; frequency; budget evidence; procurement accessibility; technical feasibility; feasibility with $250k; time to credible demo; data availability; regulatory accessibility; ability to start unclassified; competitive intensity; incumbent vulnerability; integration feasibility; potential moat; dual-use potential; expansion potential; repeat-purchase potential; founder-team fit. Show individual scores; compute MARKET ATTRACTIVENESS and FOUNDER FIT; explain every 1 or 5.\n\nPHASE 10 — RED-TEAM EVERY ATTRACTIVE OPPORTUNITY\nWrite the strongest bear case: why is nobody already making billions from this? Test every failure mode (unimportant problem, no budget owner, exercise-only pain, government expects a prime, needs government action, missing APIs, classified data, integration cost, services-heavy margins, users like the existing workflow, switching cost, Anduril/Palantir can add it in six months, $20M market, per-unit implementations, consultancy drift, five-year procurement, cannot demonstrate without military access). Reject weak opportunities; do not preserve an arbitrary number.\n\nPHASE 11 — EXPERTISE MAP (software, hardware, defense domain, business; first five hires; fatal missing expertise).\nPHASE 12 — CAPITAL MAP (Stage 0 customer discovery; Stage 1 lab MVP; Stage 2 field demo; Stage 3 military prototype/pilot; Stage 4 production; line items; whether $250k reaches the next fundable milestone).\nPHASE 13 — COMPETITIVE WHITE-SPACE MAP (chain × echelon; test every empty cell).\nPHASE 14 — MONEY MAP (PROBLEM → USER → REQUIREMENT OWNER → PROGRAM OFFICE → CONTRACTING OFFICE → BUDGET → CONTRACT VEHICLE → CURRENT VENDORS; no path = major penalty).\nPHASE 15 — PROCUREMENT SIGNAL ANALYSIS (RFI → sources sought → prototype solicitation → award → follow-on → production → repeat; Emerging / Prototyping / Transitioning / Mature / Stagnant).\nPHASE 16 — PROTO-PURGATORY (SBIR after SBIR without production: opportunity or institutional warni
