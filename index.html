<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C4ISR Startup Landscape</title>
<meta name="description" content="Investment-grade and founder-grade market map of the modern C4ISR ecosystem: architecture, buyers, companies, evidence, gap registry, red-teamed opportunities and 90-day validation plans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ---------- Tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f2f4f1;
  --surface: #fbfbfa;
  --surface-2: #e9ece8;
  --surface-3: #dfe3df;
  --ink: #141715;
  --ink-2: #4c524f;
  --muted: #7d847f;
  --line: #d6dbd6;
  --line-strong: #b9c0ba;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --accent-soft: #dbe8f2;
  --accent-2: #a8620f;
  --accent-2-soft: #f5e6cf;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --shadow: 0 1px 2px rgba(20,23,21,.06), 0 8px 24px rgba(20,23,21,.08);
  --radius: 6px;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sidebar-w: 264px;
  --topbar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1211; --surface: #171b19; --surface-2: #1f2421; --surface-3: #283029;
    --ink: #eef0ec; --ink-2: #b8bfb9; --muted: #838b85; --line: #2a302c; --line-strong: #3b433d;
    --accent: #6fa8d6; --accent-ink: #0f1211; --accent-soft: #1d2f3d; --accent-2: #e0a04a; --accent-2-soft: #3a2c16;
    --good-text: #0ca30c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --seq-1: #16304d; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #5598e7; --seq-6: #86b6ef; --seq-7: #b7d3f6;
    --grid: #2c2c2a; --axis: #383835;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1211; --surface: #171b19; --surface-2: #1f2421; --surface-3: #283029;
  --ink: #eef0ec; --ink-2: #b8bfb9; --muted: #838b85; --line: #2a302c; --line-strong: #3b433d;
  --accent: #6fa8d6; --accent-ink: #0f1211; --accent-soft: #1d2f3d; --accent-2: #e0a04a; --accent-2-soft: #3a2c16;
  --good-text: #0ca30c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --seq-1: #16304d; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #5598e7; --seq-6: #86b6ef; --seq-7: #b7d3f6;
  --grid: #2c2c2a; --axis: #383835;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 34px; font-weight: 700; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 18px; font-weight: 600; }
h4 { font-size: 15px; font-weight: 600; font-family: var(--font-body); }
p { margin: 0; max-width: 72ch; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; z-index: 100; }
.skip:focus { left: 8px; top: 8px; }
[hidden] { display: none !important; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 17px; color: var(--ink-2); max-width: 78ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
ul, ol { margin: 0; padding-left: 20px; }
li + li { margin-top: 4px; }
mark { background: var(--accent-2-soft); color: inherit; padding: 0 2px; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: var(--topbar-h) 1fr; min-height: 100%; }
.topbar { grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 50%; position: relative; }
.brand-mark::after { content: ""; position: absolute; inset: 3px; background: var(--accent); border-radius: 50%; }
.search { flex: 1; position: relative; max-width: 620px; margin-left: 8px; }
.search input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); color: var(--ink); font-size: 14px; }
.search input::placeholder { color: var(--muted); }
.search-results { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 60vh; overflow: auto; z-index: 40; }
.search-results .sr { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--ink); }
.search-results .sr:hover, .search-results .sr.active { background: var(--surface-2); text-decoration: none; }
.search-results .sr .kind { font-family: var(--font-mono); font-size: 11px; color: var(--muted); min-width: 74px; text-transform: uppercase; letter-spacing: .06em; }
.search-results .sr .sub { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.nav-toggle { display: none; width: 36px; height: 36px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
.nav-toggle span { display: block; width: 16px; height: 2px; background: var(--ink); }
.sidebar { position: sticky; top: var(--topbar-h); align-self: start; height: calc(100vh - var(--topbar-h)); overflow: auto; padding: 14px 10px 30px; border-right: 1px solid var(--line); background: var(--surface); }
.sidebar .group { margin-bottom: 14px; }
.sidebar .group-title { padding: 6px 10px 4px; }
.sidebar a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius); color: var(--ink-2); font-size: 14px; }
.sidebar a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.sidebar a.active { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.sidebar a .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.main { padding: 28px 32px 80px; min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; display: grid; gap: 24px; }
.page-head { display: grid; gap: 10px; }
.page-head .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.crumbs { display: flex; gap: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.crumbs span::before { content: "›"; margin-right: 6px; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: var(--topbar-h); width: min(300px, 86vw); transform: translateX(-100%); transition: transform .2s ease; z-index: 25; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .nav-toggle { display: flex; }
  .brand-text { display: none; }
  .main { padding: 18px 16px 60px; }
  h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.card.flat { background: transparent; }
.card > h2, .card > h3 { margin-bottom: 10px; }
.card .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stack { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .v { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; color: var(--ink); }
.kpi .l { color: var(--muted); font-size: 13px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent; white-space: nowrap; }
.chip.mono { font-family: var(--font-mono); font-size: 11px; }
.chip.accent { background: var(--accent-soft); color: var(--ink); }
.chip.amber { background: var(--accent-2-soft); color: var(--ink); }
.chip.outline { background: transparent; border-color: var(--line-strong); }
.chip.good { background: transparent; border-color: var(--good); color: var(--good-text); }
.chip.warn { background: transparent; border-color: var(--warning); color: var(--ink); }
.chip.serious { background: transparent; border-color: var(--serious); color: var(--ink); }
.chip.bad { background: transparent; border-color: var(--critical); color: var(--critical); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.cat { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.label { display: inline-block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--ink-2); vertical-align: middle; }
.label.fact { border-color: var(--good); color: var(--good-text); }
.label.inference { border-color: var(--accent-2); color: var(--accent-2); }
.label.hypothesis { border-color: var(--serious); color: var(--serious); }
.label.high { border-color: var(--good); color: var(--good-text); }
.label.medium { border-color: var(--warning); }
.label.low { border-color: var(--critical); color: var(--critical); }
.kv { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv dd ul { padding-left: 16px; }
@media (max-width: 600px) { .kv { grid-template-columns: 1fr; gap: 2px 0; } .kv dt { margin-top: 8px; } }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--ink-2); font-size: 14px; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 14px; color: var(--ink); }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select, .toolbar input[type="search"], .toolbar input[type="text"] { height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); font-size: 13px; }
.toolbar .spacer { flex: 1; }
details.fold { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 10px 14px; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--muted); font-size: 12px; transition: transform .15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > .fold-body { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 var(--radius) var(--radius) 0; }
.callout.amber { border-left-color: var(--accent-2); background: var(--accent-2-soft); }
.callout.bear { border-left-color: var(--critical); background: color-mix(in oklab, var(--critical) 10%, var(--surface)); }
.callout.bull { border-left-color: var(--good); background: color-mix(in oklab, var(--good) 10%, var(--surface)); }
.prose { max-width: 72ch; display: grid; gap: 12px; }
.prose p { max-width: none; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
.empty { color: var(--muted); font-style: italic; }
.source-list { font-size: 13px; }
.source-list li { overflow-wrap: anywhere; }
.tier { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.data { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.data th, table.data td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
table.data th { position: sticky; top: 0; background: var(--surface-2); font-weight: 500; font-size: 12px; color: var(--ink-2); white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
table.data th.sorted::after { content: " ▲"; font-size: 9px; color: var(--muted); }
table.data th.sorted.desc::after { content: " ▼"; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover td { background: color-mix(in oklab, var(--accent) 6%, var(--surface)); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.clickable { cursor: pointer; }
table.data td .cell-sub { display: block; color: var(--muted); font-size: 12px; }
.pager { display: flex; gap: 8px; align-items: center; padding: 8px 10px; font-size: 13px; color: var(--muted); }

/* Score bars */
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 36px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .bar-label { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; background: var(--seq-4); border-radius: 0 4px 4px 0; }
.bar-row .bar-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bar-row.warn .bar-fill { background: var(--accent-2); }
.score-pill { display: inline-grid; place-items: center; min-width: 44px; height: 26px; padding: 0 8px; border-radius: 6px; font-family: var(--font-display); font-weight: 700; font-size: 16px; background: var(--surface-2); color: var(--ink); }
.score-pill.s5, .score-pill.s4 { background: var(--seq-5); color: #fff; }
.score-pill.s3 { background: var(--seq-3); color: #fff; }
.score-pill.s2 { background: var(--seq-2); color: var(--ink); }
.score-pill.s1, .score-pill.s0 { background: var(--seq-1); color: var(--ink); }
:root[data-theme="dark"] .score-pill.s2, :root[data-theme="dark"] .score-pill.s1, :root[data-theme="dark"] .score-pill.s0 { color: var(--ink); }

/* Verdict badges */
.verdict { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; font-family: var(--font-mono); }
.verdict.survive { background: color-mix(in oklab, var(--good) 18%, var(--surface)); color: var(--good-text); }
.verdict.borderline { background: color-mix(in oklab, var(--warning) 25%, var(--surface)); color: var(--ink); }
.verdict.kill { background: color-mix(in oklab, var(--critical) 16%, var(--surface)); color: var(--critical); }
.verdict.pending { background: var(--surface-2); color: var(--muted); }

/* Chain diagram */
.chain { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.chain button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 10px 8px; cursor: pointer; position: relative; min-height: 76px; }
.chain button:hover { border-color: var(--accent); }
.chain button.active { border-color: var(--accent); background: var(--accent-soft); }
.chain .step-n { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.chain .step-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; display: block; margin-top: 2px; }
.chain .step-sub { font-size: 11px; color: var(--muted); display: block; margin-top: 4px; line-height: 1.3; }

/* SVG graphs */
.graph-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
svg.graph text { font-family: var(--font-body); font-size: 12px; fill: var(--ink); }
svg.graph .layer-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; fill: var(--muted); }
svg.graph .node rect { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1; rx: 5; }
svg.graph .node:hover rect, svg.graph .node.hl rect { stroke: var(--accent); stroke-width: 1.5; fill: var(--accent-soft); }
svg.graph .edge { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
svg.graph .edge.hl { stroke: var(--accent); stroke-width: 2; }
svg.graph .edge-label { font-size: 10px; fill: var(--muted); }
svg.graph .node { cursor: default; }
svg.graph .node.link { cursor: pointer; }

/* Heatmap */
.heat { display: grid; gap: 2px; font-size: 12px; }
.heat .hx { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: center; padding: 4px 2px; letter-spacing: .04em; align-self: end; }
.heat .hy { font-size: 12px; color: var(--ink-2); padding: 4px 8px 4px 0; text-align: right; white-space: nowrap; align-self: center; }
.heat .cell { min-height: 48px; border-radius: 3px; display: grid; place-items: center; cursor: pointer; border: 2px solid var(--surface); font-weight: 500; }
.heat .cell:hover, .heat .cell.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.heat .cell.empty { background: var(--surface-2); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-2); }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -2px; }

/* Stacked bars (capital map) */
.stack-bars { display: grid; gap: 8px; }
.stack-row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 100px; gap: 10px; align-items: center; font-size: 13px; }
.stack-track { display: flex; height: 18px; gap: 2px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.stack-seg { height: 100%; min-width: 0; }
.stack-seg:first-child { border-radius: 4px 0 0 4px; }
.stack-seg:last-child { border-radius: 0 4px 4px 0; }

/* Timeline */
.timeline { position: relative; padding-left: 22px; display: grid; gap: 12px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line-strong); }
.tl-item { position: relative; }
.tl-item::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.tl-item .tl-date { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.tl-item .tl-type { margin-left: 8px; }

/* Plan (90 days) */
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.plan .phase { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px; display: grid; gap: 8px; align-content: start; }
.plan .phase h4 { font-family: var(--font-display); font-size: 17px; }
.plan .phase .kill { border-top: 1px dashed var(--line-strong); padding-top: 8px; font-size: 13px; }
.plan .phase .kill strong { color: var(--critical); }

/* Money map chain */
.money-chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.money-link { flex: 1 1 150px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 8px 10px; min-width: 0; position: relative; }
.money-link .ml-key { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.money-link .ml-val { font-weight: 500; font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.money-link .ml-det { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.money-link.conf-LOW { border-color: var(--critical); }
.money-link.conf-MEDIUM { border-color: var(--warning); }
.money-link.conf-HIGH { border-color: var(--good); }

/* Evidence card */
.ev-item { border-left: 2px solid var(--line-strong); padding: 6px 12px; display: grid; gap: 3px; }
.ev-item .ev-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ev-item .ev-form { font-family: var(--font-mono); font-size: 11px; color: var(--accent-2); text-transform: uppercase; letter-spacing: .05em; }
.ev-item a { font-size: 13px; overflow-wrap: anywhere; }

/* Red team */
.lens { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); display: grid; gap: 8px; align-content: start; }
.lens.refuted { border-color: var(--critical); }
.lens .strength { display: flex; gap: 3px; }
.lens .strength i { width: 14px; height: 8px; background: var(--surface-3); border-radius: 2px; }
.lens .strength i.on { background: var(--critical); }

/* Segment cards */
.seg-card { display: grid; gap: 8px; align-content: start; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; color: var(--ink); }
.seg-card:hover { border-color: var(--accent); text-decoration: none; }
.seg-card .seg-id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.seg-card h3 { font-size: 17px; }
.seg-card .seg-sum { font-size: 13px; color: var(--ink-2); }

/* Tooltip */
.tooltip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 4px; font-size: 12px; max-width: 320px; box-shadow: var(--shadow); }

/* Print */
@media print {
  .topbar, .sidebar { display: none; }
  .app { display: block; }
  .main { padding: 0; }
  .card, .table-wrap { break-inside: avoid; }
}

<script>
window.DATA = {"generated":"2026-09-24","segments":[{"segment_id":"S08","segment_name":"Coalition and Cross-Organization Interoperability","what_it_does":"This layer lets forces from different nations, services and agencies exchange operational information (friendly/enemy tracks, orders, geometries, targeting data, intelligence products, logistics status, chat/voice/email) despite owning different C2 systems, different networks, different classification regimes and different national disclosure rules. Technically it spans (1) mission-partner networks and enclaves (CENTRIXS variants, Pegasus for Five Eyes, CFBLNet for lab federation, BICES for NATO/partner intelligence, SIPR-REL / Secret-Releasable, NATO's Federated Mission Networking), (2) cross-domain solutions and guards that move data between security domains under releasability rules, (3) standardized data exchange formats and profiles (STANAG 5525/JC3IEDM and MIP, NFFI, NVG, ADatP-3/USMTF, VMF, Link 16/22, TAK Cursor-on-Target, FMN spiral profiles), (4) federated identity/access (ICAM for partners), and (5) the human/procedural layer (foreign disclosure officers, liaison officers, joining/membership/exit instructions). The recurring failure mode is that information exists in system A on network X at classification Y and cannot legally or technically reach system B on network Z, so people swivel-chair it, re-key it or re-create it at a lower level.","sub_taxonomy":[{"name":"Mission-partner network and enclave provisioning (MPE/CIE, CENTRIXS, Pegasus, CFBLNet, SABRE, APAN)","note":"Network-centric today; DISA states a shift to a data-centric Coalition Information Environment by early 2027 (FNN, 2026-08-13). Dominated by services integrators (Trace Systems MPE-S, GDIT EMITS 2)."},{"name":"Cross-domain transfer and releasability enforcement (CDS, guards, data tagging)","note":"Accredited hardware/software guards from Everfox/Forcepoint, Owl Cyber Defense, General Dynamics Mission Systems, Northrop Grumman (CHORD for partner networks). Startup entry requires NCDSMO-class accreditation; evidence of manual product movement persists (SAIC; MIPB 2025)."},{"name":"Standards-based C2 data exchange and translation (MIP/JC3IEDM, NFFI, NVG, ADatP-3, VMF, Link 16/22, CoT, FMN spirals)","note":"Where allied C2 products compete on 'most interoperable': Systematic SitaWare, HAVELSAN, Terma, ThalesRaytheon AirC2. Annual NATO CWIX is the de facto proving ground; NATO is building INSPECT for continuous conformance testing."},{"name":"Tactical (brigade-and-below) multinational situational awareness bridges","note":"Unit-built workarounds (2nd Cavalry Regiment Mission Partner Kit at SBU level) and vendor bridges (Booz Allen Sit(x) connecting Lattice to TAK/partner systems). This is the most accessible sub-layer for a small team because standards are public and data can be unclassified."},{"name":"Coalition intelligence sharing and foreign disclosure workflow (BICES, REL NATO production, FDO review)","note":"Evidence shows intelligence produced at collateral Secret cannot be shared and must be regenerated on a lower enclave; BICES does not talk to mission-command systems (MIPB 2025). Institutional and accreditation-bound."},{"name":"Alliance-level C2 programs (NATO ACCS, Maven Smart System NATO, AFSC/airborne C2, LC2IS)","note":"Multi-decade NATO programs; ACCS integration 'remains incomplete' after >20 years (Atlantic Council, 2026-06-10). NATO bought Palantir MSS in six months (NCIA, 2025-03-25), showing a faster sole-source path for proven products."},{"name":"Exercise-driven interoperability assurance (CWIX, Bold Quest/JDAT, Talisman Sabre, Steadfast series, Project Convergence)","note":"Where pain surfaces publicly. CWIX25: >3,200 participants, ~600 capabilities, >25,000 tests, 40 nations (NATO ACT, June 2025)."}],"users":[{"role":"Battle captain / battle manager in a combined joint task force operations center","echelon":"theater / joint / coalition","what_they_do":"Watches terminals on several networks at different releasability levels, distills information and has staff re-enter it into the system that can accept it (SAIC description of typical coalition scenario, undated ~2022)."},{"role":"Foreign Disclosure Officer / releasability authority","echelon":"division_corps / theater","what_they_do":"Reviews products for release to specific partners; applies most-restrictive-marking rules (NOFORN dominates REL FVEY in combined objects). Human-in-the-loop bottleneck for anything crossing to a partner enclave."},{"role":"Multinational intelligence cell analyst (G2/J2, allied counterparts)","echelon":"division_corps / coalition","what_they_do":"Produces and consumes intelligence across US-only, MPE and BICES networks; in WFX 24-03 had to regenerate intelligence on the MPE lower enclave with REL NATO markings because the primary simulation output was collateral Secret (MIPB, 2025)."},{"role":"Liaison officer (LNO) embedded with allied unit","echelon":"battalion_brigade / tactical_unit","what_they_do":"Carries a Mission Partner Kit or national C2 terminal into a partner HQ and manually bridges the picture; 2CR's MPK is explicitly 'enabled by trained liaison officers' (army.mil, 2025-03-25)."},{"role":"G6/J6 network engineer standing up an episodic mission network","echelon":"theater / joint","what_they_do":"Builds and accredits partner enclaves, federates identity, configures guards; DISA says historical practice produced many vertically integrated, domain-specific partner networks now being consolidated (FNN, 2026-08-13)."},{"role":"Fires cell / JTAC / air defense controller","echelon":"tactical_unit / battalion_brigade","what_they_do":"Passes geometries and targets between national C2IS and fire-control systems; in a 2025 coalition warfighter exercise some nations' C2IS 'couldn't seamlessly pass data to their national Fire Control Systems' (Small Wars Journal, 2025-11-19). WADS/PADS controllers integrated with RAAF 3CRU at Talisman Sabre 25 (USAF, 2025-07-28)."},{"role":"Coalition planner / logistician","echelon":"division_corps / theater / coalition","what_they_do":"Plans reception, staging and sustainment across nations (Steadfast Dart 26: 10,000 troops, 13 nations, Germany as hub). Public evidence insufficient on specific coalition logistics data-exchange tooling failures."},{"role":"National C2 system integrator / test engineer at CWIX","echelon":"coalition","what_they_do":"Runs FMN-spiral conformance test cases once a year against other nations' live systems ('try, fail, fix, and try again' - mscoe.org on CWIX)."}],"buyers":[{"organization":"Defense Information Systems Agency (DISA) - Mission Partner Environment / Partner Access Environment portfolio","service":"DoD (agency)","role":"program office","note":"Took over MPE oversight from the Air Force in 2025; now testing Coalition Information Environment capabilities in INDOPACOM (DefenseScoop, 2026-06-03) and consolidating CFBLNet, Pegasus and similar environments under its purview (FNN, 2026-08-13). Holds the $998M-ceiling MPE-S IDIQ with Trace Systems (2019)."},{"organization":"U.S. Indo-Pacific Command J6 / U.S. European Command and U.S. Army Europe and Africa G6","service":"Combatant commands / ASCC","role":"operational sponsor","note":"INDOPACOM is the CIE test bed (Olympus Fires demo planned); USAREUR-AF's EMITS 2 task order (GDIT, $1.25B ceiling, awarded Sept 2025) includes 'mature its mission partner network' for NATO and other partners."},{"organization":"U.S. Army PEO C3T/C3N and Network CFT; 2nd Cavalry Regiment and other Europe-based formations","service":"Army","role":"program office / operational sponsor","note":"Army runs an SBU variant of MPE (Janes, 2025, title only) and units built the Mission Partner Kit as a bottom-up solution (army.mil, 2025-03-25). NGC2 common data layer baseline set June 2026 (Anduril Lattice, Palantir Foundry, Raft) with multinational partners at PCC6."},{"organization":"Joint Staff J6 / Joint Deployable Analysis Team (JD d Information Collection and Exploitation System)","owner":"NATO BICES Group Executive / nations","function":"Intelligence sharing between U.S., NATO and partners; feeds NATO Intelligence Functional System","vendor":"Multinational","status":"Fielded; 'does not communicate with mission command systems' (MIPB, 2025)"},{"name":"Federated Mission Networking (FMN)","owner":"NATO ACT","function":"Spiral specifications and joining instructions so national networks federate for operations","vendor":"Nations implement; NCIA core services","status":"Spiral 4 profile referenced 2025; CWIX25 validated current and future spirals; INSPECT conformance tool near-fielded"},{"name":"NATO ACCS (Air Command and Control System)","owner":"NATO / NCIA","function":"Alliance air C2 connecting national air defense networks","vendor":"ThalesRaytheonSystems AMDC2 (Thales acquiring RTX's stake, MoU 2025-07-16)","status":"Integration 'remains incomplete' after more than two decades (Atlantic Council, 2026-06-10)"},{"name":"Maven Smart System NATO","owner":"NATO ACO / NCIA","function":"AI-enabled intelligence fusion, targeting, battlespace awareness","vendor":"Palantir","status":"Procured 2025-03-25 sole-source; deployment within 30 days; demonstrated at CWIX25"},{"name":"SitaWare Suite (Headquarters, Frontline, Edge)","owner":"Multiple allied armies; U.S. Army CPCE backbone","function":"Battle management / C2 with native MIP, NFFI, ADatP-3, VMF, Link 16 support","vendor":"Systematic (Denmark)","status":"Fielded across many NATO armies; U.S. Army selected 2017 for CPCE (PRNewswire)"},{"name":"Army Coalition Interoperability Solution (ACIS)","owner":"U.S. Army / USAREUR","function":"Nation-independent hub to share position-location and SA among coalition C2 systems","vendor":"Army with Systematic-based components (c4isrnet, 2018)","status":"Urgent-need origin; current status public evidence insufficient"},{"name":"Mission Partner Kit (MPK)","owner":"2nd Cavalry Regiment (unit initiative)","function":"SBU-level COP, chat, voice, collaboration for U.S.-NATO tactical units, hosted in government-approved commercial cloud, built on Nett Warrior","vendor":"COTS; specific vendors not named","status":"Tested at Saber Strike 24 / Defender 24; documented 2025; not a program of record per public evidence"},{"name":"Booz Allen Sit(x) on Anduril Menace / Lattice","owner":"Commercial","function":"Shared coordination layer connecting Lattice users with TAK-based and other partner systems","vendor":"Booz Allen / Anduril","status":"Integrations 'live today' (2026-05-18); deployment scale not disclosed"},{"name":"Cross-domain solutions (Everfox, Owl, GDMS, Northrop CHORD)","owner":"Various","function":"Accredited transfer/access between security domains including partner networks; CHORD is FMS/DCS-exportable","vendor":"Everfox, Owl Cyber Defense, General Dynamics Mission Systems, Northrop Grumman","status":"Fielded; accreditation-gated"},{"name":"NGC2 common data layer (Lattice tactical, Foundry cloud, Raft registries/federation)","owner":"U.S. Army","function":"Data mesh for division-and-below C2; multinational partners present at PCC6","vendor":"Anduril, Palantir, Raft; Lockheed team alternative","status":"Baseline established 2026-06-22; coalition data-exchange specifics public evidence insufficient"}],"data_formats_protocols":["STANAG 5525 / JC3IEDM and MIP exchange","NFFI (STANAG 5527) friendly force information","NVG (NATO Vector Graphics)","ADatP-3 / USMTF message text formats","VMF (MIL-STD-6017)","Link 16 (MIL-STD-6016, export-controlled) and Link 22","TAK Cursor-on-Target","C2SIM, HLA/NETN-FOM (simulation-to-C2 at CWIX)","STANAG 4609 motion imagery","FMN spiral service profiles (email, chat, web, IdM)","Releasability markings: REL TO, NOFORN, REL NATO, FVEY"],"security_domain":"Spans Unclassified/SBU (APAN, Army SBU MPE, MPK), Secret-Releasable (CENTRIXS, SABRE, SIPR-REL), NATO Secret (MPE accredited to process NATO Secret intelligence per MIPB 2025), and national S nt)","obligated":"Not disclosed","awarded_value":"Not disclosed","date":"Referenced 2026-03-11","prototype_or_production":"unclear","prime_or_sub":"prime","source_url":"https://app.bigdata.com/documents/ABDAF425DF81D47B108D96C38C07003B","confidence":"LOW-MEDIUM (Tier 2 source)"}],"technical_difficulty":{"summary":"The hard part is not parsing formats; most exchange standards (MIP/JC3IEDM, NFFI, NVG, ADatP-3, CoT) are documented and libraries exist. The difficulty is (a) enforcing releasability semantics on structured, aggregated data objects so that they can cross an accredited guard automatically; (b) federating identity and attributes across nations; (c) doing both in DDIL conditions at brigade and below; and (d) passing accreditation for every enclave and guard involved. Link 16 J-series and national fire-control interfaces are export-controlled and closed.","required_expertise":["NATO/FMN standards and profiles","cross-domain solution design and NCDSMO 'Raise the Bar' accreditation","classification and releasability marking (ISM/NTK, REL/NOFORN aggregation rules)","federated identity (SAML/OIDC, ABAC, PKI across nations)","tactical data links and gateways (Link 16/22, VMF)","TAK ecosystem and CoT","zero-trust architecture in disconnected environments","RMF/ATO and NATO security accreditation"],"hardest_problem":"Automating foreign-disclosure decisions on combined/aggregated data (where the most restrictive marking dominates) in a way accrediting authorities and FDOs will accept; the policy, not the code, is the constraint.","commodity_parts":"Message parsers/serializers for public STANAGs, TAK servers and plugins, map/COP front ends, chat/email/web core services, cloud hosting at IL5/IL6, PKI."},"capital_intensity":{"proof_of_concept_usd":"$50k-$250k","credible_military_demo_usd":"$500k-$2.5M","first_production_deployment_usd":"$3M-$15M (software bridge at SBU/Secret-Releasable); $10M-$30M+ if an accredited cross-domain component is required","assumptions":"PoC: two engineers for 6-9 months building a standards bridge (CoT/NFFI/NVG/MIP) with synthetic data. Demo: a government sponsor for CWIX or Bold Quest participation (nations pay their own way), travel, a small integration with one allied C2 product, initial security documentation. Production: ATO/RMF or NATO accreditation, IL5/IL6 hosting, cleared staff, sustainment; CDS accreditation historically takes years and is why incumbents dominate. Ranges are INFERENCE from comparable software-only defense deployments, not from disclosed program costs."},"regulatory_access":{"prototype_with_commercial_unclassified_data":"partly - open standards (JC3IEDM/MIP, NFFI, NVG, CoT/TAK, ADatP-3 elements) and synthetic scenarios allow an unclassified prototype; Link 16 J-series, national fire-control interfaces and real releasability policy cannot be prototyped without government access.","government_data_required":"For anything beyond a demo: exercise data, real marking policy, partner enclave access; MPE/CENTRIXS work is on classified networks.","itar_ear":"Link 16/MIL-STD-6016 and many C2 integrations are ITAR-controlled; exporting a bridge to allied customers needs licensing; AUKUS ITAR exemptions cover only UK/Australia. Needs specialist review.","cui_likely":"Yes - FMN joining instructions, exercise architectures and most program documents are at least CUI or NATO Restricted.","classified_integration_eventually":"Yes - the highest-value flows are Secret-Releasable and NATO Secret; a durable product must reach those enclaves.","cleared_personnel_at_mvp":"Not for an unclassified/SBU tactical bridge MVP; required for any Secret-Releasable or CDS integration.","overall":"high","non_us_person_founder_note":"A non-U.S.-person founder (Indonesian national, not a NATO or Five Eyes national) cannot hold a U.S. clearance and could create FOCI and export-control issues for U.S. classified or ITAR-controlled work; a German founder could plausibly participate in NATO/EU work through a European entity (NATO DIANA is open to allied-nation firms) but NATO-classified work is also nationality-gated. The unclassified/SBU tactical bridge sub-segment is the only path that does not immediately collide with these constraints. All of this requires specialist legal review; nothing here is a legal judgment."},"unsolved_pain":[{"pain":"Officials cannot readily share classified information with allies and mission partners who are integral to CJADC2","evidence":"GAO-25-106454 states several officials cited this inability","source_url":"https://files.gao.gov/reports/GAO-25-106454/index.html","pub_date":"2025","label":"FACT"},{"pain":"Intelligence generated at collateral Secret could not be shared with allies during WFX 24-03; staff regenerated it on the MPE lower enclave with REL NATO markings using a different tool","evidence":"MIPB article on multinational intelligence sharing (WIM vs IEWTPT workaround)","source_url":"https://mipb.ikn.army.mil/issues/continuous-transformation-2025/multinational-intelligence-sharing/","pub_date":"2025","label":"FACT"},{"pain":"BICES does not communicate with mission command systems; bridging MPE and BICES called 'critical'","evidence":"Same MIPB article","source_url":"https://mipb.ikn.army.mil/issues/continuous-transformation-2025/multinational-intelligence-sharing/","pub_date":"2025","label":"FACT"},{"pain":"Coalition partners manually move information products via cross-domain solutions; battle managers watch arrays of terminals on different networks and have staff re-enter data","evidence":"SAIC perspective piece (vendor, but descriptive of workflow)","source_url":"https://www.saic.com/features/jadc2/modernizing-dod-coalition-information-sharing-for-jadc2-warfare","pub_date":"undated (~2022)","label":"FACT (workflow description from a vendor; treat scale as INFERENCE)"},{"pain":"Some nations' C2IS could not pass battlefield geometries to their national fire control systems in a coalition warfighter exercise","evidence":"Small Wars Journal article on interoperability in warfighter exercises","source_url":"https://smallwarsjournal.com/2025/11/19/interoperability-warfighter-exercises/","pub_date":"2025-11-19","label":"FACT"},{"pain":"Brigade-and-below U.S. and NATO units lacked a fast way to share SA/chat/voice, so a regiment built its own cloud-hosted kit and relies on trained LNOs","evidence":"Army article and Infantry journal on 2CR Mission Partner Kit; AUSA on Saber Strike 24","source_url":"https://www.army.mil/article/283999/mission_partner_kit_advancing_multinational_interoperability_with_nato_allies","pub_date":"2025-03-25","label":"FACT"},{"pain":"Partner networks were built 'out of necessity' as vertically integrated, domain-specific stovepipes (CFBLNet, Pegasus and others) now being consolidated; MPE still network-centric until ~2027","evidence":"DISA official quoted by Federal News Network","source_url":"https://federalnewsnetwork.com/ask-the-cio/2026/08/disa-starting-small-in-proving-out-mission-partner-environment-capabilities/","pub_date":"2026-08-13","label":"FACT"},{"pain":"NATO ACCS has taken more than two decades to connect national networks and integration remains incomplete; data transport and fusion are the most immediate bottleneck; digital backbone efforts insufficient without national policy alignment on classification, sharing and funding","evidence":"Atlantic Council analysis citing Grosswald (2026) and HCSS (2025)","source_url":"https://app.bigdata.com/documents/F111293D88A7E773FFC657BE896559B2","pub_date":"2026-06-10","label":"FACT (as reported analysis)"},{"pain":"Releasability markings do not aggregate by dominance; a combined object with any NOFORN element cannot go to any foreign national, so guards must apply the most restrictive constraint","evidence":"Anchor Defense technical article","source_url":"https://anchor-defense.com/articles/cds-cross-tagging-attribution-controls-multi-level-data-release/","pub_date":"undated (2025-2026)","label":"FACT (policy rule) / INFERENCE (operational impact)"},{"pain":"Interoperability is tested essentially once a year at CWIX ('try, fail, fix, and try again'); NATO is building INSPECT to move to continuous conformance","evidence":"NATO ACT CWIX25 article; mscoe.org","source_url":"https://www.act.nato.int/article/cwix25-concludes/","pub_date":"2025-06","label":"FACT"}],"why_not_solved":[{"reason":"classification","explanation":"The binding constraint is national disclosure policy and human FDO review, not software; data produced on national Secret systems without releasability markings cannot legally flow, so it gets regenerated or re-keyed (MIPB 2025; GAO-25-106454)."},{"reason":"certification","explanation":"Every enclave and guard needs its own accreditation; cross-domain accreditation is slow and dominated by a handful of vendors, so new automated paths take years to authorize."},{"reason":"procurement fragmentation","explanation":"Each coalition, COCOM and service built its own partner network out of necessity (DISA, 2026); NATO capability development has 'delays measured in years' (Atlantic Council, 2025-03-13); nations buy national C2 independently."},{"reason":"buyer fragmentation","explanation":"No single buyer owns coalition interoperability end to end: DISA owns MPE, Joint Staff owns Bold Quest, NATO ACT owns FMN/CWIX, NCIA buys NATO systems, nations buy national systems, and FDOs own policy."},{"reason":"integration complexity","explanation":"Dozens of national C2 systems, tactical links, simulation federations and message standards; CWIX ran >25,000 tests across ~600 capabilities in 2025 just to find and fix mismatches."},{"reason":"proprietary incumbent architecture","explanation":"ACCS (ThalesRaytheon), SitaWare, Lattice and Foundry each aim to be the 'spine'; partner bridges are offered by incumbents (Booz Allen Sit(x) on Menace) which narrows the whitespace."},{"reason":"technology only recently possible","explanation":"Data-centric security (attribute-based access, object-level tagging, zero trust) is only now being adopted by DISA (target 2027) and NATO's digital backbone, which is what makes automated releasability plausible at all."},{"reason":"insufficient commercial market","explanation":"There is no civilian analogue for multinational classified releasability; total addressable spend is program-office services money, which favors integrators over product startups."},{"reason":"it actually HAS been solved","explanation":"For unclassified/SBU tactical SA, government-owned TAK plus commercial cloud (MPK) and vendor bridges (Sit(x)) already work; the residual problem at that level is fielding and training, not invention."}],"attractiveness":{"bull":"Real, repeatedly documented pain across GAO, Army professional journals, DISA leadership and NATO analysis; DISA's data-centric CIE pivot (2027) and NGC2's data-layer approach create a window where object-level releasability tagging and standards-native bridges become procurable; NATO DIANA and allied sovereign clouds give a European founder a lawful entry path; exercise cadence (CWIX, Bold Quest, PCC, Talisman Sabre) provides visible proving grounds; open standards allow an unclassified MVP.","bear":"The binding constraints are policy, accreditation and nationality-gated access, none of which a student-founded startup can change; the paying customers are program offices that buy services from Trace, GDIT, SAIC and Booz Allen; incumbents (Anduril, Palantir, Systematic, Booz Allen) already ship partner bridges; CDS is an accredited oligopoly; a non-NATO-national co-founder blocks U.S. classified and much NATO work; unit-level demand (MPK) has no budget line; SBIR-funded translation tools have not transitioned in ~20 years.","verdict":"Medium-low for the segment overall; medium only for a narrow, unclassified/SBU tactical multinational SA bridge or for standards-conformance tooling sold to allied vendors and nations, with a required plan for eventual Secret-Releasable integration through a partner with clearances."},"market_stage":{"stage":"Transitioning","signal_sequence":[{"year":"2017","event":"production - U.S. Army selects Systematic SitaWare for CPCE","source_url":"https://www.prnewswire.com/news-releases/us-army-mission-command-awards-contract-to-systematic-inc-300402141.html"},{"year":"2018","event":"prototype/urgent need - Army Coalition Interoperability Solution tested in Europe","source_url":"https://www.c4isrnet.com/it-networks/2018/04/17/army-to-test-new-data-sharing-equipment-at-upcoming-exercise/"},{"year":"2019","event":"production services - DISA awards Trace Systems MPE-S IDIQ ($998M ceiling)","source_url":"https://app.bigdata.com/documents/8F3B0E4100D8F100F3F8DE73DCEC0D8E"},{"year":"2020","event":"production - USAREUR secret-releasable network bridges Polish and UK units pre-Defender Europe","source_url":"https://www.c4isrnet.com/yahoo-syndication/2020/07/29/how-army-network-modernization-efforts-ensure-equipment-works-with-allies/"},{"year":"2022","event":"follow-on - APAN task order under MPE-S","source_url":"https://app.bigdata.com/documents/9C23BC8625577F052AE5DA0E4E972977"},{"year":"2023","event":"sources sought - MPE Operations, Maintenance and Sustainment","source_url":"https://sam.gov/opp/c6e8de9278fc4004a42c66e24cd65786/view"},{"year":"2024","event":"prototype (unit-level) - 2CR Mission Partner Kit at Saber Strike 24; WFX 24-03 intel-sharing workaround","source_url":"https://www.ausa.org/articles/language-war-new-gear-improves-communication-partner-forces"},{"year":"2025","event":"production (NATO) - Maven Smart System NATO sole-source in six months; MPE oversight moves to DISA; CWIX25 record scale; EMITS 2 awarded","source_url":"https://www.ncia.nato.int/newsroom/news/nato-acquires-aienabled-warfighting-system"},{"year":"2026","event":"prototype-to-transition - DISA CIE tested in INDOPACOM (Olympus Fires demo); NGC2 common data baseline; DISA consolidates CFBLNet/Pegasus under PAE","source_url":"https://defensescoop.com/2026/06/03/disa-testing-mission-partner-environment-capabilities-indo-pacific/"},{"year":"2027","event":"target - DISA MPE data-centric architecture","source_url":"https://federalnewsnetwork.com/ask-the-cio/2026/08/disa-starting-small-in-proving-out-mission-partner-environment-capabilities/"}],"rationale":"The enterprise network layer is mature and in sustainment (large services IDIQs), while the data-centric layer (CIE, NGC2 data mesh, NATO digital backbone) is mid-transition with prototypes being tested in 2026 and a 2027 target. Tactical multinational bridges remain at unit-prototype stage. This mix is best described as Transitioning rather than Emerging or Mature."},"proto_purgatory":{"observed":true,"notes":"Two patterns: (1) data-translation SBIRs (IET Quik-Speak, Securboration C2OSIF, Cougaar BattleFish, Machina Cognita NOVA, RTI) spanning many years with no production transition found; (2) exercise demonstrations (ACIS 2018, MPK 2024-2025, Project Overmatch participation by small vendors with 'no definitive contract awards' per an OPT 10-K) that repeat without programs of record. Counter-evidence: MPE-S, EMITS 2, NGC2 and Maven NATO show that production money flows to integrators and platform incumbents, not to point translation tools.","opportunity_or_warning":"Warning for translation-tool and 'universal adapter' startups; opportunity only where a product rides an existing production vehicle (NGC2 data layer, DISA CIE task orders, allied C2 vendor partnerships) or a NATO sole-source style buy after proven exercise performance."},"exercise_evidence":[{"exercise":"Warfighter Exercise 24-03 (multinational)","year":"2024","quote_or_paraphrase":"WIM generated USMTF intelligence at collateral Secret, 'which precluded sharing with allied partners'; workaround was IEWTPT on the lower-enclave MPE with REL NATO marking; BICES 'does not communicate with mission command systems'","pain_keywords":["precluded sharing","workaround","lower enclave","does not communicate","bridging critical"],"source_url":"https://mipb.ikn.army.mil/issues/continuous-transformation-2025/multinational-intelligence-sharing/"},{"exercise":"Coalition Warfighter Exercise (unnamed, 2025)","year":"2025","quote_or_paraphrase":"Interoperability hindered by not enforcing adherence to guidelines when creating battlefield geometries; some nations' C2IS couldn't seamlessly pass data to their national fire control systems","pain_keywords":["couldn't pass data","hindered","incompatible"],"source_url":"https://smallwarsjournal.com/2025/11/19/interoperability-warfighter-exercises/"},{"exercise":"Saber Strike 24 / Defender 24","year":"2024","quote_or_paraphrase":"2CR fielded the Mission Partner Kit to give U.S. and NATO tactical units SA, chat, voice and collaboration at SBU, enabled by trained LNOs","pain_keywords":["workaround","liaison","disconnected"],"source_url":"https://www.ausa.org/articles/language-war-new-gear-improves-communication-partner-forces"},{"exercise":"CWIX 2025","year":"2025","quote_or_paraphrase":">3,200 participants, ~600 capabilities, 40 nations, >25,000 tests; national systems connected to a live federated network 'required to exchange data with other nations' systems under real conditions' (Terma); 'try, fail, fix, and try again'","pain_keywords":["fail","conformance","federated"],"source_url":"https://www.act.nato.int/article/cwix25-concludes/"},{"exercise":"Bold Quest 2025","year":"2025","quote_or_paraphrase":"Italy-led, >1,000 participants from 24 countries, CJADC2 experimentation with LVC and DACAS; detailed findings not public","pain_keywords":["interoperability","fratricide risk"],"source_url":"https://brigatafolgore.net/en/bold-quest-2025-italy-leads-in-the-multinational-exercise-in-virginia"},{"exercise":"Talisman Sabre 2025","year":"2025","quote_or_paraphrase":"WADS/PADS integrated with RAAF 3CRU controlling live multinational aircraft; 'Interoperability isn't just about compatible hardware - it's about people, procedures and trust'","p ited CDS or manual re-entry. 5) Partner ingests via its national system if formats align.","current_solution":"Human FDO review; CDS with static filters; policy of producing at the lowest level; DISA's planned data-centric CIE with zero trust (2027).","failure_point":"Markings are document-level and non-aggregating (NOFORN dominates), so structured/aggregated data cannot be auto-released; every new automated path needs accreditation.","evidence":[{"claim":"Officials cited inability to readily share classified information with allies and mission partners","source_url":"https://files.gao.gov/reports/GAO-25-106454/index.html","source_type":"gov","pub_date":"2025","event_date":"2024-2025","label":"FACT"},{"claim":"Collateral-Secret intel precluded sharing; regenerated on MPE lower enclave with REL NATO markings","source_url":"https://mipb.ikn.army.mil/issues/continuous-transformation-2025/multinational-intelligence-sharing/","source_type":"gov","pub_date":"2025","event_date":"2024 (WFX 24-03)","label":"FACT"},{"claim":"DISA moving MPE from network-centric to data-centric by early 2027 with zero trust","source_url":"https://federalnewsnetwork.com/ask-the-cio/2026/08/disa-starting-small-in-proving-out-mission-partner-environment-capabilities/","source_type":"independent","pub_date":"2026-08-13","event_date":"2026-2027","label":"FACT"},{"claim":"Coalition partners manually move products via CDS; battle managers distill from multiple terminals for re-entry","source_url":"https://www.saic.com/features/jadc2/modernizing-dod-coalition-information-sharing-for-jadc2-warfare","source_type":"company","pub_date":"undated","event_date":"n/a","label":"FACT (workflow) / INFERENCE (prevalence)"},{"claim":"Releasability markings must be applied as most-restrictive across combined objects","source_url":"https://anchor-defense.com/articles/cds-cross-tagging-attribution-controls-multi-level-data-release/","source_type":"company","pub_date":"undated","event_date":"n/a","label":"FACT"}],"why_startups_havent_solved":"Requires classified access, CDS-class accreditation and FDO policy acceptance; buyers are DISA/COCOM program offices served by integrators; no commercial analogue.","companies_near":["Everfox","Owl Cyber Defense","General Dynamics Mission Systems","Northrop Grumman (CHORD)","Anchor Defense","Palantir","SAIC","Booz Allen"],"incumbent_response_risk":"High - CDS vendors and Palantir/Anduril can add tagging and policy engines; DISA may build it into CIE.","technical_wedge_hypothesis":"A tagging/labeling SDK and policy-simulation tool that lets producers see releasability of a structured object at creation time (before it hits a guard), validated against FMN/ISM marking schemas; sell first as unclassified tooling for exercise data preparation.","mvp_sketch":"Open-standard (JC3IEDM/NVG/CoT) object labeler with configurable REL/NOFORN aggregation rules, audit log and a 'would this pass' simulator; demo with synthetic WFX-style data.","data_requirement":"Marking schemas and sample releasable exercise data (CUI); real policy requires government sponsor.","integration_requirement":"Downstream CDS vendors and DISA CIE; upstream C2/intel producers (SitaWare, DCGS-A successors, Maven).","entry_vehicle":"SBIR/STTR (Army, DISA), NATO DIANA challenge, or as subcontractor to a CIE task-order holder.","why_now":"DISA's 2027 data-centric target and NGC2's data-layer approach make object-level policy a procurement topic for the first time.","killer_risk":"FDO policy remains human-in-the-loop by regulation; accreditation timelines exceed startup runway; non-U.S.-person founder blocks access.","initial_attractiveness":"medium","confidence":"MEDIUM"},{"id":"S08-G2","title":"Brigade-and-below multinational SA/C2 bridge at SBU/Secret-Releasable (productized Mission Partner Kit)","problem_one_sentence":"U.S. and allied tactical units cannot quickly share position, geometry, chat and voice across national C2 systems, so regiments build ad hoc kits and rely on liaison data among coalition systems","source_url":"https://www.c4isrnet.com/it-networks/2018/04/17/army-to-test-new-data-sharing-equipment-at-upcoming-exercise/","source_type":"independent","pub_date":"2018-04-17","event_date":"2018","label":"FACT"},{"claim":"EMITS 2 includes maturing USAREUR-AF's mission partner network for NATO and other partners","source_url":"https://app.bigdata.com/documents/2D6000DCBC9681A7D5A33BF75916DE97","source_type":"company","pub_date":"2025-10-02","event_date":"2025-09","label":"FACT"}],"why_startups_havent_solved":"TAK is government-owned and free; Systematic and Anduril/Booz already offer bridges; unit-level buyers have no budget line; repeated urgent-need solutions never became programs of record.","companies_near":["Systematic","Booz Allen (Sit(x))","Anduril","TAK Product Center","Hadean","CodeMettle"],"incumbent_response_risk":"High - Sit(x) and SitaWare already market this; NGC2 data layer could absorb it.","technical_wedge_hypothesis":"A DDIL-tolerant, standards-native (CoT, NFFI, NVG, MIP-lite) edge broker that runs on a laptop/phone without cloud, with geometry validation and an LNO-friendly UI; positioned as the offline counterpart to cloud-hosted MPK.","mvp_sketch":"Edge service bridging ATAK/TAK Server to a SitaWare-compatible NFFI/NVG feed with store-and-forward sync and geometry conformance checks; demonstrate with synthetic data at an allied battle lab or CWIX Innovation Sandbox.","data_requirement":"Unclassified: public STANAG samples and synthetic scenarios; later exercise data (CUI).","integration_requirement":"TAK, SitaWare, Lattice; radio transport (TSM/other) via IP.","entry_vehicle":"NATO DIANA or CWIX Innovation Sandbox; Army xTech/SBIR; partnership with an allied C2 vendor; sale to a European MOD first.","why_now":"NGC2 fielding, DISA CIE and expanded multinational participation in PCC6 create demand for edge bridges that keep working without cloud.","killer_risk":"Government-owned TAK plus MPK is 'good enough'; incumbe apabilities; Terma intelligence platform)","source_url":"https://blog.terma.com/danish-intelligence-platform-passes-natos-coalition-data-sharing-exam","source_type":"company","pub_date":"2025-2026","event_date":"2025-06","label":"FACT"}],"why_startups_havent_solved":"Small, specialized market; NATO is building INSPECT; test cases and spiral profiles are partly NATO-restricted.","companies_near":["NATO ACT (INSPECT)","Corvus Intelligence","AIC UK","Systematic","HAVELSAN"],"incumbent_response_risk":"Very high - NATO's own INSPECT.","technical_wedge_hypothesis":"Vendor-side CI/CD conformance harness (message validators, scenario replay, FMN profile linting) sold to allied C2 vendors and national labs, complementing rather than replacing INSPECT.","mvp_sketch":"Open-source-core validator for public STANAG message sets with a hosted regression service; pilot with one allied vendor before CWIX 2027.","data_requirement":"Public STANAG specs; FMN spiral profiles (some NATO-restricted).","integration_requirement":"Vendor build pipelines; CWIX test-case catalog if accessible.","entry_vehicle":"TIDE Hackathon / CWIX Innovation Sandbox; direct vendor sales.","why_now":"FMN spirals advancing and CWIX scale growing yearly.","killer_risk":"INSPECT makes a commercial harness redundant; TAM too small to venture-scale.","initial_attractiveness":"low","confidence":"MEDIUM"},{"id":"S08-G4","title":"LLM/ontology-based semantic translation between coalition message formats (universal adapter)","problem_one_sentence":"Different national systems speak USMTF/ADatP-3, MIP, VMF, NVG and CoT and a translation layer is repeatedly proposed to bridge them.","categories":["A","I","J"],"user":"C2 integrators, exercise engineers","current_workflow":"Point-to-point gateways or manual re-entry; SBIR-funded translators demonstrated but not fielded.","current_solution":"SitaWare native multi-standard support; ACIS hub; NGC2 data transformation (Raft); numerous SBIRs (Quik-Speak, C2OSIF, BattleFish, NOVA
