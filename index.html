09-10","tier":2},{"url":"https://www.gdit.com/mission-partner-environments/","title":"GDIT: Mission Partner Environments","pub_date":"n/a","tier":2},{"url":"https://mattermost.com/blog/mission-partner-networks-are-consolidating/","title":"Mattermost: Mission Partner Networks Are Consolidating, but Collaboration Remains Fragmented","pub_date":"n/a","tier":2},{"url":"https://federalnewsnetwork.com/commentary/2024/06/usindopacom-mission-partner-environment-success-a-blueprint-for-cjadc2-path-forward/","title":"USINDOPACOM Mission Partner Environment success: A blueprint for CJADC2","pub_date":"2024-06","tier":3},{"url":"https://en.wikipedia.org/wiki/All_Partners_Access_Network","title":"All Partners Access Network (Wikipedia)","pub_date":"n/a","tier":4}]},{"segment_id":"S09","segment_name":"Cloud / DevSecOps / Software Deployment / ATO","what_it_does":"This layer is the substrate that lets any C4ISR application (C2, COP, fusion, PED, AI models) actually reach a military network and stay there. It comprises (1) accredited compute/storage environments at each Impact Level (IL2/IL4/IL5 unclassified-to-CUI, IL6 Secret, and TS/SCI regions) delivered through enterprise cloud vehicles such as JWCC, Army cArmy, and Air Force Cloud One, plus on-prem and tactical-edge compute; (2) DevSecOps platforms and 'software factories' (Platform One's Iron Bank hardened images, Big Bang Kubernetes baseline, Party Bus CI/CD; Kessel Run; Navy Black Pearl/The Forge) that build, scan, sign and deploy containers; (3) the authorization regime (RMF-based ATO, continuous ATO, FedRAMP/DISA provisional authorizations, and the 2025 SWFT and CSRMC reform initiatives) that decides whether software may run on a given network; (4) packaging and delivery tooling for air-gapped, denied/degraded (DDIL) and cross-domain (low-to-high) promotion (Zarf, UDS, Big Bang bundles, CDS-mediated transfers); and (5) marketplaces/app-store-like intake channels (Game Warden, Palantir FedStart, Tradewinds Solutions Marketplace, JWCC/AWS Marketplace listings) that let vendors reach DoD buyers with pre-accredited hosting. Functionally, it is the 'ship-and-stay-authorized' layer between code and the warfighter.","sub_taxonomy":[{"name":"Enterprise cloud vehicles and regions (JWCC, cArmy/CAMO, Cloud One, IL2-IL6, Secret/TS regions)","note":"Contract vehicles plus accredited regions. Dominated by hyperscalers and integrators; large obligated dollars; JWCC Next is being restructured into a 'Unified Cloud Marketplace' (UCM) with a hyperscaler 'Core' solicitation (Sept 2026) and a second solicitation for non-hyperscaler vendors."},{"name":"DevSecOps platforms / software factories (Platform One, Kessel Run, Black Pearl, Army Software Factory, Space Force factories)","note":"Government-owned platforms with contractor support; DoD CIO's State of DevSecOps (Mar 2025) counts 50+ software factories delivering to production. Evidence of consolidation pressure and pivots (Kessel Run 2025) but no single enterprise mandate found."},{"name":"Authorization regime and its automation (RMF/ATO, cATO, FedRAMP reciprocity, SWFT, CSRMC, eMASS/Xacta/GRC, SBOM/scanning)","note":"Policy in active flux: cATO memo (Feb 2022) -> SWFT memo (Apr 2025) -> CSRMC tenets (Sept 2025) -> FedRAMP 20x rules (mandatory Jan 2027). This is the sub-layer with the most documented pain and the least settled architecture."},{"name":"Accredited hosting / marketplace intermediaries (Game Warden, Palantir FedStart/PFCS Forward, Tradewinds, AWS Marketplace for JWCC)","note":"Commercial 'ATO-as-a-service' hosts that inherit controls so ISVs can deploy in weeks rather than a year; increasingly extending to IL6 and to on-prem/edge (PFCS Forward Feb 2026)."},{"name":"Air-gapped / DDIL / cross-domain delivery and day-2 operations (Zarf, UDS, Big Bang at edge, OpenShift/Rancher at edge, CDS-mediated promotion)","note":"The least mature sub-layer: open-source tooling exists (Zarf 2.0k stars, actively released Sept 2026) but fleet-scale update, certificate/registry lifecycle and re-accreditation across many disconnected clusters remain largely manual per available evidence (INFERENCE)."},{"name":"AI/model deployment and accreditation (GenAI.mil, CDAO, model registries, edge model updates)","note":"GenAI.mil delivers frontier models at IL5 in cloud; a formal, repeatable 'model ATO' pathway for edge-deployed models is not documented publicly (Public evidence insufficient)."}],"users":[{"role":"Software factory platform engineers / SRE","echelon":"joint / service enterprise","what_they_do":"Operate Kubernetes baselines (Big Bang, UDS, OpenShift), CI/CD pipelines, image hardening (Iron Bank), and continuous monitoring feeds that back cATO."},{"role":"Authorizing Official (AO) and ISSM/ISSO staff","echelon":"program office / component CIO","what_they_do":"Assemble and adjudicate RMF packages in eMASS/Xacta, accept or reject reciprocity, grant/deny ATO, cATO, IATT; the human bottleneck the SWFT and CSRMC reforms target."},{"role":"Program office software leads (PEO C3T, PEO Digital, AFLCMC, NAVWAR, SSC)","echelon":"division_corps to theater (program-level)","what_they_do":"Choose hosting (JWCC, cArmy, Cloud One, on-prem), contract for DevSecOps support, and own the ATO boundary for fielded C2/ISR apps."},{"role":"Signal / cyber / comms units (S6/G6, ESB, Signal Companies, Marine Comm Bn)","echelon":"battalion_brigade to division_corps","what_they_do":"Stand up and sustain tactical compute (servers, edge nodes) in the command post, load and update software in DDIL conditions, manage certificates and local registries."},{"role":"Warfighter end users of C2/COP/ISR applications","echelon":"individual_platform to theater","what_they_do":"Consume the applications; experience the layer as 'is the app on the network yet' and 'did the update arrive.'"},{"role":"Independent software vendors (ISVs) and defense startups","echelon":"n/a (supplier)","what_they_do":"Package products for IL4/IL5/IL6, obtain authorization via their own package or via a host (Game Warden, FedStart), and sustain continuous monitoring."},{"role":"Coalition/Mission Partner network operators","echelon":"coalition","what_they_do":"Field releasable software to partner enclaves; reciprocity and cross-domain movement are recurring friction points (INFERENCE from Mission Partner Environment literature; not directly evidenced in this session)."}],"buyers":[{"organization":"DISA Hosting and Compute Center / JWCC Program Office","service":"DoD-wide (DISA)","role":"contracting","note":"Runs JWCC ($9B ceiling IDIQ, Dec 2022) and the JWCC Next / Unified Cloud Marketplace follow-on (first solicitation Sept 2026, awards planned 2027)."},{"organization":"DoD CIO (Cybersecurity directorate)","service":"OSD","role":"budget owner","note":"Owns RMF/cATO policy, SWFT (Apr 2025 memo) and CSRMC (Sept 2025). CIO Kirsten Davies has publicly pushed for visibility into cloud spending (Mar 2026)."},{"organization":"Army Enterprise Cloud Management Activity (ECMA), now under ARCYBER (GO 2026-25)","service":"Army","role":"program office","note":"Delivers/governs cArmy multi-cloud, CAMO CSP resale (200+ applications), Army cloud FinOps; realigned to ARCYBER in Aug 2026."},{"organization":"AFLCMC / Platform One (HNCK) and Cloud One program office","service":"Air Force / Space Force","role":"program office","note":"Buys P1 value-stream support services (sam.gov solicitation) and Cloud One Next architecture/services (Leidos $455M ceiling TO Dec 2025; AWS $581M Jan 2026; Oracle $88M Feb 2026)."},{"organization":"Chief Digital and AI Office (CDAO)","service":"OSD","role":"operational sponsor","note":"Runs Tradewinds Solutions Marketplace and GenAI.mil; holds frontier-model contracts; de facto buyer for AI model hosting/accreditation."},{"organization":"Navy PEO Digital / NAVWAR (Black Pearl, The Forge)","service":"Navy","role":"program office","note":"Sources DevSecOps ecosystem for combat-system software ('Mission: Start the Foundry' sam.gov notice) and JWCC task orders (DVIDS announcement)."},{"organization":"Component Authorizing Officials (Army, AF, Navy, USMC, DISA, NSA for CDS)","service":"all","role":"operational sponsor","note":"Not a dollar buyer but the gatekeeper whose acceptance determines whether any product in this layer is 'sold'. Decentralized AO discretion is the core reason reciprocity fails (INFERENCE)."},{"organization":"DIU / AFWERX / Army xTech / SBIR offices","service":"all","role":"contracting","note":"Entry vehicles for startups; an SBIR topic (sbir.gov topic 12032) seeks AI/ML to automate RMF/ATO with continuous monitoring."}],"current_architecture":{"description":"A layered, multi-vendor stack: hyperscaler regions accredited at IL2-IL6 (and Secret/TS regions) purchased via JWCC or service vehicles (cArmy, Cloud One); on top, government-run DevSecOps baselines (Platform One Big Bang on Kubernetes, Iron Bank hardened images, Party Bus pipelines) or commercial equivalents (Defense Unicorns UDS, Red Hat OpenShift, Rancher/RKE2); ATO packages managed in eMASS/Xacta with STIG/InSpec evidence; and commercial accredited hosts (Game Warden at FedRAMP High/IL5 on AWS GovCloud via JWCC marketplace; Palantir FedStart/PFCS Forward at IL5/IL6 including on-prem/edge). Air-gapped delivery uses OCI-bundled packages (Zarf/UDS) moved by approved media or cross-domain solutions. FedRAMP 20x (rules mandatory Jan 1, 2027) is reshaping the civilian baseline that DoD provisional authorizations build on.","major_systems":[{"name":"Joint Warfighting Cloud Capability (JWCC)","owner":"DISA","function":"Enterprise multi-cloud IDIQ across all classification levels incl. tactical edge; $9B ceiling; >$3B in task orders reported by Aug 2025","vendor":"AWS, Google, Microsoft, Oracle","status":"Production; follow-on 'JWCC Unified Cloud Marketplace Core' solicitation released Sept 2026, awards planned 2027"},{"name":"cArmy / CAMO","owner":"Army ECMA (under ARCYBER since GO 2026-25)","function":"Army multi-cloud landing zones, CSP resale, 200+ apps migrated via CAMO","vendor":"Multiple CSPs via CAMO reseller","status":"Production; cArmy 2.0 revamp announced Mar 2024; FinOps sources sought on sam.gov"},{"name":"Cloud One / Cloud One Next","owner":"AFLCMC","function":"Air Force multi-cloud platform and common shared services","vendor":"Leidos (architecture/CSS), AWS, Oracle, Booz Allen (app modernization, reported)","status":"Production; Cloud One Next awards Dec 2025-May 2026"},{"name":"Platform One (Iron Bank, Big Bang, Party Bus)","owner":"AFLCMC/HNCK (Air Force) serving DoD","function":"Hardened container registry, Kubernetes baseline, managed CI/CD; expanding to Secret and to the tactical edge","vendor":"Government-owned with contractor support; resell agreement with Booz Allen, Seed Innovation, BrainGu, Revacomm, Indrasoft, Novetta","status":"Production; Big Bang GitHub mirror shows 12.7k commits; primary repo on repo1.dso.mil"},{"name":"eMASS (and Xacta/other GRC)","owner":"DISA / components","function":"System of record for RMF packages, POA&Ms, ATO decisions","vendor":"Government (eMASS); Telos (Xacta)","status":"Production; targeted for automation by SWFT/CSRMC; MITRE SAF/Vulcan and OSCAL exist as open tooling"},{"name":"Game Warden","owner":"Second Front Systems (commercial)","function":"Accredited DevSecOps hosting for ISVs; FedRAMP High (Aug 2025), DISA IL5 PA; first software platform on AWS Marketplace for JWCC (Feb 2026); Azure Government path (Jul 2026)","vendor":"Second Front Systems","status":"Production commercial service; deployment counts not publicly verified"},{"name":"Palantir FedStart / PFCS Forward","owner":"Palantir (commercial)","function":"Compliance-inherited hosting at FedRAMP Moderate/High, IL5 and some IL6; PFCS Forward extends IL5/IL6 to on-prem and edge (DISA authorization Feb 12, 2026)","vendor":"Palantir","status":"Production commercial service"},{"name":"Unicorn Delivery Service (UDS), UDS Registry, UDS Army; Zarf","owner":"Defense Unicorns (commercial + open source)","function":"Portable secure runtime and air-gap package delivery into classified/disconnected networks","vendor":"Defense Unicorns","status":"Commercial; Zarf v0.86.0 (Sept 17, 2026), UDS Core v1.13.1 (Sept 18, 2026); adoption claims unverified"},{"name":"GenAI.mil","owner":"CDAO","function":"Enterprise generative-AI portal routing to vendor models in accredited IL5 tenancies (Gemini Dec 2025; Grok early 2026; ChatGPT Mil by Aug 2026)","vendor":"Google, xAI, OpenAI (Anthropic under CDAO contract)","status":"Production, cloud/IL5 only"},{"name":"Tradewinds Solutions Marketplace","owner":"CDAO","function":"Video-pitch-based 'awardable' marketplace enabling direct awards under 10 USC 4022/CSO authorities","vendor":"n/a (marketplace)","status":"Active; many 2026 'awardable' announcements; award volume not public"},{"name":"Red Hat OpenShift / Rancher Government at the edge","owner":"CECOM SEC (DCGS-A) and others","function":"Container-native architecture for tactical/edge ISR processing","vendor":"Red Hat; SUSE/Rancher Government Solutions; Spectro Cloud","status":"Fielding/prototyping; DCGS-A container-native architecture on OpenShift (FedTech, Sept 2025)"}],"data_formats_protocols":["OCI images/artifacts and Helm charts","Kubernetes manifests (Big Bang/UDS values), GitOps (Flux/Argo)","SBOM formats: CycloneDX, SPDX (Syft 9.6k stars)","STIG/XCCDF, DISA CKL checklists, InSpec profiles, OHDF (MITRE Heimdall Data Format)","NIST OSCAL (955 stars; FedRAMP automation; Lula abandoned OSCAL as 'too complex')","eMASS package exports, POA&Ms","Container signing (Sigstore/cosign), FIPS-validated crypto modules","CDS transfer formats and approved-media procedures for low-to-high promotion"],"security_domain":"Spans IL2 (public), IL4/IL5 (CUI/NSS), IL6 (Secret), and TS/SCI regions; commercial hosts now reach IL6 (Palantir) and 'classified workloads' (Game Warden on AWS). Cross-domain promotion of software artifacts requires NSA-approved CDS or media transfer.","connectivity_dependency":"Enterprise cloud and cATO monitoring assume persistent connectivity to CSP regions, registries, identity providers and SIEMs; tactical edge nodes must operate with intermittent or no reachback (Army Unified Network Plan 2.0 calls for hybrid compute for DDIL formations).","what_breaks_when_disconnected":"Per vendor/practitioner sources (INFERENCE, MEDIUM): Kubernetes distributions relying on external control planes cannot deploy or update clusters; container registries, policy servers, certificate authorities and identity providers become single points of failure; continuous-monitoring evidence stops flowing so cATO status becomes stale; model and image updates revert to sneakernet/manual procedures."},"incumbents":[{"name":"Amazon Web Services","products":"GovCloud, Secret/Top Secret regions, JWCC, Cloud One IaaS ($581M award Jan 2026), Marketplace for JWCC, Modular Data Center for edge","position":"Largest JWCC recipient (55% of early ~$1B in task orders per AFCEA); de facto default for IL5/IL6 hosting."},{"name":"Microsoft","products":"Azure Government/Secret/Top Secret, JWCC (28% of early task orders), Azure Government ATO Accelerator with Second Front (Jul 2026)","position":"Second-largest JWCC vendor; strong in enterprise identity/M365 tie-ins."},{"name":"Google Public Sector and Oracle","products":"JWCC positions; Google Distributed Cloud (air-gapped), Gemini on GenAI.mil; Oracle OCI across classification levels (Cloud One $88.1M FFP, Feb 2026)","position":"Smaller JWCC shares; Google gaining via GenAI.mil and FedStart partnership."},{"name":"Palantir","products":"FedStart, PFCS Forward (IL5/IL6 on-prem/edge, Feb 2026), Apollo continuous delivery, Mission Manager","position":"Vertically integrated: hosts ISVs and deploys its own apps; moving down to edge/on-prem directly competes with UDS-class tooling."},{"name":"Leidos, Booz Allen Hamilton, CACI, SAIC, Accenture Federal, Deloitte","products":"Cloud One Next architecture (Leidos $455M ceiling), P1 support/resale (Booz Allen), app modernization, RMF/ATO support services","position":"Integrators that staff software factories and ATO packages; labor-based; Tradewinds 'awardable' listings (CACI Jun 2026)."},{"name":"Red Hat (IBM), SUSE/Rancher Government Solutions, VMware/Broadcom","products":"OpenShift (DCGS-A container architecture), RKE2/Rancher for government, Tanzu","position":"Kubernetes distributions with DoD footprint; STIG-hardened; edge variants."},{"name":"Telos (Xacta), Government eMASS, Anchore, Chainguard, GitLab Federal","products":"GRC/ATO packaging (Xacta, eMASS), SBOM/policy scanning (Anchore Enterprise underpins Iron Bank pipelines), hardened images (Chainguard), DoD-licensed GitLab in Platform One","position":"Tooling incumbents inside the DevSecOps pipeline; positioned for SWFT SBOM/scan requirements."},{"name":"Second Front Systems","products":"Game Warden (FedRAMP High, IL5 PA, AWS Marketplace for JWCC listing Feb 2026, GCP FedRAMP High, Azure Government path)","position":"The reference 'ATO-as-a-service' host for startups; reported $70M Series C (Tier 4 source, date unverified)."}],"startups":[{"name":"Defense Unicorns","product":"UDS (secure portable runtime), UDS Registry, UDS Army; maintainer of Zarf and UDS Core (open source), Lula compliance-as-code","funding":"$136M Series B led by Bain Capital Tech Opportunities, Jan 13, 2026, >$1B valuation; participation from Ansa, Sapphire, Valor, AVP, Uncorrelated (prnewswire/baincapital)","traction_evidence":"Company claims '300% YoY increase in adoption in military systems' and 'rapid and profitable growth' (company/investor statements, not independently verified). Open-source signal: Zarf 2.0k stars, Apache-2.0, releases every ~2 weeks through Sept 2026; adopters list includes Boeing (software factory to isolated networks) and Radius Methods. UDS Core AGPL-3.0, v1.13.1 (Sept 18, 2026). Named DoD contract values: Public evidence insufficient.","confidence":"MEDIUM"},{"name":"Second Front Systems","product":"Game Warden accredited DevSecOps hosting; ATO Accelerator for Azure Government","funding":"Reported $70M Series C (builtin.com, Tier 4; date/investors not verified in this session)","traction_evidence":"FedRAMP High (Aug 2025); DISA IL5 PA; first software platform authorized at IL5 on AWS GovCloud under JWCC and listed on AWS Marketplace for JWCC (Feb 12, 2026); GCP FedRAMP High (Sept 2025); Microsoft collaboration (Jul 2026); AWS APN blog on classified workloads. Count of ISVs/ATOs achieved: Public evidence insufficient.","confidence":"MEDIUM"},{"name":"Chainguard","product":"Hardened, continuously rebuilt container images and FIPS variants (positioned against Iron Bank re-hardening cycles)","funding":"Public evidence insufficient in this session (search budget exhausted before verification)","traction_evidence":"Public evidence insufficient for DoD-specific contracts.","confidence":"LOW"},{"name":"Anchore","product":"Anchore Enterprise SBOM/policy scanning; author of Syft/Grype (Syft 9.6k GitHub stars)","funding":"Not retrieved","traction_evidence":"Publishes SWFT/cATO guidance (blog Apr-Jun 2025) and air-gap DevSecOps guidance; historically embedded in Platform One/Iron Bank pipelines (INFERENCE from vendor content; not independently verified here).","confidence":"LOW"},{"name":"Legion Intelligence","product":"Centurion integrated hardware/software AI at tactical edge; DDIL-first agentic AI","funding":"Not retrieved","traction_evidence":"Company claims Centurion ran disconnected under live conditions at Scarlet Dragon 26-01 (XVIII Airborne Corps, Dec 2025). Company claim only.","confidence":"LOW"},{"name":"Spectro Cloud, Norseman, JARVIS Defense, Radius Methods","product":"Edge Kubernetes management (Palette), tactical edge deployments, air-gapped edge AI, air-gap delivery for software factories","funding":"Not retrieved","traction_evidence":"Vendor pages only; Radius Methods listed as Zarf adopter supporting military software factories. No verified DoD contract evidence in this session.","confidence":"LOW"},{"name":"Rise8, Raft, BrainGu, Revacomm, Seed Innovation","product":"DevSecOps services/platform engineering around Platform One (cATO enablement, P1 resell)","funding":"Not retrieved","traction_evidence":"BrainGu, Revacomm, Seed Innovation named in Air Force P1 resell agreement (FedScoop). Others: Public evidence insufficient in this session.","confidence":"LOW"},{"name":"RegScale, Paramify, Vanta/Drata (GRC automation)","product":"Continuous compliance / OSCAL-native ATO package automation","funding":"Not retrieved","traction_evidence":"Public evidence insufficient in this session; included as the crowded adjacent field for any 'ATO automation' wedge.","confidence":"LOW"},{"name":"HiddenLayer, Oligo Security, BlueDome/AiStrike","product":"AI security / runtime security reaching DoD via Tradewinds 'awardable' (HiddenLayer Jun 2026; BlueDome Sept 22, 2026) or FedStart (Oligo Jun 2026)","funding":"Not retrieved","traction_evidence":"Marketplace/host onboarding only; not contract or deployment evidence.","confidence":"MEDIUM"}],"government_programs":[{"name":"Software Fast Track (SWFT)","owner":"DoD CIO","description":"Apr 24, 2025 'Accelerating Secure Software' memo (Katie Arrington, performing duties of CIO) launching May 1, 2025: replaces point-in-time ATO/RMF for software with third-party assessment of vendor cyber posture on 12 risk characteristics, third-party-certified SBOMs from production and sandbox, and AI tooling on the back end; three RFIs issued to industry.","status_2026":"Vendor blogs claim SWFT moved from a 90-day pilot to an enterprise requirement by Jan 2026; some sources cite Nov 10, 2025 / Nov 10, 2026 phase dates that match CMMC's phase-in, suggesting conflation (LOW confidence on those dates). Authoritative 2026 status under CIO Kirsten Davies: Public evidence insufficient.","budget_evidence":"Public evidence insufficient (no line item retrieved).","source_url":"https://defensescoop.com/2025/04/29/dod-cio-katie-arrington-swift-software-acquisition-ato/"},{"name":"Cybersecurity Risk Management Construct (CSRMC)","owner":"DoD CIO","description":"Sept 24, 2025 strategic tenets naming CSRMC as successor to RMF: ten tenets including automation, focus on critical controls, enterprise services and inheritance, reciprocity, continuous monitoring, and ability to revoke an ATO when risk thresholds are breached.","status_2026":"Tenets published; implementation guidance and component adoption status: Public evidence insufficient.","budget_evidence":"Public evidence insufficient.","source_url":"https://media.defense.gov/2025/Sep/24/2003808111/-1/-1/1/DOD-CIO-CYBER-SECURITY-RISK-MANAGEMENT-CONSTRUCT-STRATEGIC-TENETS.PDF"},{"name":"Continuous ATO (cATO) policy and implementation guide","owner":"DoD CIO","description":"Feb 4, 2022 memo establishing cATO; implementation guide states 'many DoD Components identify obtaining an ATO as the longest step in developing and deploying software.'","status_2026":"Superseded in emphasis by SWFT/CSRMC; number of cATOs granted DoD-wide not published (INFERENCE: a small number, concentrated in software factories).","budget_evidence":"Public evidence insufficient.","source_url":"https://dodcio.defense.gov/Portals/0/Documents/Library/DoDCIO-ContinuousAuthorizationImplementationGuide.pdf"},{"name":"JWCC and JWCC Next / Unified Cloud Marketplace (UCM)","owner":"DISA","description":"JWCC IDIQ (AWS, Google, Microsoft, Oracle; $9B ceiling; Dec 2022). Follow-on restructured as a marketplace: 'JWCC UCM Core' for hyperscalers plus a second solicitation broadening vendor types; draft PWS (Jun 2026) expands AI and edge computing.","status_2026":"First of two solicitations released Sept 2026; awards planned early 2027; >$3B in task orders reported by Aug 2025; CIO Davies seeking greater visibility into cloud spend (Mar 2026).","budget_evidence":"Task-order obligations (>$3B reported) are the budget signal; ceiling is not revenue.","source_url":"https://www.washingtontechnology.com/contracts/2026/09/pentagon-unveils-first-two-solicitations-its-next-big-cloud-contract/415839/"},{"name":"Air Force Cloud One Next (C1N)","owner":"AFLCMC (with GSA)","description":"Recompete/modernization of Cloud One: architecture and common shared services (Leidos, $454.954M ceiling TO, 11 offers, through Oct 10, 2031), IaaS (AWS $581M, Jan 2026; Oracle $88.1M FFP through Dec 7, 2028), application modernization (Booz Allen $743M reported May 2026).","status_2026":"Awards made Dec 2025-May 2026; transition underway.","budget_evidence":"Task-order ceilings only; obligations not retrieved.","source_url":"https://www.washingtontechnology.com/contracts/2025/12/leidos-wins-455m-air-force-cloud-architecture-job/410094/"},{"name":"Army Enterprise Cloud Management Activity (ECMA) / cArmy / CAMO","owner":"Army (ARCYBER since GO 2026-25)","description":"Army secure multi-cloud ecosystem; CAMO agreement (Mar 2021) created centralized CSP reseller; 200+ applications milestone; cArmy 2.0 revamp (Mar 2024); FinOps sources sought.","status_2026":"Realigned from HQDA CIO to ARCYBER (Aug 2026) to converge with Unified Network Plan.","budget_evidence":"Public evidence insufficient for FY26 line items.","source_url":"https://www.army.mil/article/294863/enterprise_cloud_management_activity_officially_assigned_under_arcyber"},{"name":"Platform One (Iron Bank, Big Bang, Party Bus) and P1 Secret expansion","owner":"AFLCMC/HNCK","description":"DoD enterprise DevSecOps services; resell agreement with six contractors; expanding to Secret and pushing Big Bang toward the tactical edge (FNN, May 2024); sam.gov solicitation for value-stream support services.","status_2026":"Operating; contract recompete pending per sam.gov notice (date not retrieved).","budget_evidence":"Public evidence insufficient.","source_url":"https://federalnewsnetwork.com/technology-main/2024/05/platform-one-looks-to-enhance-build-on-software-factory-s ,{"vendor":"Palantir","customer":"DISA authorization (customer-agnostic)","vehicle":"PFCS Forward authorization (not an award)","ceiling":"n/a","obligated":"n/a","awarded_value":"n/a","date":"Feb 12, 2026","prototype_or_production":"production authorization at IL5/IL6 on-prem/edge","prime_or_sub":"prime","source_url":"https://www.businesswire.com/news/home/20260212887851/en/Palantir-Receives-DISA-Authorization-for-PFCS-Forward-Extending-IL5-and-IL6-Accreditation-to-On-Premises-and-Edge-Deployments","confidence":"HIGH"},{"vendor":"Platform One support contractors (TBD)","customer":"AFLCMC/HNCK","vehicle":"sam.gov solicitation for P1 value streams and support streams","ceiling":"Not retrieved","obligated":"n/a","awarded_value":"Pending","date":"Notice date not captured","prototype_or_production":"production services","prime_or_sub":"prime","source_url":"https://sam.gov/opp/d03ef5b9605f4b489ad8737a9017f7de/view","confidence":"LOW"},{"vendor":"Google, xAI, OpenAI (and Anthropic)","customer":"CDAO (GenAI.mil)","vehicle":"CDAO frontier AI contracts","ceiling":"Not retrieved this session (background: ceilings reported in 2025; verify)","obligated":"Not retrieved","awarded_value":"Not retrieved","date":"2025 contracts; GenAI.mil launch Dec 9, 2025","prototype_or_production":"production platform","prime_or_sub":"prime","source_url":"https://defensescoop.com/2025/12/09/genai-mil-platform-dod-commercial-ai-models-agentic-tools-google-gemini/","confidence":"MEDIUM"}],"technical_difficulty":{"summary":"The individual technologies are commodity (Kubernetes, OCI, GitOps, SBOM, scanning, signing). Difficulty is in (a) making the whole chain provably compliant and reproducible under STIG/FIPS constraints, (b) operating it across air gaps and DDIL links with no external control plane, and (c) generating authorization evidence that a human AO will accept and that another AO will reciprocally accept. The hard engineering is distributed-systems reliability under disconnection plus evidence provenance, not novel algorithms.","required_expertise":["Kubernetes internals and distribution hardening (RKE2/K3s/OpenShift), GitOps","Supply-chain security: SBOM, signing, provenance, vulnerability triage/VEX","RMF/NIST 800-53, STIG/SRG, FedRAMP, DISA CC SRG impact levels, cATO evidence design","Air-gap packaging and registry/PKI lifecycle (Zarf-class tooling)","Cross-domain solution constraints and classified network operations","Site reliability engineering for many small edge clusters","Federal contracting mechanics (OTAs/CSOs, SBIR, marketplace listings)"],"hardest_problem":"Fleet-scale, auditable day-2 operations for disconnected clusters: pushing image, model and certificate updates to dozens of air-gapped/DDIL nodes, proving what ran where and when, and keeping the authorization boundary valid without persistent reachback (INFERENCE from tooling gaps; no primary DoD document quantifying this was retrievable in-session).","commodity_parts":"Container build/scan/sign pipelines (Syft/Grype/Anchore, cosign), Big Bang/UDS Core baselines, OpenShift/Rancher, hyperscaler IL5/IL6 regions, GRC systems (eMASS/Xacta), and SBOM generation are all available off the shelf or open source."},"capital_intensity":{"proof_of_concept_usd":"$30k-$150k","credible_military_demo_usd":"$400k-$2M","first_production_deployment_usd":"$2M-$10M","assumptions":"PoC can run entirely on open-source (Big Bang mirror, UDS Core, Zarf, MITRE SAF) with commercial cloud and no government data. A credible demo needs an IL4/IL5 environment (via Game Warden/FedStart hosting fees or a government software factory sponsor), a signed CRADA/SBIR Phase I-II, and at least one US-person engineer able to handle CUI. First production implies an authorization (own package or inherited), 24/7 support, incident response, likely FedRAMP Moderate/High or IL5 via a host, and possibly cleared staff for IL6; hosting intermediaries charge recurring six-figure-per-year fees (INFERENCE; pricing not public). Ranges are estimates, not quotes."},"regulatory_access":{"prototype_with_commercial_unclassified_data":"yes - the entire stack (Big Bang GitHub mirror, UDS Core, Zarf, OSCAL/SAF, public STIGs) can be prototyped with synthetic workloads and no government data; Iron Bank/repo1 access may require DoD identity for some content.","government_data_required":"Not for the platform itself; required to demonstrate a real ATO package or a real edge deployment (CUI system security plans, network diagrams).","itar_ear":"Pure DevSecOps/deployment tooling is generally EAR (encryption items, e.g., 5D002/ENC) rather than ITAR, but any bundled mission software, CDS components or classified-network artifacts can be ITAR/USML-controlled; a specialist export-control review is required before any non-US person touches deployment artifacts (do not treat this as a legal determination).","cui_likely":"Yes: ATO packages, SSPs, POA&Ms, network diagrams and most pilot engagements are CUI; DFARS 7012/CMMC will apply to the company handling them.","classified_integration_eventually":"Yes for IL6/Secret hosting, cross-domain promotion, and most C4ISR production deployments; facility clearance (FCL) and cleared staff become necessary, which triggers FOCI mitigation if foreign ownership/control exists.","cleared_personnel_at_mvp":"No for an unclassified MVP; yes within 12-24 months for any classified/edge production path.","overall":"high","non_us_person_founder_note":"An Indonesian (non-US-person) co-founder cannot be assumed to access CUI-marked ATO artifacts, export-controlled deployment bundles, or classified environments; a German founder pending US permanent residency is also a non-US person until residency is granted. Company structure (US entity, board control, FOCI mitigation such as SSA/proxy if an FCL is needed), data segregation, and role design (business/product roles kept away from controlled technical data) need specialist legal review (immigration, export control, NISPOM/FOCI). This layer is more exposed than most because its product literally is the deployment path into DoD networks."},"unsolved_pain":[{"pain":"ATO is the longest step in delivering software; process takes months or years and costs are borne by taxpayers per program.","evidence":"DoD CIO Continuous Authorization Implementation Guide states many components identify ATO as the longest step; Arrington (Apr-May 2025) described ATO/RMF as taking months or years and requiring AI tools to make it 'faster and less expensive'.","source_url":"https://dodcio.defense.gov/Portals/0/Documents/Library/DoDCIO-ContinuousAuthorizationImplementationGuide.pdf","pub_date":"2024 (guide); 2025-04-29 (DefenseScoop)","label":"FACT"},{"pain":"RMF process is manual, inconsistent and error-prone; DoD is soliciting AI/ML automation via SBIR and public 'AI for ATO' outreach.","evidence":"SBIR topic 12032 seeks AI/ML to automate the RMF process ('relies heavily on manual efforts and human expertise, which can result in delays, inconsistencies, and potential oversights') plus continuous monitoring; Breaking Defense (Sept 2025) reports Pentagon seeking AI to streamline ATO.","source_url":"https://www.sbir.gov/topics/12032","pub_date":"Topic date not captured; Breaking Defense 2025-09","label":"FACT"},{"pain":"Reciprocity between authorizing officials fails in practice; DoD leadership had to make it an explicit CSRMC tenet.","evidence":"CSRMC strategic tenets (Sept 24, 2025) list reciprocity, enterprise services and inheritance, and automation among ten foundational tenets replacing RMF; SWFT RFI respondents backed continuous authorization.","source_url":"https://media.defense.gov/2025/Sep/24/2003808111/-1/-1/1/DOD-CIO-CYBER-SECURITY-RISK-MANAGEMENT-CONSTRUCT-STRATEGIC-TENETS.PDF","pub_date":"2025-09-24","label":"FACT"},{"pain":"Deploying and updating software at the tactical edge without reachback remains brittle: external control planes, registries, policy servers and CAs become single points of failure.","evidence":"Army Unified Network Plan 2.0 (early 2025) calls for hybrid compute for DDIL formations; practitioner/vendor writing describes control-plane and registry dependencies failing when disconnected; Platform One is explicitly working to push Big Bang to the tactical edge (FNN May 2024); CECOM SEC moved DCGS-A to container-native OpenShift.","source_url":"https://fedtechmagazine.com/article/2025/09/how-red-hat-openshift-helps-dod-tactical-edge","pub_date":"2025-09","label":"INFERENCE"},{"pain":"Cross-classification software delivery is labor-intensive and manual (approved media, CDS transfers, staged re-testing).","evidence":"Multiple vendor guides describe air-gapped delivery as 'extremely labor-intensive with slow data transfer and manual processes'; Platform One's Secret expansion and commercial IL6 hosts (Palantir, Game Warden classified on AWS) exist precisely because low-to-high promotion is hard.","source_url":"https://anchore.com/blog/dod-devsecops-air-gap-environment/","pub_date":"Undated vendor content; AFCEA 'Platform One Goes Secret' date not captured","label":"INFERENCE"},{"pain":"Proliferation of 50+ software factories creates duplicated platforms and inconsistent authorization practice.","evidence":"DoD CIO State of DevSecOps (Mar 2025) counts over 50 software factories; Kessel Run's 2025 pivot drew internal criticism; Air Force and Navy factories share code via MOUs rather than a single platform.","source_url":"https://dodcio.defense.gov/Portals/0/Documents/Library/DevSecOpsStateOf.pdf","pub_date":"2025-03","label":"INFERENCE"},{"pain":"Leadership lacks visibility into cloud spending across JWCC and service clouds.","evidence":"DoD CIO Kirsten Davies framed JWCC Next around greater visibility into cloud spending (Mar 2026); Army issued a cloud FinOps sources sought.","source_url":"https://defensescoop.com/2026/03/24/jwcc-next-cloud-spending-dod-cio-kirsten-davies/","pub_date":"2026-03-24","label":"FACT"},{"pain":"AI models reach the enterprise at IL5 via GenAI.mil, but no public, repeatable accreditation pathway exists for models updated at the disconnected edge.","evidence":"GenAI.mil is a cloud portal to IL5 tenancies (Dec 2025-Aug 2026); an Army warrant-officer journal article (Mar 2026) is titled 'Operationalizing AI at the Tactical Edge' (content not retrievable in-session); Legion Intelligence claims a disconnected AI deployment at Scarlet Dragon 26-01.","source_url":"https://www.lineofdeparture.army.mil/Portals/144/Images/Journals/WOCC/March-2026/Operationalizing-AI-at-the-Tactical/operationalizing-ai-at-the-tactical.pdf","pub_date":"2026-03","label":"HYPOTHESIS"}],"why_not_solved":[{"reason":"certification","explanation":"Authorization is a human risk-acceptance decision distributed across hundreds of AOs with personal accountability; tools can generate evidence but cannot compel acceptance or reciprocity. Every prior fix (cATO 2022, SWFT 2025, CSRMC 2025) has been a policy change, and policy is still moving, so vendors build to a target that shifts yearly."},{"reason":"buyer fragmentation","explanation":"Each service runs its own cloud (cArmy, Cloud One, Navy JWCC orders), its own factories (50+), and its own AO chain; a startup must win the same argument repeatedly, which favors incumbents with capture teams."},{"reason":"proprietary incumbent architecture","explanation":"Platform One (government-owned), Palantir (FedStart/Apollo/PFCS Forward) and hyperscalers already occupy the accredited-hosting and deployment control points; Palantir's Feb 2026 move to IL5/IL6 on-prem/edge and Defense Unicorns' $136M raise show the 'obvious' gaps are being filled by well-capitalized players."},{"reason":"integration complexity","explanation":"Edge deployment is entangled with program-specific hardware, tactical networks, PKI and CDS approvals; a generic tool without a program sponsor cannot be exercised on real equipment."},{"reason":"economics","explanation":"Government-owned platforms are free to programs and open source (Big Bang, Zarf, UDS Core, SAF) commoditizes tooling; monetization has therefore concentrated in services (integrators) or in accredited hosting (rent on the ATO), leaving thin room for pure-software startups."},{"reason":"classification","explanation":"The most painful problems (low-to-high promotion, IL6/TS updates) can only be observed and fixed by cleared, US-person teams inside classified facilities, which excludes most early-stage teams."},{"reason":"it actually HAS been solved","explanation":"For unclassified/IL5 SaaS delivery the problem is substantially solved commercially: Game Warden and FedStart provide inherited controls and marketplace access; JWCC provides regions at every level. The residual gaps are edge/DDIL day-2 operations, cross-domain promotion, evidence automation under a still-changing regime, and model accreditation."}],"attractiveness":{"bull":"Policy tailwinds are real and dated: SWFT (Apr 2025), CSRMC (Sept 2025), FedRAMP 20x (2026-27) and the JWCC UCM marketplace (2027) all push toward automated, evidence-based, marketplace-style software intake, and DoD is publicly soliciting AI for ATO automation. Open-source building blocks let a two-person team prototype at near-zero cost, and hosting intermediaries let an unclassified MVP reach IL5 without owning an ATO. Defense Unicorns' $136M/$1B+ round proves investors will fund deployment-layer companies with real DoD traction.","bear":"The layer is crowded at every profitable control point (hyperscalers, Palantir, Second Front, Defense Unicorns, integrators, GRC vendors) and the customer-owned alternative (Platform One) is free. The regulatory target moves every 12 months, the true buyer (the AO) is not a purchaser, and the hardest residual problems (edge day-2 ops, cross-domain, model accreditation) require US-person, often cleared, hands-on access that this founding team (one non-US person, one pending PR) does not have. Absence of a single dominant edge-ops vendor is not proof of demand.","verdict":"Medium-low for this team as a primary bet: attractive as an enabling capability to master (every C4ISR startup must pass through this layer) and as a narrow wedge (evidence automation or edge day-2 ops delivered through an existing host such as Game Warden/FedStart or a P1 partner), but unattractive as a standalone 'ATO platform' or 'tactical cloud' company given incumbency, policy flux and access constraints."},"market_stage":{"stage":"Transitioning","signal_sequence":[{"year":"2021","event":"prototype award: Army CAMO agreement (Mar 2021) that later became the production CSP reseller","source_url":"https://www.army.mil/article/266729/ecma_reaches_milestone_with_over_200_applications_in_camo"},{"year":"2022","event":"policy: DoD CIO cATO memo (Feb 4, 2022); production: JWCC IDIQ award (Dec 2022)","source_url":"https://dodcio.defense.gov/Portals/0/Documents/Library/20220204-cATO-memo.PDF"},{"year":"2023-2024","event":"repeat: JWCC task orders approach $1B; cArmy 2.0 (Mar 2024); Platform One pushes Big Bang to edge and to Secret","source_url":"https://www.afcea.org/signal-media/cyber-edge/militarys-cloud-sees-almost-1-billion-task-orders"},{"year":"2025","event":"RFI: SWFT memo (Apr 24) and three RFIs; State of DevSecOps (Mar); JWCC task orders >$3B (Aug); CSRMC tenets (Sept 24); production: Cloud One Next Leidos TO (Dec); GenAI.mil launch (Dec 9)","source_url":"https://defensescoop.com/2025/06/09/katie-arrington-swft-software-fast-track/"},{"year":"2026","event":"follow-on/production: Defense Unicorns $136M Series B (Jan 13); AWS $581M and Oracle $88M Cloud One (Jan-Feb); Game Warden on AWS Marketplace for JWCC and Palantir PFCS Forward (Feb 12); JWCC UCM draft PWS (Jun 1); ECMA to ARCYBER (Aug); JWCC UCM Core solicitation (Sept)","source_url":"https://www.washingtontechnology.com/contracts/2026/09/pentagon-unveils-first-two-solicitations-its-next-big-cloud-contract/415839/"}],"rationale":"Enterprise cloud and accredited hosting are in production with repeat orders (Mature within the segment); the authorization regime is mid-reform with pilots and RFIs but no settled end state (Prototyping/Transitioning); edge/DDIL deployment and model accreditation are at prototype/exercise stage. Net: Transitioning."},"proto_purgatory":{"observed":true,"notes":"For ATO automation specifically: cATO (2022) was followed by SBIR topics, SWFT pilots (2025), 'AI for ATO' outreach (2025) and CSRMC tenets (2025) without a published count of cATOs or a DoD-wide automated authorization system; open-source attempts (OSCAL-based tooling, GovReady continuous-ato-kit at 9 stars, Defense Unicorns' Lula 1 in maintenance after finding OSCAL 'too complex') show repeated partial solutions. For cloud infrastructure and accredited hosting, no purgatory: repeat task orders and recompetes are evident.","opportunity_or_warning":"Warning for 'ATO platform' plays (the bottleneck is institutional and the government keeps re-scoping the fix); qualified opportunity for evidence tooling that plugs into whatever regime emerges and for edge day-2 operations, where the purgatory reflects access constraints rather than lack of demand."},"exercise_evidence":[{"exercise":"Scarlet Dragon 26-01 (XVIII Airborne Corps)","year":"2025","quote_or_paraphrase":"Vendor states its edge AI system 'ran disconnected under live conditions'; implies disconnected operation is the test condition of interest (company claim, not government after-action).","pain_keywords":["disconnected","denied","degraded"],"source_url":"https://www.legionintel.com/blog/what-is-ddil"},{"exercise":"Army Warrant Officer journal 'Operationalizing AI at the Tactical Edge' (Line of Departure, Mar 2026)","year":"2026","quote_or_paraphrase":"Article exists on operationalizing AI at the tactical edge by a Signal warrant officer; body not retrievable in-session, so no quote captured. Public evidence insufficient for specific pain quotes.","pain_keywords":["bandwidth","disconnected"],"source_url":"https://www.lineofdeparture.army.mil/Portals/144/Images/Journals/WOCC/March-2026/Operationalizing-AI-at-the-Tactical/operationalizing-ai-at-the-tactical.pdf"},{"exercise":"Project Convergence / Talisman Sabre / Valiant Shield (software deployment friction)","year":"2024-2026","quote_or_paraphrase":"Public evidence insufficient: exercise after-action language on ATO/deployment friction was not retrievable before the session's search budget was exhausted.","pain_keywords":["manually","workaround","unable to"],"source_url":"Public evidence insufficient."}],"whitespace_placements":[{"company_or_product":"JWCC (AWS/Google/Microsoft/Oracle)","chain_steps":["COLLECT","TRANSPORT","PROCESS","FUSE","DECIDE","DISSEMINATE_TASK"],"echelons":["theater","joint","coalition","division_corps"]},{"company_or_product":"Army cArmy / CAMO (ECMA)","chain_steps":["PROCESS","FUSE","DECIDE","DISSEMINATE_TASK"],"echelons":["division_corps","theater","joint"]},{"company_or_product":"Air Force Cloud One Next (Leidos/AWS/Oracle)","chain_steps":["PROCESS","FUSE","DECIDE","DISSEMINATE_TASK"],"echelons":["theater","joint"]},{"company_or_product":"Platform One (Iron Bank/Big Bang/Party Bus)","chain_steps":["PROCESS","FUSE","DECIDE"],"echelons":["joint","theater","division_corps"]},{"company_or_product":"Second Front Game Warden","chain_steps":["PROCESS","FUSE","DECIDE","DISSEMINATE_TASK"],"echelons":["joint","theater"]},{"company_or_product":"Palantir FedStart / PFCS Forward","chain_steps":["PROCESS","FUSE","DECIDE","DISSEMINATE_TASK"],"echelons":["joint","theater","division_corps","battalion_brigade"]},{"company_or_product":"Defense Unicorns UDS / Zarf","chain_steps":["PROCESS","FUSE","DECIDE"],"echelons":["battalion_brigade","division_corps","theater","tactical_unit"]},{"company_or_product":"Red Hat OpenShift (DCGS-A container architecture)","chain_steps":["PROCESS","FUSE"],"echelons":["division_corps","battalion_brigade"]},{"company_or_product":"Rancher Government / Spectro Cloud (edge Kubernetes)","chain oundary","current_workflow":"1) Build and scan in a connected factory (P1/UDS). 2) Bundle into an OCI package (Zarf/UDS bundle). 3) Move by approved media or CDS to the target enclave. 4) Manually load into a local registry, hand-run upgrades per node, rotate certs by hand. 5) Manually record what was deployed for the ISSM. 6) Repeat per site with no fleet view.","current_solution":"Zarf/UDS (Defense Unicorns), Big Bang bundles, OpenShift/Rancher with vendor edge managers (Spectro Cloud Palette), Palantir Apollo/PFCS Forward for Palantir-hosted apps; integrator labor for everything else.","failure_point":"Registries, control planes, policy servers and CAs become single points of failure when disconnected; no vendor-neutral fleet update/attestation layer spans JWCC-hosted and edge nodes; continuous-monitoring evidence stops when links drop, so cATO status decays (INFERENCE).","evidence":[{"claim":"Army Unified Network Plan 2.0 (early 2025) explicitly requires hybrid compute for tactical formations in DDIL environments integrated with Army cloud strategy.","source_url":"https://windowsforum.com/threads/army-incremental-modernization-cloud-native-at-the-tactical-edge.391109/","source_type":"independent","pub_date":"2025","event_date":"2025","label":"FACT"},{"claim":"Platform One is working to deliver Big Bang to warfighters at the tactical edge, i.e., the government platform itself does not yet cover edge delivery.","source_url":"https://federalnewsnetwork.com/technology-main/2024/05/platform-one-looks-to-enhance-build-on-software-factory-services/","source_type":"independent","pub_date":"2024-05","event_date":"2024-05","label":"FACT"},{"claim":"CECOM SEC adopted a container-native OpenShift architecture for DCGS-A to operate reliably in DDIL environments, showing programs are re-architecting for edge containers now.","source_url":"https://fedtechmagazine.com/article/2025/09/how-red-hat-openshift-helps-dod-tactical-edge","source_type":"independent","pub_date":"2025-09","event_date":"2025","label":"FACT"},{"claim":"Multiple companies attempt partial solutions (Zarf 2.0k stars with adopters Boeing and Radius Methods; UDS Core releases through Sept 2026; Spectro Cloud, Norseman, JARVIS marketing edge deployment) but none is documented as a DoD-wide fleet standard.","source_url":"https://raw.githubusercontent.com/zarf-dev/zarf/main/ADOPTERS.md","source_type":"company","pub_date":"2026-09","event_date":"2026-09","label":"FACT"},{"claim":"Palantir extended IL5/IL6 accreditation to on-prem and edge deployments (PFCS Forward) in Feb 2026, indicating both demand and incumbent movement into this gap.","source_url":"https://www.businesswire.com/news/home/20260212887851/en/Palantir-Receives-DISA-Authorization-for-PFCS-Forward-Extending-IL5-and-IL6-Accreditation-to-On-Premises-and-Edge-Deployments","source_type":"company","pub_date":"2026-02-12","event_date":"2026-02-12","label":"FACT"},{"claim":"Disconnected operation was a live test condition at Scarlet Dragon 26-01 (Dec 2025), per a vendor.","source_url":"https://www.legionintel.com/command-papers/agentic-ai-tactical-edge","source_type":"company","pub_date":"2026","event_date":"2025-12","label":"INFERENCE"}],"why_startups_havent_solved":"Requires hands-on access to tactical kit, PKI and classified enclaves (cleared US persons); Defense Unicorns has raised $136M to own this space and Palantir now covers its own apps; open source commoditizes the packaging step so value sits in operations, which programs buy as services.","companies_near":["Defense Unicorns","Palantir (PFCS Forward/Apollo)","Red Hat","SUSE Rancher Government Solutions","Spectro Cloud","Radius Methods","Booz Allen (P1 resell)","Legion Intelligence"],"incumbent_response_risk":"High: Defense Unicorns can add fleet attestation to UDS; Palantir can bundle; hyperscalers offer edge appliances (AWS Modular Data Center, Google Distributed Cloud air-gapped) with their own update tooling.","technical_wedge_hypothesis":"A vendor-neutral 'edge fleet ledger': signed, offline-verifiable deployment manifests plus store-and-forward continuous-monitoring evidence that reconciles with eMASS/cATO dashboards when links return, running on any CNCF cluster (UDS, Big Bang, OpenShift).","mvp_sketch":"Open-source agent for K3s/RKE2 that records signed deployment state and STIG/scan evidence offline, syncs via any transport (including media), and renders a reconciled fleet view; demo across 5 simulated air-gapped clusters using Big Bang/UDS Core on commodity hardware.","data_requirement":"None classified for MVP; synthetic workloads. Real value requires a unit's actual edge stack and SSP (CUI).","integration_requirement":"Zarf/UDS bundles, Big Bang GitOps, eMASS/OSCAL export, PKI (DoD CA), CDS-compatible file formats for evidence transfer.","entry_vehicle":"Partner with a P1 resell contractor or Defense Unicorns as an add-on; AFWERX/Army SBIR (xTech) or DIU CSO; exercise participation via a brigade S6 sponsor.","why_now":"CSRMC (Sept 2025) mandates continuous monitoring and automation; Army UNP 2.0 mandates DDIL hybrid compute; JWCC UCM draft PWS (Jun 2026) expands edge computing; programs are re-platforming onto containers (DCGS-A).","killer_risk":"Access: without a cleared US-person engineer embedded with a unit, the team cannot observe or test the real failure modes; Defense Unicorns/Palantir close the gap first.","initial_attractiveness":"medium","confidence":"MEDIUM"},{"id":"S09-G2","title":"Regime-agnostic authorization evidence automation for SWFT/CSRMC/FedRAMP 20x","problem_one_sentence":"Programs and ISVs still assemble ATO evidence by hand into eMASS/Xacta while DoD shifts to SBOM-, assessment- and continuous-monitoring-based authorization (SWFT, CSRMC) and FedRAMP moves to 20x, leaving no widely adopted tool that turns pipeline artifacts into AO-acceptable, reciprocally reusable packages.","categories":["A","E","F","H"],"user":"ISSM/ISSO and AO staff; software factory compliance leads; ISV compliance engineers","current_workflow":"1) Engineers export scan/STIG/SBOM outputs from pipelines. 2) Compliance staff map them to 800-53 controls in spreadsheets. 3) Upload narratives and artifacts to eMASS. 4) Assessors validate manually. 5) AO signs; package is rarely accepted as-is by a second AO. 6) Repeat annually or on major change.","current_solution":"eMASS, Telos Xacta, RegScale/Paramify-class GRC, MITRE SAF/Heimdall and Vulcan (open source), OSCAL tooling (compliance-trestle, GSA fedramp-automation), Second Front/Palantir inheritance for hosted apps, integrator labor.","failure_point":"Tools produce data, not AO acceptance; OSCAL is 'too complex for most teams' (Defense Unicorns retired Lula 1 on this basis); the target regime changed three times in four years (cATO 2022, SWFT 2025, CSRMC 2025) so vendors and programs keep rebuilding mappings.","evidence":[{"claim":"DoD CIO memo (Apr 24, 2025) launched SWFT to replace point-in-time ATO with third-party assessments, certified SBOMs and AI-assisted risk review; three RFIs issued and responses reportedly favored continuous authorization.","source_url":"https://defensescoop.com/2025/06/09/katie-arrington-swft-software-fast-track/","source_type":"independent","pub_date":"2025-06-09","event_date":"2025-04-24","label":"FACT"},{"claim":"CSRMC tenets (Sept 24, 2025) require automation, reciprocity, inheritance and continuous monitoring as the successor to RMF.","source_url":"https://media.defense.gov/2025/Sep/24/2003808111/-1/-1/1/DOD-CIO-CYBER-SECURITY-RISK-MANAGEMENT-CONSTRUCT-STRATEGIC-TENETS.PDF","source_type":"gov","pub_date":"2025-09-24","event_date":"2025-09-24","label":"FACT"},{"claim":"A DoD SBIR topic seeks AI/ML to automate the manual, inconsistent RMF process and add post-ATO continuous monitoring (budget exists at SBIR scale).","source_url":"https://www.sbir.gov/topics/12032","source_type":"gov","pub_date":"not captured","event_date":"not captured","label":"FACT"},{"claim":"Pentagon publicly sought AI to streamline the ATO process (Sept 2025).","source_url":"https://breakingdefense.com/2025/09/ai-for-ato-pentagon-seeks-ai-to-streamline-cumbersome-cybersecurity-processes/","source_type":"independent","pub_date":"2025-09","event_date":"2025-09","label":"FACT"},{"claim":"Open-source attempts remain small or abandoned: GovReady continuous-ato-kit (9 stars), Lula 1 in maintenance after OSCAL proved too complex; MITRE SAF (188 stars) and Vulcan (87 stars) are utilities, not an authorization system.","source_url":"https://github.com/defenseunicorns/lula","source_type":"company","pub_date":"2026","event_date":"2026","label":"FACT"},{"claim":"FedRAMP 20x rules become mandatory Jan 1, 2027 with Rev5 applications ending Jun 11, 2027, forcing every cloud vendor to re-express evidence.","source_url":"https://raw.githubusercontent.com/FedRAMP/2026-markdown/main/timeline.md","source_type":"gov","pub_date":"2026","event_date":"2027-01-01","label":"FACT"}],"why_startups_havent_solved":"The buyer (AO) does not hold budget; the regime keeps changing; GRC incumbents and hosting intermediaries already capture the ISV segment; DoD may build the SWFT back end in-house or via integrators.","companies_near":["Telos (Xacta)","RegScale","Paramify","Anchore","Chainguard","Second Front","Palantir FedStart","Vanta/Drata","MITRE SAF (open source)","Defense Unicorns (Lula)"],"incumbent_response_risk":"High: eMASS successor or SWFT tooling could be government-furnished; GRC vendors can add SBOM/AI features quickly.","technical_wedge_hypothesis":"Evidence-as-code that is regime-agnostic: a control-mapping and attestation engine that ingests pipeline artifacts (SBOM, scans, STIG results, signatures) once and emits RMF, SWFT 12-characteristic, CSRMC and FedRAMP 20x KSI packages with provenance, aimed first at ISVs onboarding through Game Warden/FedStart-style hosts.","mvp_sketch":"CLI + web app that takes Syft SBOMs, Grype/Trivy scans and InSpec/CKL results from a Big Bang or UDS pipeline and generates an eMASS-importable package and a SWFT-style vendor attestation, with human review workflow; pilot with 2-3 ISVs already on an accredited host.","data_requirement":"Public STIGs/SRGs, NIST catalogs, FedRAMP 20x rules (GitHub); real SSPs are CUI and need a US-person handler.","integration_requirement":"eMASS import formats, OSCAL, MITRE OHDF, CI systems (GitLab in P1), host platforms' compliance APIs.","entry_vehicle":"SBIR topic on AI/ML ATO automation; Tradewinds 'awardable' listing; partnership/marketplace with Second Front or Defense Unicorns; commercial ISV customers first (they pay because ATO delay is their revenue delay).","why_now":"SWFT and CSRMC created a documented, dated demand for automation; FedRAMP 20x forces re-work industry-wide in 2026-27; AI-assisted narrative generation is newly credible.","killer_risk":"Government issues its own SWFT tooling or mandates a specific GRC, collapsing the market; AOs refuse machine-generated packages.","initial_attractiveness":"medium","confidence":"MEDIUM"},{"id":"S09-G3","title":"Low-to-high software promotion (cross-domain container/model delivery) with reusable accreditation","problem_one_sentence":"Moving containerized applications and models from unclassified factories to Secret/TS networks depends on approved media, cross-domain solutions and re-accreditation, so each classified update is slow, manual and program-specific.","categories":["A","D","F","J"],"user":"Software factory release engineers, ISSMs on SIPR/JWICS enclaves, program offices fielding at IL6+","current_workflow":"1) Build and harden on low side (Iron Bank/P1). 2) Package (Zarf) and burn to approved media or submit through a CDS with content inspection. 3) Manually import on the high side, re-scan, re-run STIG checks. 4) Update the classified ATO package. 5) Repeat for every release.","current_solution":"Platform One Secret expansion, Game Warden classified workloads on AWS, Palantir IL6/PFCS Forward, hyperscaler Secret/TS regions, NSA-approved CDS vendors; otherwise labor.","failure_point":"Every hop is a human-mediated transfer with duplicated scanning and packaging; no public evidence of an automated, reciprocity-accepted promotion path across the majority of classified enclaves (INFERENCE).","evidence":[{"claim":"Platform One expanded services to the Secret level, reflecting demand to run factories on high side rather than promote from low side.","source_url":"https://www.afcea.org/signal-media/cyber-edge/platform-one-goes-secret","source_type":"independent","pub_date":"not captured","event_date":"not captured","label":"FACT"},{"claim":"Commercial hosts extended into classified: Game Warden 'enables classified workloads on AWS' (AWS APN blog); Palantir PFCS Forward IL6 on-prem/edge (Feb 2026).","source_url":"https://aws.amazon.com/blogs/apn/how-second-front-game-warden-enables-classified-workloads-on-aws/","source_type":"company","pub_date":"not captured","event_date":"2026-02-12","label":"FACT"},{"claim":"Air-gapped delivery is described by multiple vendors as labor-intensive with slow, manual transfer; Zarf exists specifically to reduce this and is adopted by Boeing and Radius Methods for isolated networks.","source_url":"https://anchore.com/blog/dod-devsecops-air-gap-environment/","source_type":"company","pub_date":"undated","event_date":"n/a","label":"INFERENCE"}],"why_startups_havent_solved":"Requires cleared US-person staff, a facility clearance, NSA CDS approvals and program sponsorship; economics favor incumbents already inside the enclaves.","companies_near":["Platform One","Second Front","Palantir","Defense Unicorns","Owl Cyber Defense / Forcepoint (CDS)","AWS/Microsoft/Google Secret regions"],"incumbent_response_risk":"Very high; this is core to Palantir and Defense Unicorns and to the hyperscalers' classified strategy.","technical_wedge_hypothesis":"None credible for this team without clearances; at most a low-side 'promotion-ready' packaging/attestation standard that high-side operators adopt (adjacent to G2).","mvp_sketch":"Not recommended as a standalone MVP for a non-US-person founding team.","data_requirement":"Classified enclave access for any real validation.","integration_requirement":"CDS filters, high-side registries, classified eMASS instances.","entry_vehicle":"Only via a cleared prime/partner.","why_now":"Same policy tailwinds as G2, but access constraints dominate.","killer_risk":"Founding team cannot legally work on the product's core; classified as J (no real startup opportunity) for this team despite being a genuine gap.","initial_attractiveness":"low","confidence":"MEDIUM"},{"id":"S09-G4","title":"Model deployment and accreditation for disconnected edge AI","problem_one_sentence":"GenAI.mil and cloud IL5 tenancies deliver models to connected users, but there is no publicly documented, repeatable way to version, accredit, distribute and roll back ML/LLM models on disconnected tactical nodes as part of an authorization boundary.","categories":["A","D","F","I"],"user":"Brigade/division data teams and Signal units; CDAO/AI RCC deployment teams; program offices fielding AI on edge kits","current_workflow":"1) Model trained/selected in cloud. 2) Packaged ad hoc into a container. 3) Delivered like any container (media/CDS). 4) Accreditation handled as a software change with no model-specific evidence (INFERENCE). 5) Updates are infrequent and manual.","current_solution":"GenAI.mil for enterprise; vendor appliances (Legion Centurion, JARVIS Defense); Palantir for Palantir-hosted models; program-specific one-offs.","failure_point":"No public model-accreditation standard for the edge; model updates conflate with software updates; evidence for AI assurance not integrated with cATO tooling (HYPOTHESIS).","evidence":[{"claim":"GenAI.mil (Dec 9, 2025) hosts Gemini, Grok and ChatGPT Mil in IL5 cloud tenancies for 3M+ personnel; no edge/disconnected tier described.","source_url":"https://defensescoop.com/2025/12/09/genai-mil-platform-dod-commercial-ai-models-agentic-tools-google-gemini/","source_type":"independent","pub_date":"2025-12-09","event_date":"2025-12-09","label":"FACT"},{"claim":"Army professional journal published 'Operationalizing AI at the Tactical Edge' (Mar 2026) by a Signal warrant officer, indicating field-level attention; content not retrievable in-session.","source_url":"https://www.lineofdeparture.army.mil/Portals/144/Images/Journals/WOCC/March-2026/Operationalizing-AI-at-the-Tactical/operationalizing-ai-at-the-tactical.pdf","source_type":"gov","pub_date":"2026-03","event_date":"2026-03","label":"FACT"},{"claim":"Vendors market disconnected edge AI appliances and claim exercise use (Scarlet Dragon 26-01), suggesting demand but only company-sourced evidence.","source_url":"https://www.legionintel.com/blog/what-is-ddil","source_type":"company","pub_date":"2026","event_date":"2025-12","label":"INFERENCE"}],"why_startups_havent_solved":"Model accreditation policy is undefined publicly; access to edge kits and exercises is gated; CDAO and frontier vendors dominate the enterprise tier.","companies_near":["Legion Intelligence","JARVIS Defense","Palantir","Defense Unicorns (UDS AI packages)","HiddenLayer (AI security via Tradewinds)","CDAO/GenAI.mil vendors"],"incumbent_response_risk":"Medium-high: Palantir and Defense Unicorns can add model registries; CDAO could publish a standard that vendors implement.","technical_wedge_hypothesis":"Model-as-artifact packaging with signed lineage, offline evaluation evidence and rollback, integrated with the edge fleet ledger of G1.","mvp_sketch":"Extension of the G1 agent that treats models as OCI artifacts with attached eval/provenance evidence and offline rollback; demo with open-weight models on K3s edge nodes.","data_requirement":"Open-weight models and synthetic data for MVP; real value requires unit data (CUI+).","integration_requirement":"OCI registries, Zarf/UDS, eMASS/OSCAL, CDAO AI assurance guidance when published.","entry_vehicle":"CDAO Tradewinds listing; Army AI SBIR/xTech; DIU edge AI solicitations.","why_now":"GenAI.mil normalized model consumption in 2026; edge AI exercises increasing; CSRMC continuous monitoring will need to cover models.","killer_risk":"Evidence base is thin (mostly vendor claims); this may be a feature of G1 rather than a company.","initial_attractiveness":"low","confidence":"LOW"},{"id":"S09-G5","title":"Cross-vehicle cloud spend/FinOps visibility (JWCC, cArmy, Cloud One)","problem_one_sentence":"DoD leadership and the Army have publicly stated they lack visibility into cloud spending across vehicles, prompting JWCC Next's marketplace design and an Army FinOps sources sought.","categories":["C","H","E","J"],"user":"DoD CIO, DISA, ECMA, program cloud managers","current_workflow":"Per-vehicle billing exports reconciled manually by integrators and CSP resellers (CAMO).","current_solution":"CSP-native cost tools, Kion/Apptio/CloudHealth-class FinOps products, integrator services.","failure_point":"Fragmented vehicles and resellers; procurement rather than technology problem.","evidence":[{"claim":"DoD CIO Kirsten Davies wants greater visibility into cloud spending via the JWCC Next overhaul (Mar 2026).","source_url":"https://defensescoop.com/2026/03/24/jwcc-next-cloud-spending-dod-cio-kirsten-davies/","source_type":"independent","pub_date":"2026-03-24","event_date":"2026-03","label":"FACT"},{"claim":"Army posted an Enterprise Cloud FinOps opportunity on sam.gov.","source_url":"https://sam.gov/workspace/contract/opp/1aa5aef4c9f1404aac08b881943f3401/view","source_type":"gov","pub_date":"not captured","event_date":"not captured","label":"FACT"},{"claim":"JWCC UCM draft PWS (Jun 2026) designs a marketplace intended to improve visibility and expand vendors.","source_url":"https://defensescoop.com/2026/06/01/pentagon-jwcc-ucm-draft-performance-of-work-statement/","source_type":"independent","pub_date":"2026-06-01","event_date":"2026-06","label":"FACT"}],"why_startups_havent_solved":"Commodity Fi ht","MPE policy"],"startup_relevance":"SWFT determines how fast a startup's software can be authorized: SBOMs, third-party assessment, continuous monitoring artifacts. A startup should design for SWFT/cATO evidence from day one; riding a platform with an existing ATO (Maven/Palantir FedStart, JWCC CSP enclaves) is the practical shortcut.","source_url":"https://defensescoop.com/2025/06/09/katie-arrington-swft-software-fast-track/","pub_date":"2025-06-09","confidence":"HIGH"},{"name":"Joint Staff J6 (Command, Control, Communications and Computers/Cyber Directorate)","acronym":"JS J6","parent":"Joint Staff (Chairman of the Joint Chiefs)","role":"requirement owner","portfolio":"CJADC2 strategy and joint requirements; Joint Fires C2 interoperability (legacy PE 0604828J Joint Fires Integration and Interoperability Team); Mission Partner Environment requirements lead; RECALL: JADC2 Cross-Functional Team (chartered 2020) sits in J6; Project Dynamis is a 2025-2026 J6-associated CJADC2 effort working with the Air Force JFN IPO (VERIFIED-SEARCH snippet, details LOW).","current_status_2026":"VERIFIED-SEARCH: May 2026 National Defense Magazine reporting says the services are 'honing in on the joint part' of CJADC2 and that Project Dynamis works closely with the Air Force JFN integrated program office stood up in Oct 2025. Under the March/April 2026 Feinberg memos, Maven becomes the CJADC2 cornerstone, which shifts practical CJADC2 integration authority toward CDAO. Public evidence insufficient (this session) on the current J6 Director's name and on whether the JADC2 CFT was renamed under the 2025 requirements reform.","leader_title":"Director, J6 (Lieutenant General)","key_programs":["CJADC2 strategy / Project Dynamis","Joint Fires C2 interoperability","Mission Partner Environment (requirements)","JADC2 Cross-Functional Team"],"startup_relevance":"Requirement owner, not a buyer. Useful for understanding joint standards (data models, MPE) but a startup will not get a contract her owing to three priorities and is the front door for the DRPM-UxS unmanned portfolio.","typical_award_size":"RECALL: low single-digit $M to ~$15M prototype OTs; production follow-ons can reach tens/hundreds of $M (verify against GAO-25-106856).","timeline":"RECALL: DIU targets 60-90 days from solicitation close to award; solicitation windows typically 2-4 weeks.","recent_examples":[{"company":"Public evidence insufficient (2026 C2-specific awardees not retrievable)","what":"n/a","amount":"n/a","date":"n/a","source_url":"https://www.diu.mil/"}],"fit_for_two_founder_startup":"MEDIUM-LOW at $250k: DIU wants an existing commercial product with demonstrated traction and the ability to deliver a prototype in months; a pre-product team should first build with SOCOM/NSIN/xTech-type doors and return to DIU with a product.","eligibility_notes":"OTs carry no US-citizenship ownership test; non-traditional defense contractor status is easy to meet; foreign ownership is permissible but each project may impose security, export (ITAR/EAR) and data-access conditions that a non-US-person founder must be screened against. Needs specialist legal review."},{"pathway":"prototype OT","how_it_works_here":"CDAO (via Tradewinds assessments or CDAO CSO-style opportunities), DIU, DISA and SOCOM all award prototype OTs. Tradewinds 'awardable' status satisfies competition so any DoD buyer with funds can award quickly; Open DAGIR onboarding can precede an OT.","typical_award_size":"RECALL: $250k-$5M pilots at CDAO; larger at DISA.","timeline":"Tradewinds assessment ~30-60 days from monthly close (RECALL); award timing depends entirely on sponsor funding.","recent_examples":[{"company":"CACI","what":"Assessed 'awardable' in Tradewinds (not an award)","amount":"n/a","date":"2026-06-16","source_url":"https://investor.caci.com/2026-06-16-CACI-Assessed-Awardable-for-Department-of-War-Work-in-the-CDAOs-Tradewinds-Solutions-Marketplace"},{"company":"BlueDome (AiStrike)","what":"Assessed 'awardable' in Tradewinds","amount":"n/a","date":"2026-09-22","source_url":"https://www.financialcontent.com/article/bizwire-2026-9-22-bluedome-powered-by-aistrike-achieves-awardable-status-on-the-department-of-war-cdaos-tradewinds-solutions-marketplace"}],"fit_for_two_founder_startup":"HIGH for intake (a 5-minute video is within reach), LOW-MEDIUM for conversion without a sponsor; use it as a credentialing step while hunting a funded user.","eligibility_notes":"Any vendor may submit; SAM registration required for award; no citizenship ownership test, but ITAR/data-access screening applies per project."},{"pathway":"production OT","how_it_works_here":"Follow-on production under 10 USC 4022(f) after a successful competitively awarded prototype (DIU, CDAO, SOCOM). The Maven scale-up (prototype OT to $1.3B ceiling to program of record) is the archetype.","typical_award_size":"Tens to hundreds of $M ceilings; obligations far lower and incremental.","timeline":"Years; requires a prototype success memo (DIU 'Success Memo' construct, RECALL) and a component willing to fund.","recent_examples":[{"company":"Palantir","what":"Maven Smart System prototype scaled to enterprise use, then program of record","amount":"$480M initial; ~$1.3B ceiling (2025); FY2027 ~$2.3B/5yr request (secondary)","date":"2024-05 to 2026-03","source_url":"https://www.govconwire.com/articles/pentagon-palantir-maven-ai-program-of-record"}],"fit_for_two_founder_startup":"Not a starting point; the goal state 3-5 years out.","eligibility_notes":"Same as prototype OT; production deals attract FOCI/foreign-ownership scrutiny if classified access is needed."},{"pathway":"SBIR/STTR","how_it_works_here":"OSD, DARPA, DIU-hosted and SOCOM topics appear in the DoD SBIR/STTR BAAs; Phase I ~$150-300k, Phase II ~$1-2M, Direct-to-Phase-II available for some components; OSD topics on C2/AI appear periodically.","typical_award_size":"Phase I $150k-$300k; Phase II $1M-$2M; D2P2 up to ~$2M (RECALL; verify current DoD SBIR BAA).","timeline":"6-9 months from topic release to Phase I award (RECALL).","recent_examples":[{"company":"Public evidence insufficient (specific 2026 OSD/DARPA C2 SBIR awardees not retrievable)","what":"n/a","amount":"n/a","date":"n/a","source_url":"https://www.sbir.gov/"}],"fit_for_two_founder_startup":"MEDIUM for the engineer-led team if eligible; non-dilutive and standard for university spinouts.","eligibility_notes":"SBIR/STTR requires a for-profit U.S. small business more than 50% owned and controlled by U.S. citizens or permanent resident aliens (or by other such small businesses). With one founder expected to be a permanent resident and one non-U.S.-person founder, the cap table must keep majority ownership/control with U.S. persons; the SBIR/STTR Extension Act of 2022 also requires foreign-affiliation disclosures. Germany and Indonesia are not 'countries of concern', but the ownership test is binding. Needs specialist legal review; do not assume eligibility."},{"pathway":"BAA","how_it_works_here":"DARPA office-wide and program BAAs (STO/I2O) and OSD/R&E BAAs fund research prototypes on resilient C2, autonomy, AI reinforcement; awards are contracts, grants or OTs.","typical_award_size":"Hundreds of $k (seedlings/Disruptioneering) to $10M+ (program performers).","timeline":"6-12 months; abstracts often required first.","recent_examples":[{"company":"Public evidence insufficient.","what":"n/a","amount":"n/a","date":"n/a","source_url":"https://www.darpa.mil/"}],"fit_for_two_founder_startup":"LOW-MEDIUM: technically credible for a strong engineer but slow, IP-encumbered and not a route to a fielded product.","eligibility_notes":"Foreign participation allowed subject to export control; fundamental-research designation matters for the non-U.S.-person founder's access. Needs legal review."},{"pathway":"subcontract","how_it_works_here":"Ride an incumbent: Palantir (Maven/Open DAGIR third-party app, FedStart ATO inheritance - RECALL), SAIC (JFN integrator), Booz Allen (Advana/Thunderdome), or the four JWCC CSPs' marketplaces. The 2026 Maven program-of-record consolidation onto a single Army EA makes 'app on Maven' the dominant joint-level route.","typical_award_size":"$100k-$2M task-level subcontracts.","timeline":"3-9 months if the prime has a funded need.","recent_examples":[{"company":"Public evidence insufficient.","what":"n/a","amount":"n/a","date":"n/a","source_url":"https://www.ai.mil/Latest/News-Press/PR-View/Article/4026085/cdao-highlights-progress-in-scaling-data-and-ai-capabilities-at-six-month-mark/"}],"fit_for_two_founder_startup":"HIGH practicality, but strategic dependency on the prime's platform and roadmap.","eligibility_notes":"Prime flow-downs (DFARS 7012/CMMC, ITAR) apply; a non-U.S.-person founder may be excluded from ITAR technical data unless licensed. Needs legal review."},{"pathway":"consortium OTA","how_it_works_here":"OSD-relevant consortia (e.g., the Information Warfare Research Project and SOSSEC/C5-type consortia - RECALL) issue requests for prototype proposals; membership is inexpensive and awards are OTs executed by the consortium manager.","typical_award_size":"$500k-$10M.","timeline":"3-6 months from RPP.","recent_examples":[{"company":"Public evidence insufficient.","what":"n/a","amount":"n/a","date":"n/a","source_url":"Public evidence insufficient."}],"fit_for_two_founder_startup":"MEDIUM: cheap to join, but proposals compete with established integrators.","eligibility_notes":"Consortium membership rules may restrict foreign-owned members; verify each consortium's terms."},{"pathway":"Naval innovation","how_it_works_here":"Not a joint pathway, but SOCOM's SOFWERX (partnership intermediary) plays the equivalent role at the joint/SOF level: assessment events, tech sprints, Small Business Boot Camp, leading to PEO-SDA CSO OTs.","typical_award_size":"$100k-$3M SOF software OTs (RECALL).","timeline":"SOFWERX events monthly; OT awards 2-6 months after a successful assessment.","recent_examples":[{"company":"Public evidence insufficient (2026 PEO-SDA awardees).","what":"n/a","amount":"n/a","date":"2026-03-24 (SBBC 6)","source_url":"https://events.sofwerx.org/small-business-boot-camp-sbbc-6"}],"fit_for_two_founder_startup":"HIGH: lowest-friction joint-level software buyer with real users and IP retention.","eligibility_notes":"SOF work often requires clearances for on-site integration; the founders' clearance limitations (non-citizen, LPR) constrain which tasks they can perform personally. Needs legal review."},{"pathway":"allied","how_it_works_here":"For a German founder: Bundeswehr Cyber Innovation Hub, NATO DIANA accelerator, NATO NCIA procurement, and the German Zeitenwende budget offer alternative C2 software buyers; NATO's own Maven adoption (RECALL) shows alliance-level demand for interoperable apps.","typical_award_size":"DIANA grants ~EUR 100k-300k; NCIA contracts vary.","timeline":"6-12 months.","recent_examples":[{"company":"Public evidence insufficient.","what":"n/a","amount":"n/a","date":"n/a","source_url":"Public evidence insufficient."}],"fit_for_two_founder_startup":"MEDIUM: relevant hedge given immigration/ITAR frictions in the U.S. path; covered in depth by the allied-market agent.","eligibility_notes":"EU/NATO entity requirements; U.S. export controls still apply to U.S.-origin technology."}],"chains":[{"problem_area":"Joint targeting / AI-enabled decision support at combatant commands (Maven)","user":"COCOM JOC battle managers, targeteers, intelligence analysts (INDOPACOM, CENTCOM, EUCOM), Joint Staff, Marine Corps","requirement_owner":"Deputy Secretary directives (Mar/Apr 2026) and Joint Staff J6 CJADC2 framework; COCOM J2/J3","program_office":"CDAO MSS Program Office (from NGA, 2026)","contracting_office":"Army Contracting Command via the Army Enterprise Agreement (Palantir); CDAO/WHS AD for OTs","budget_line":"OSD RDT&E D8Z CDAO lines + FY2027 ~$2.3B/5yr MSS request (secondary source)","contract_vehicle":"Prototype OT converted to enterprise agreement; ov and get a CAGE code; prepare an SBOM and SWFT-style assurance artifacts from the first build. (2) Month 1-3, credential cheaply: submit a 5-minute video to the CDAO Tradewinds Solutions Marketplace (monthly windows through May 2027) to obtain 'awardable' status; attend SOFWERX events and the next Small Business Boot Camp; enter NSIN/DIU early-stage programs to find a unit problem owner. (3) Month 3-9, find a funded user, not a policy office: PEO-SDA (SOCOM) CSO for a small prototype OT; CENTCOM REJTF/TF-59/TF-99 for an in-theater trial (contracted through DIU or SOCOM); a service-level door (AFWERX, xTech, Army NGC2 ecosystem, SpaceWERX) if the product maps there. (4) Month 6-12, position inside the platform reality: apply for Open DAGIR onboarding/third-party app status on the Maven data environment and Palantir's startup/ATO-inheritance program, since the 2026 Maven program-of-record decision makes 'app on Maven' the dominant joint route; alternatively subcontract to SAIC on JFN. (5) Month 9-18, scale via OT: convert a successful prototype into a DIU or SOCOM production OT, and pursue GIDE participation via the CDAO sponsor. (6) Avoid: DISA/JWCC/Thunderdome direct pursuit, OSC loans, and DARPA as a first revenue source. (7) Hedge: NATO DIANA/Bundeswehr routes for the German founder. Throughout, track the DIU three-priority narrowing (autonomy/lethality emphasis) and DRPM-UxS: a C2 product that controls or tasks unmanned systems has a clearer joint-level sponsor in 2026 than a generic staff COP.","search_log":[{"query":"\"Portfolio Acquisition Executive\" Pentagon acquisition reform 2026","useful":true},{"query":"CDAO \"Open DAGIR\" Maven Smart System enterprise contract 2026","useful":true},{"query":"Joint Staff J6 CJADC2 \"Joint Fires Network\" 2026","useful":true},{"query":"DISA Thunderdome zero trust DODNet JWCC 2026 site:disa.mil","useful":true},{"query":"Defense Innovation Unit \"DIU 3.0\" commercial solutions opening 2026 portfolio","useful":true},{"query
