tion","Tactical radios, SATCOM, unified network transport (legacy ITN/WIN-T replacement)"],"startup_relevance":"HIGH. This is the program office that awarded both NGC2 prototype OTAs and that owns the four NGC2 layers (applications, data, infrastructure, transport) into which the Army is consolidating C2 funding lines. Practical entry for a two-founder startup is as a team member/subcontractor to an NGC2 team lead (Anduril or Lockheed) or via xTech/SBIR topics sponsored by CPE C2IN, not as a prime on a $26M-$100M OTA.","source_url":"https://www.army.mil/article/289377/major_reorganization_for_peo_c3n_supports_army_approach_to_next_generation_command_and_control","pub_date":"2025-12 (reorg article); 2024-10-09 (C3T->C3N); 2026-02-20 (C2IN bio PDF)","confidence":"MEDIUM"},{"name":"Capability Program Executive Intelligence and Spectrum Warfare (formerly PEO IEW&S; interim 'CPE IEW&S')","acronym":"CPE ISW","parent":"ASA(ALT) Army acquisition portfolio structure","role":"program office","portfolio":"Intelligence, electronic warfare, cyber, integrated base defense, force protection, positioning-navigation-timing, biometrics, target recognition (per cpeisw.army.mil description as of mid-2026). Includes PM Intelligence Systems & Analytics (PM IS&A, owner of TITAN) and PM Electronic Warfare & Cyber (PM EW&C, confirmed by cpeisw.army.mil category page). PM PNT and PM Sensors-Aerial Intelligence: names carried over from PEO IEW&S; current status under CPE ISW not independently verified in this run.","current_status_2026":"FACT (MEDIUM): PEO IEW&S transitioned to Capability Program Executive naming; cpeisw.army.mil URL slugs show 'CPE IEW&S' on a 2024-12-23 article and 'CPE ISW' on 2025-04-25 and 2026-09-01 items; DVIDS unit 'CPE-IEWS' is titled 'Capability Program Executive - Intelligence & Spectrum Warfare'. Exact rename date: Public evidence insufficient (INFERENCE: late 2025 to early 2026, aligned with the Army-wide PEO->CPE shift). Government-owned HYDRA API created to add 2 capability portfolio across four layers)","pe_number_or_line":"Public evidence insufficient for PE numbers in this run (the FY2026 Army RDT&E justification books - asafm.army.mil RDTE Vol 2 BA 4B and Vol 3 BA 5D - could not be fetched). Reported FY2026 layer lines: C2 Applications $488.4M (RDT&E); C2 Data $306.1M (RDT&E+Proc); C2 Infrastructure ~$1.36B (RDT&E+Proc); C2 Transport ~$1.36B (RDT&E+Proc). Do not cite a PE number for NGC2 until verified.","fy26_request":"~$3.3B total across layers (DefenseScoop 2025-07-02); other outlets report $2.9B-$3B depending on scope (MeriTalk). Congress subsequently capped FY2026 NGC2 funding (amount not retrieved).","fy27_request":"~$4B for NGC2 per Breaking Defense (2026-04) budget-materials coverage; layer breakdown not retrieved.","source_url":"https://defensescoop.com/2025/07/02/army-next-gen-command-and-control-budget-2026-request-3-billion/"},"third_party_software_openness":"FACT (from Army/vendor statements, not independent test): NGC2's data integration layer is meant to allow rapid buildout of apps across warfighting functions (fires, intel, logistics, protection) and a common COP; layers interface via 'Government approved, non-proprietary APIs'; the Army says it wants on-ramps/off-ramps to onboard or offboard vendors and capabilities based on performance, and told industry to 'bring your core strength' (army.mil/article/290431). Team Anduril members and later joiners (e.g., Rune Technologies for logistics) show third-party apps entering via the team lead. Caveat: the actual API specifications and whether an independent startup can integrate without the team lead's sponsorship are not publicly documented in retrieved material - INFERENCE, MEDIUM confidence."},{"name":"C2 Fix","owner":"CPE C2IN (formerly PEO C3N)","description":"Interim modernization of division/brigade C2 and network launched 2022 as a bridge to NGC2: on-the-move and at-the-quick-halt operations, simplified lower-echelon processes, improved voice, shared common operating picture; also framed under 'Adaptive C2'.","status_2026":"FACT: first fielding early 2024 to 1st Armored Division; fielded to 25th ID (basis for Lockheed data-layer prototype); III Armored Corps reported replacing legacy WIN-T with the modern C2 baseline (TheDefenseWatch, date not retrieved). Continues fielding while NGC2 matures.","vendors":["Public evidence insufficient in this run for the C2 Fix vendor list"],"contract_evidence":[],"budget":{"appropriation":"Procurement and RDT&E (folded into NGC2 transport/infrastructure lines per FY2026 consolidation - INFERENCE)","pe_number_or_line":"Public evidence insufficient.","fy26_request":"Not separately retrieved","fy27_request":"Not separately retrieved","source_url":"https://www.army.mil/article/286205/adaptive_c2_modernizing_army_command_and_control"},"third_party_software_openness":"Public evidence insufficient; C2 Fix is largely fielded commercial/COTS network and C2 kit, so openness is vendor-specific."},{"name":"Tactical Intelligence Targeting Access Node (TITAN)","owner":"CPE ISW / PM Intelligence Systems & Analytics (PM IS&A)","description":"AI-enabled, expeditionary intelligence ground station fusing space, aerial and terrestrial sensor data into targeting information for long-range fires; Advanced and Basic variants.","status_2026":"FACT: Palantir became prime after a March 2024 prototype award (cpeisw.army.mil 2024-03-06; value not retrieved in this run). FACT: On 2026-09-01 the Army announced the move to production with $192M in initial delivery orders: Palantir $127M, Anduril $65M (ruggedized hardware), for eight initial production systems (four TITAN Advanced, four TITAN Basic) delivered over ~18 months.","vendors":["Palantir Technologies (prime)","Anduril Industries (hardware)","Additional ecosystem partners listed on palantir.com/titan (not retrieved)"],"contract_evidence":[{"vendor":"Palantir Technologies","vehicle":"Production delivery order (vehicle type not specified in snippets) e_url":"https://www.bidnetdirect.com/maryland/solicitations/open-bids/statewide/Integrated-Network-Operations-Battalion-and-Below-INB2-Program-Executive-Office-PEO-Command-Control-Communications-and-Network-C3N-Project-Manager-PM-Interoperability-Integration-and-Services/2602747252"},"third_party_software_openness":"Public evidence insufficient."},{"name":"Project Convergence Capstone 6 (PC-C6)","owner":"T2COM (successor to Army Futures Command) - INFERENCE","description":"July 2026 division-scale force-on-force experiment at the National Training Center, Fort Irwin, CA; reported plan to test ~100 future technologies and validate NGC2 at division scale; expected to inform the transition from legacy to NGC2 fielding.","status_2026":"Planned for July 2026 (army.mil/article/293895; armyrecognition 2026). Outcomes: Public evidence insufficient in this run.","vendors":["NGC2 teams and ~100 technologies (list not retrieved)"],"contract_evidence":[],"budget":{"appropriation":"RDT&E (experimentation)","pe_number_or_line":"Public evidence insufficient.","fy26_request":"","fy27_request":"","source_url":"https://www.army.mil/article/293895/army_announces_project_convergence_capstone_6_a_milestone_in_modernization"},"third_party_software_openness":"Experimentation venue; industry participation mechanism (RFI/CSO) not retrieved."}],"procurement_pathways":[{"pathway":"xTech","how_it_works_here":"Army prize competitions (xTechSearch, xTechPacific, xTechOverwatch, xTechIgnite, AI Grand Challenge, etc.) run by the Army SBIR|STTR / FUZE office: white paper -> pitch -> demo at Army events (e.g., HMI Summit Oct 2025 for xTechOverwatch); winners get cash, an accelerator, and an invitation to submit an Army SBIR Phase I or Direct-to-Phase-II proposal.","typical_award_size":"$15K participation prizes up to ~$500K per winner; xTechOverwatch pool up to $1M; xTechPacific paid $450K in prizes plus 'millions in follow-on contracts'.","timeline":"Competition cycles of roughly 3-6 months; follow-on SBIR adds 3-6+ months (INFERENCE).","recent_examples":[{"company":"xTechPacific winners (multiple, names not retrieved)","what":"Cash prizes and follow-on SBIR contracts","amount":"$450K prizes + follow-on","date":"2023-2025 (article undated in snippet)","source_url":"https://www.army.mil/article/270276/army_awards_xtechpacific_winners_450k_in_cash_prizes_and_millions_in_follow_on_contracts"}],"fit_for_two_founder_startup":"HIGH - designed for exactly this profile; low cost of entry, soldier feedback, and a bridge to SBIR money.","eligibility_notes":"Most xTech competitions are limited to 'eligible small businesses' and follow-on SBIR requires SBIR eligibility (small, for-profit, >50% owned by U.S. citizens or permanent residents or by other eligible entities). With one founder not a U.S. person, cap-table structure needs specialist review; the German founder counts toward the U.S.-ownership test only once a permanent resident (INFERENCE from the SBIR Policy Directive; verify). Some xTech tracks (xTechInternational) are open to foreign firms."},{"pathway":"SBIR/STTR","how_it_works_here":"Army FUZE SBIR|STTR: after the 2026 reauthorization, the Army posted five funding opportunities; Army SBIR uses open topics and Direct-to-Phase-II; program reportedly shifting to portfolio-level ('the whole vs. the parts') management (FNN 2026-05). ARL/DEVCOM also issue SBIR/STTR topics.","typical_award_size":"Phase I ~$100K-$250K; Phase II / D2P2 ~$1M-$2M+ (INFERENCE from Army SBIR norms; specific 2026 caps not retrieved).","timeline":"Topic open ~30-60 days; award 3-6 months after close (INFERENCE).","recent_examples":[{"company":"Not retrieved","what":"Army FUZE five FY2026 funding opportunities post-reauthorization","amount":"","date":"2026-04","source_url":"https://www.insidegovernmentcontracts.com/2026/04/sbir-sttr-is-back-and-the-department-of-war-is-wasting-no-time/"}],"fit_for_two_founder_startup":"HIGH if eligible; the main non-dilutive path to a first Army contract.","eligibility_notes":"U.S. small business, >50% U.S.-citizen/permanent-resident ownership, PI primarily employed by the firm, work performed in the U.S.; foreign-affiliation disclosures required. Non-U.S.-person founder ownership must be structured with counsel; not a legal judgment here."},{"pathway":"Direct-to-Phase-II","how_it_works_here":"Army SBIR D2P2 lets firms with demonstrated feasibility skip Phase I; xTechPacific and xTechSearch winners are explicitly offered the D2P2 route.","typical_award_size":"Up to ~$2M (INFERENCE; 2026 cap not retrieved).","timeline":"Similar to Phase II: months, not weeks.","recent_examples":[{"company":"Not retrieved","what":"","amount":"","date":"","source_url":"https://xtech.army.mil/competition/xtechpacific/"}],"fit_for_two_founder_startup":"MEDIUM-HIGH once a working prototype exists.","eligibility_notes":"Same as SBIR."},{"pathway":"subcontract","how_it_works_here":"Join an NGC2 team led by Anduril (4ID) or Lockheed Martin (25ID); team leads are explicitly composed of multiple software vendors integrated through a common data layer, and the Army has signaled it wants on-ramps for better solutions. Similarly, TITAN production creates a Palantir/Anduril subcontract ecosystem.","typical_award_size":"Undisclosed; team-member subcontracts under $26M-$99.6M prototype OTAs are likely six- to low-seven-figure (INFERENCE).","timeline":"Weeks to months, driven by the prime's integration sprints and exercise calendar (Ivy Sting/Ivy Mass, Lightning Surge, PC-C6).","recent_examples":[{"company":"Rune Technologies","what":"Joined Team Anduril for the NGC2 prototype (logistics/sustainment software)","amount":"Undisclosed","date":"2025 (post-July award)","source_url":"https://www.runetech.co/news/anduril-ngc2"},{"company":"Striveworks, Govini, Instant Connect Enterprise, Research Innovations Inc., Palantir, Microsoft","what":"Named members of Team Anduril NGC2 prototype","amount":"Undisclosed","date":"2025-07-18","source_url":"https://www.army.mil/article/287180/army_announces_next_generation_command_and_control_ngc2_prototype_award"}],"fit_for_two_founder_startup":"HIGHEST near-term realism: the fastest way to get software in front of 4ID/25ID soldiers is through a team lead.","eligibility_notes":"No SBIR ownership test, but ITAR/export-controlled technical data and possible CUI/clearance requirements apply to foreign-national founders; FOCI review may be needed if the startup later seeks a facility clearance. Requires specialist legal review."},{"pathway":"prototype OT","how_it_works_here":"CPE C2IN awards prototype OTAs to team leads for division-scale NGC2 experimentation (Anduril $99.6M; Lockheed $26M). Whether awarded via a consortium or a direct OT and which contracting office executed them: Public evidence insufficient.","typical_award_size":"$26M-$100M for team leads.","timeline":"PC-C5 (Mar 2025) -> Anduril award (Jul 2025) -> Lockheed award (Sep 2025): months from demonstration to award.","recent_examples":[{"company":"Anduril Industries","what":"NGC2 prototype OTA for 4th ID","amount":"$99.6M","date":"2025-07-18","source_url":"https://www.army.mil/article/287180/army_announces_next_generation_command_and_control_ngc2_prototype_award"},{"company":"Lockheed Martin RMS","what":"NGC2 integrated data layer prototype OTA for 25th ID","amount":"$26M","date":"2025-09-02","source_url":"https://defensescoop.com/2025/09/02/army-next-gen-c2-lockheed-martin-ota-ngc2/"}],"fit_for_two_founder_startup":"LOW as prime; realistic only as a team member.","eligibility_notes":"OTAs favor non-traditional defense contractors; foreign ownership is not per se disqualifying but data-access rules apply."},{"pathway":"production OT","how_it_works_here":"Follow-on production after successful prototype OT; TITAN moved to production with $192M delivery orders in Sept 2026 (vehicle type not confirmed as OT in snippets). NGC2 production/scaling vehicle: not yet public in retrieved material.","typical_award_size":"$65M-$127M :"https://defensescoop.com/2026/09/01/army-titan-platform-production-awards-palantir-anduril/"}],"how_a_startup_gets_in":"Sequenced, based on retrieved evidence: (1) Pick one NGC2 layer problem the Army has named - a warfighting-function app (fires, intel, logistics, protection) on the data layer, or a NetOps/DDIL tool for S6s - and build against open standards so it can sit on a common data layer. (2) Enter an Army xTech competition (xTechSearch for general, xTechPacific for INDOPACOM 'tyranny of distance', xTechOverwatch for autonomy/sensor networks) to get cash, soldier feedback and the SBIR Phase I / Direct-to-Phase-II invitation; resolve SBIR ownership eligibility with counsel first given one non-U.S.-person founder. (3) In parallel, approach the NGC2 team leads - Anduril (4th ID; members incl. Palantir, Microsoft, Govini, Striveworks, ICE, RII; Rune Technologies joined later) and Lockheed Martin (25th ID data layer) - to be onboarded as a team member for Ivy Sting/Ivy Mass or Lightning Surge events; this is the only demonstrated route by which small software firms have entered NGC2 to date. (4) Engage the Army Applications Laboratory and CPE C2IN/CPE ISW industry engagements at Aberdeen Proving Ground (technical exchange meeting schedule not verified this run) and watch sam.gov NGC2 notices (an NGC2 notice and an updated presolicitation exist but could not be read). (5) Target Project Convergence Capstone events (PC-C6 July 2026; next cycle 2027) via a team lead or T2COM RFI, since those are where fielding decisions are informed. (6) For ISR/PED products, pursue CPE ISW's HYDRA API and the Palantir TITAN ecosystem now that TITAN is in production. Caution: Congress capped FY2026 NGC2 funds and GAO flagged cost/schedule gaps, so scaling beyond two divisions is not yet contractually evidenced.","search_log":[{"query":"\"Capability Program Executive\" Army C3N OR C2IN 2026","useful":true},{"query":"PEO C3T renamed PEO C3N \"Command, Control, Communications and Net Trae Stephens, Matt Grimm and Joe Chen came from Palantir and Founders Fund. Founder list is widely reported; not verified from a primary page in this session because company site and Wikipedia were egress-blocked (MEDIUM).","total_disclosed_funding_usd":"INFERENCE (MEDIUM): roughly $12B+ cumulative primary equity. FACT: $5B Series H (May 13, 2026) + $2.5B Series G (June 2025, Founders Fund led with $1B) + earlier rounds ($1.5B Series F 2024; $1.48B 2022; smaller earlier rounds). Exact cumulative total not verified from a primary source.","latest_valuation":"FACT: $61B post-money at Series H (May 13, 2026, Thrive Capital and Andreessen Horowitz led). FACT (reported): Reuters 2026-07-24 said Anduril was in talks at ~$100B; company said no decision made. Revenue $2.2B in 2025 (company statement, ~2x 2024). Reported projected 2026 operating loss ~$1.2B (Money Today 2026-06-27, LOW confidence, single secondary source).","major_investors":["Thrive Capital","Andreessen Horowitz","Founders Fund","General Catalyst","Lux Capital","Valor Equity Partners","8VC"],"c4isr_products":[{"name":"Lattice OS / Lattice command and control","description":"AI-enabled C2 and sensor-fusion software that ingests feeds from radars, EO/IR, EW, drones and third-party systems, maintains a track/entity picture, and lets operators task effectors and autonomous systems. Selected by the Army as the common data layer baseline for NGC2 (June 2026), as fire-control platform for IBCS-M counter-UAS (Nov 2025), and as JIATF-401 enterprise counter-UAS C2 (Mar 2026).","input_process_output_user":"Input: sensor tracks, video, radio/vehicle telemetry, third-party app data. Process: fusion/correlation, computer vision classification, kill-chain automation, tasking. Output: common operational picture, alerts, fire-control recommendations, tasks to effectors/drones. Users: air defense operators, division/brigade staffs (4th ID), SOF operators, CBP agents."},{"name":"Lattice Mesh","description":"Edge-to-cloud data mesh (publish/subscribe data distribution over DDIL networks) underpinning the NGC2 prototype; company says it expanded to 65+ tactical edge nodes (Mar 2026) and 160+ tactical edge computers / 2,500+ end-user devices / 40 apps at Ivy Mass (May 2026). Also used in CDAO Edge Data Mesh (DefenseNews 2025-07-21).","input_process_output_user":"Input: entity/task/object data from any Lattice-integrated node. Process: replication, multi-path routing across tactical radios/SATCOM/wired, offline-first sync. Output: shared data layer consumed by third-party apps (Palantir, Rune TyrOS, Shift5, LMI SHEPRD, Onebrief). Users: Army division/brigade/battalion staffs and vehicle crews."},{"name":"Lattice for Mission Autonomy","description":"Hardware-agnostic platform for tasking teams of heterogeneous uncrewed systems; USSOCOM Mission Autonomy Systems Integration Partner ($86M, 3 years, Mar 2025). Optional integration with Barracuda missiles, Fury CCA, Ghost/Ghost-X drones.","input_process_output_user":"Input: vehicle control/sensor/payload interfaces. Process: mission planning, collaborative autonomy behaviors, V&V infrastructure. Output: coordinated multi-vehicle effects under human supervision. Users: SOF and joint uncrewed-systems operators."},{"name":"Lattice SDK","description":"Developer SDK with Entities, Tasks, Objects and Video APIs over gRPC and REST; SDKs published in Python, Go, Java, JavaScript/TypeScript, Rust and C++ on GitHub; PyPI package anduril-lattice-sdk v5.1.0 released 2026-09-16 (first release 2025-02-25). Access to a Lattice environment is via an 'Anduril representative' (not self-serve).","input_process_output_user":"Input: third-party sensors, apps, data services. Process: standardized data models (entity/task/object). Output: integrations that publish to and consume from Lattice. Users: partner developers (e.g., Shift5 integrated in ~2 months; Rune 'within hours')."}],"exact_problem_solved":"Turning fragmented, stovepiped sensor and C2 data into a single fused, taskable picture that keeps working across denied/degraded networks, and shortening the sensor-to-effector chain (counter-UAS fire control, division fires, SOF autonomy) without waiting on program-of-record integration timelines.","primary_users":["Army 4th Infantry Division staffs and vehicle crews (NGC2 prototype)","Army air defense / counter-UAS operators (IBCS-M, JIATF-401)","USSOCOM uncrewed-systems operators","CBP agents (Sentry towers)","Allied navies/air forces in evaluation (RAN, JMSDF, UK)"],"primary_buyers":["Army Contracting Command - Aberdeen Proving Ground (enterprise contract, NGC2, TITAN)","Army PEO C3N / NGC2 program office","JIATF-401 (counter-UAS task force)","USSOCOM","DIU/CDAO (Thunderforge component, Edge Data Mesh)","CBP","Royal Australian Navy (Ghost Shark)"],"technical_layer":["TRANSPORT","INGEST","NORMALIZE","STORE","PROCESS","FUSE","IDENTIFY","VISUALIZE","DECIDE","DISSEMINATE","TASK"],"mission_layer":["air defense / counter-UAS","fires","maneuver","ISR","sustainment (via partner apps)","SOF uncrewed operations","maritime (Ghost Shark)","joint (Thunderforge, Edge Data Mesh)"],"segment_ids":[],"hw_sw_mix":"both - software platform (Lattice) plus a large and growing hardware line (Ghost/Ghost-X, Roadrunner, Barracuda, Fury CCA, Sentry towers, Wisp sensors, Ghost Shark). C4ISR revenue is software-led but bundled with hardware under the enterprise vehicle.","market_posture":"defense-native","contracts":[{"title":"Next Generation Command and Control (NGC2) prototype architecture for 4th Infantry Division","customer":"U.S. Army (4th Infantry Division)","contracting_org":"U.S. Army (PEO C3N / Army Contracting Command; exact office INFERENCE)","vehicle_type":"OTA prototype","ceiling":"$99.6M","obligated":"Public evidence insufficient.","awarded_value":"$99.6M over 11 months","funded_amount":"Public evidence insufficient.","task_orders":"n/a (single prototype agreement); team: Palantir, Govini, Microsoft, Striveworks, Instant Connect Enterpri idence insufficient.","awarded_value":"Not disclosed","funded_amount":"Public evidence insufficient.","task_orders":"n/a","date":"2025-03-05","period_of_performance":"Not disclosed","prime_or_sub":"sub (Scale AI prime)","prototype_or_production":"prototype","source_url":"https://defensescoop.com/2025/03/05/diu-thunderforge-scale-ai-combatant-commands-indopacom-eucom/","pub_date":"2025-03-05","confidence":"HIGH"}],"operational_deployments":[{"what":"NGC2 prototype operated as 4th Infantry Division's C2 across Ivy Sting 1-4 and Ivy Mass; Army says data from these events drove the common data baseline decision","evidence":"FACT: Army announcement 2026-06-22; Business Insider/AOL reporting Oct 2025-Jul 2026 (also notes 'spotty connections show the work ahead')","source_url":"https://app.bigdata.com/documents/7DAAE9E9194E7EE6F7AF238913C5E512"},{"what":"Lattice as CBP border surveillance C2 (Sentry towers) - long-running operational use","evidence":"FACT (Tier 3): Gizmodo 2025-01-16 and prior reporting; specific tower counts not verified here","source_url":"https://app.bigdata.com/documents/F5F4165B317EE829D93AFF0ACE942D6C"},{"what":"Counter-UAS support to U.S. forces in the Middle East during 2026 Iran conflict (Operation Epic Fury)","evidence":"COMPANY CLAIM (Anduril president, Mar 2026) - not independently verified; which systems deployed 'unclear' per reporting","source_url":"https://app.bigdata.com/documents/0C759C1CC83F349A171E5DFE5B2C6039"},{"what":"USSOCOM CUxS integration since 2022; Roadrunner in SOCOM use","evidence":"FACT (company/press): multiple 2024-2025 reports","source_url":"https://app.bigdata.com/documents/D8BF83B8C6C12416282C31B32260978F"},{"what":"Royal Australian Navy Ghost Shark - 'first international program of record' delivered","evidence":"FACT (company letter quoted by ANI/Reuters 2026-05-13)","source_url":"https://app.bigdata.com/documents/1AF923FCCC9EC27A8095C4D232071F56"}],"exercises_demos":[{"event":"Ivy Sting 1-4 (4th ID, Fort Carson)","year":"2025-2026","note":"Live-fire fires missions in seconds vs minutes (company claim, Sep 2025); Ivy Sting 4 (Feb 2026) linked 20 sensor types incl. EW jamming scenario; Shift5 and LMI SHEPRD (IL6) integrated","source_url":"https://app.bigdata.com/documents/16FA7ADB7DEC111B128E3E095115AA5B"},{"event":"Ivy Mass (4th ID, Fort Carson / Pinon Canyon)","year":"2026-05","note":"Whole division on NGC2; 160+ tactical edge computers, 2,500+ end-user devices, 40 apps; cyber/EMS attack conditions; Apache-to-ground linkage (company and press claims)","source_url":"https://app.bigdata.com/documents/A5CC10CA3DDBA5824178F6075DB814AE"},{"event":"Yuma Proving Ground 7-day counter-UAS trial","year":"2025","note":"4/4 live-fire intercepts; new sensor/effector integrated within hours (company claim) - preceded IBCS-M selection","source_url":"https://app.bigdata.com/documents/F0505FB2924F8600CF20F7ECDAC8AA49"},{"event":"NTC rotation 26-02 (1st Cavalry Division)","year":"2025-11","note":"Ghost-X operated by Multifunctional Strike Troop (Army photo)","source_url":"https://app.bigdata.com/documents/A318D8F69B828AE5A392630EE9CA359B"},{"event":"DSEI London Lattice demonstration","year":"2025-09","note":"Battlefield software demo for UK audience","source_url":"https://www.jpost.com/defense-and-tech/article-902057"},{"event":"Project Convergence Capstone 6","year":"2026 (planned)","note":"4th ID plans to operate NGC2 prototype as primary C2","source_url":"https://app.bigdata.com/documents/829AD92ED79ACAF420F88752F1F879E4"}],"integration_partners":["Palantir (Foundry data mesh in NGC2; TITAN prime)","Raft (NGC2 data/services registries)","Microsoft (NGC2, Thunderforge LLM)","Govini","Striveworks","Instant Connect Enterprise","Research Innovations Inc.","Shift5","Rune Technologies","LMI (SHEPRD)","Onebrief","Persistent Systems (Wave Relay MANET, $34M NGC2 network order)","L3Harris (AN/PRC-158C NGC2 gateway, $24M)","Shield AI (Hivemind on Fury YFQ-44A)","Scale AI (Thunderforge)","Amphenol Aerospace"],"apis_sdks_open_interfaces":"FACT: Lattice SDK (developer.anduril.com) exposes Entities, Tasks, Objects and Video APIs over gRPC and REST with standardized data models; official SDKs on GitHub for Python, Go, Java, JavaScript, Rust and C++; sample apps (auto-reconnaissance, AIS integration, entity visualizer). PyPI anduril-lattice-sdk v5.1.0 (2026-09-16), OAuth2 client credentials. Access to environments is through an Anduril representative (not open sign-up). Company claims Lattice is 'open architecture'; independent verification of openness is limited to observed rapid third-party onboarding in NGC2 (Shift5, Rune, LMI, Onebrief).","security_classification_requirements":"FACT: NGC2 apps have been deployed at IL6 (Secret) inside the Lattice-hosted ecosystem (LMI SHEPRD claim, May 2026); Anduril said the mesh supported a sensor-to-effector sequence across security domains (Mar 2026). FACT: a leaked Sept 2025 Army memo flagged 'very high risk' cybersecurity issues in the NGC2 prototype (access logging/least privilege); Army called it a monthly risk roll-up. Classified/ITAR work implies U.S.-person and facility-clearance requirements; specifics not public.","allied_international_activity":"FACT: Royal Australian Navy Ghost Shark program of record; Anduril Australia factory. FACT (company): Japan expansion with JMSDF Lattice demonstrations. FACT (Tier 3): UK T&E with British Army and RAF; DSEI 2025 demo. REPORTED (Tier 3, LOW-MEDIUM): NATO selected Lattice for next-generation air C2 (Jerusalem Post 2026-07-09) - not verified against NCIA. Israel office being set up (Globes 2026-08/09).","technical_differentiator":"A deployed edge-first data mesh plus C2 UI with a real SDK and demonstrated third-party onboarding in weeks, sold under an enterprise vehicle that lets Army units order software and hardware without new competitions. Vertical integration with its own effectors (Roadrunner, Barracuda, Fury) shortens the sensor-to-effector loop for counter-UAS.","suspected_moat":"INFERENCE (MEDIUM): contractual/architectural lock-in via the $20B enterprise vehicle and the NGC2 common data baseline (other vendors must integrate to Lattice data models); capital advantage ($5B raise) to fund manufacturing; operational data from live Army/SOF use. HYPOTHESIS: the moat is weaker at the application layer, where the Army explicitly wants many vendors and soldier-built apps on the data layer.","major_competitors":["Palantir (partner in NGC2 but competes for the data/ontology layer and Maven C2)","Lockheed Martin team (25th ID NGC2 full-stack lead)","Northrop Grumman (IBCS legacy)","RTX/Collins (CCA autonomy)","L3Harris","Leidos","Scale AI (decision support)","European sovereign alternatives (Helsing, Quantum Systems)"],"obvious_weaknesses":"Cybersecurity findings on NGC2 prototype (Sept 2025 memo); connectivity gaps observed in field testing (Business Insider Jul 2026); reported ~$1.2B projected 2026 operating loss and extreme valuation (LOW confidence figure); heavy dependence on OTA/enterprise vehicles that remain politically exposed; potential conflicts as both platform owner and effector vendor; export/ITAR constraints on allied sales.","evidence_user_adoption":"STRONG: entire 4th ID on NGC2 at Ivy Mass (May 2026); JIATF-401 chose Lattice as common C-UAS C2; SOCOM multi-year integration since 2022; CBP long-term use. Adoption numbers are largely company- or Army-stated; independent user surveys not found.","evidence_repeat_procurement":"STRONG: sequence of Army awards (NGC2 prototype Jul 2025 -> IBCS-M Nov 2025 -> $20B enterprise vehicle Mar 2026 -> $87M task order Mar 2026 -> NGC2 baseline lead Jun 2026 -> TITAN production sub Sep 2026); SOCOM follow-on ($86M, 2025) after earlier ~$1B CUAS vehicle (2022).","evidence_prototype_to_production":"MEDIUM-STRONG: Army moved NGC2 'from prototyping to delivery' with Anduril leading the data baseline (Jun 2026) though no production dollar value was published; TITAN moved to production (Anduril sub
