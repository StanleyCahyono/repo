anberg (CEO)","Nini Hamrick (President)"],"founder_backgrounds":"Granberg previously worked at In-Q-Tel; Hamrick was an intelligence analyst (U.S. intelligence community). Both backgrounds from prior public profiles, MEDIUM confidence; not re-verified this session.","total_disclosed_funding_usd":"$75M Series B (Jan 2023) plus earlier rounds; cumulative disclosed approx $100M+ (Series A size not retrieved; LOW on total).","latest_valuation":"Not disclosed. Contrary Research implies a Series B valuation of roughly $576M via a ~7.2x multiple on $80M revenue (Tier 3 inference; LOW).","major_investors":["Felicis (Series B lead)","DFJ Growth","Aloft VC","General Catalyst","Point72 Ventures","Costanoa Ventures","Shield Capital"],"c4isr_products":[{"name":"Decrypt","description":"Foreign-language open-source intelligence and document-exploitation platform that helps military and government users understand foreign actors; launched Jan 2021 and, per Series B coverage, deployed to more than a dozen public-sector organizations.","input_process_output_user":"INPUT: multilingual open-source web/social/document data. PROCESS: collection, translation, NLP enrichment, search and analysis. OUTPUT: analyst-ready intelligence products and alerts. USER: intelligence analysts at combatant commands and service intelligence centers."},{"name":"Agent Orchestration platform (mission-focused AI agents)","description":"Per a third-party API profile (api-evangelist, 2026-08-02), Vannevar now markets an agent-orchestration platform fusing defense-grade foundational data, mission requirements and reasoning into mission-focused AI agents. Additional product names (Serra, TIE, others) appear in the profile but functions not verified. Topics tagged include maritime domain awareness and information operations, suggesting sensing/IO product lines (INFERENCE, LOW).","input_process_output_user":"INPUT: mission data, OSINT, sensor-derived data (unverified). PROCESS: agentic workflows over foundational data. OUTPUT: analytic products, recommendations. USER: intel and operations staffs (INDOPACOM, SOCOM, AFSOC, NASIC per Contrary Research)."}],"exact_problem_solved":"Analysts lack scalable tools to exploit foreign-language open-source and document data about adversaries; Vannevar packages collection, translation and AI analysis into deployable products and, more recently, agents that automate analytic workflows.","primary_users":["Intelligence analysts at INDOPACOM, SOCOM, AFSOC, NASIC (per Contrary Research; MEDIUM)","Joint force and federal agency users following FedRAMP High authorization (2026; per Built In; MEDIUM)"],"primary_buyers":["Defense Innovation Unit (production OTA HQ08452490025)","SOCOM / AFSOC","INDOPACOM","Air Force (NASIC)","SBIR-funded components (sbir.gov portfolio)"],"technical_layer":["COLLECT","INGEST","NORMALIZE","PROCESS","IDENTIFY","VISUALIZE","DECIDE"],"mission_layer":["ISR","joint","information operations","maritime (claimed; unverified)"],"segment_ids":["S04","S07"],"hw_sw_mix":"software primarily; some public signals of sensing/maritime domain awareness products (hardware involvement INFERENCE, LOW - not verified)","market_posture":"defense-native","contracts":[{"title":"DIU production other transaction agreement to transition data-analysis solution into production (HQ08452490025)","customer":"Department of Defense (joint users via DIU)","contracting_org":"Defense Innovation Unit (Washington Headquarters Services contracting, HQ0845)","vehicle_type":"OTA production","ceiling":"Up to $99M (potential value; NOT revenue)","obligated":"Initial award $16M (Defense Daily); subsequent obligations not retrieved","awarded_value":"$99M potential","funded_amount":"$16M initial","task_orders":"n/a","date":"2024-11","period_of_performance":"Unknown","prime_or_sub":"prime","prototype_or_production":"production (follow-on to DIU prototype)","source_url":"https://www.defensedaily.com/diu-awards-vannevar-labs-contract-to-transition-data-analysis-solution-into-production/advanced-transformational-technology/","pub_date":"2024-11","confidence":"HIGH (existence); MEDIUM (dollar split)"},{"title":"SBIR/STTR awards (portfolio)","customer":"DoD components","contracting_org":"Various (sbir.gov portfolio 1655947)","vehicle_type":"SBIR","ceiling":"Public evidence insufficient (portfolio page not retrievable this session)","obligated":"Unknown","awarded_value":"Unknown","funded_amount":"Unknown","task_orders":"n/a","date":"2020-2024 (approx.)","period_of_performance":"Unknown","prime_or_sub":"prime","prototype_or_production":"prototype","source_url":"https://www.sbir.gov/portfolio/1655947","pub_date":"n/a","confidence":"LOW"}],"operational_deployments":[{"what":"Decrypt deployed to more than a dozen public-sector organizations (as of Series B, Jan 2023); customers named by Contrary Research include INDOPACOM, AFSOC, SOCOM, NASIC","evidence":"Series B press coverage (ExecutiveBiz) and Contrary Research report; not independently verified via government sources this session.","source_url":"https://research.contrary.com/company/vannevar-labs"},{"what":"Transition of DIU-prototyped data-analysis solution into production across DoD","evidence":"DIU production OTA (Nov 2024) is direct evidence of a prototype-to-production transition; scale of fielding not public.","source_url":"https://www.vannevarlabs.com/media-coverage/vannevar-labs-awarded-diu-production-contract/"}],"exercises_demos":[{"event":"Public evidence insufficient (this session)","year":"","note":"No specific exercise participation retrieved.","source_url":""}],"integration_partners":["Public evidence insufficient (this session)"],"apis_sdks_open_interfaces":"INFERENCE (LOW-MEDIUM): third-party API profiles (api-evangelist, May and Aug 2026) indicate a documented public API surface; no public SDK or open-source repos found under a Vannevar org.","security_classification_requirements":"FedRAMP High authorization reported for 2026 (Built In; MEDIUM). Work with SOCOM/NASIC/INDOPACOM implies classified-network deployments (INFERENCE). Specific IL levels not verified.","allied_international_activity":"Public evidence insufficient (this session). ITAR tag on third-party profile suggests export-controlled products (INFERENCE, LOW).","technical_differentiator":"Mission-pretrained foreign-language OSINT/document exploitation with in-house collection, now extended into agentic workflows; early DIU production transition and FedRAMP High reduce buyer friction.","suspected_moat":"Proprietary multilingual collection/enrichment pipelines and mission-specific training data; production OTA and FedRAMP High authorizations; embedded analyst workflows at COCOMs. HYPOTHESIS: moat is data/accreditation-based rather than architectural.","major_competitors":["Palantir (Gotham/AIP)","Primer AI (Command/Delta)","Babel Street","Dataminr (A2 PAI alerting, $318M DoD award Aug 2026)","Recorded Future","Scale AI (Thunderforge)","Anduril (maritime sensing, if Vannevar hardware claims hold)"],"obvious_weaknesses":"Crowded OSINT/PED market with well-funded incumbents; LLM commoditization pressures NLP-centric differentiation; classified customer base limits public proof of scale; revenue figures come from Tier 3/4 sources; product portfolio expansion (agents, sensing) raises execution risk.","evidence_user_adoption":"MEDIUM: named COCOM and service-intel users; reported $80M revenue (2024) and $80M ACV entering 2026 (Tier 3/4; not audited); 2,848% three-year growth claim (Tier 4).","evidence_repeat_procurement":"MEDIUM: DIU prototype -> production OTA; one incumbent recompete tracked in next 24 months (HigherGov); SBIR portfolio. Task-order-level repeat data not public.","evidence_prototype_to_production":"HIGH (event) / MEDIUM (scale): DIU explicitly awarded a production OT to transition the prototype; only $16M initial funding confirmed against a $99M ceiling.","whitespace_cells":[{"chain_step":"COLLECT","echelon":"theater"},{"chain_step":"PROCESS","echelon":"theater"},{"chain_step":"PROCESS","echelon":"joint"},{"chain_step":"DECIDE","echelon":"joint"}],"tech_stack_inference_from_jobs":"INFERENCE (LOW): job postings not retrievable this session. Product profile implies Python/ML pipelines for multilingual NLP, data-engineering at scale, and cloud deployment to FedRAMP High/IL environments.","confidence_notes":"DIU production OTA and Series B are HIGH. Customer list, revenue, valuation and hardware/sensing claims are MEDIUM to LOW (Tier 3/4 sources). Founders MEDIUM (prior knowledge).","sources":[{"url":"https://www.defensedaily.com/diu-awards-vannevar-labs-contract-to-transition-data-analysis-solution-into-production/advanced-transformational-technology/","title":"DIU Awards Vannevar Labs Contract To Transition Data Analysis Solution Into Production","pub_date":"2024-11","type":"independent"},{"url":"https://www.vannevarlabs.com/media-coverage/vannevar-labs-awarded-diu-production-contract/","title":"Vannevar Labs Awarded DIU Production Contract","pub_date":"2024-11","type":"company"},{"url":"https://govtribe.com/award/federal-contract-award/other-transaction-agreement-hq08452490025","title":"Other Transaction Agreement HQ08452490025","pub_date":"2024-11","type":"gov"},{"url":"https://www.usaspending.gov/recipient/a64f2e97-4b5d-6456-f4dd-66d545cd6956-C/latest","title":"VANNEVAR LABS INC - USAspending recipient profile","pub_date":"n/a","type":"gov"},{"url":"https://www.sbir.gov/portfolio/1655947","title":"Vannevar Labs SBIR portfolio","pub_date":"n/a","type":"gov"},{"url":"https://blog.executivebiz.com/2023/01/vannevar-labs-raises-75m-series-b-fund-to-advance-defense-tech-development/","title":"Vannevar Labs Raises $75M in Series B Financing","pub_date":"2023-01","type":"independent"},{"url":"https://research.contrary.com/company/vannevar-labs","title":"Contrary Research: Vannevar Labs business breakdown","pub_date":"2025-12 (approx.)","type":"independent"},{"url":"https://builtin.com/company/vannevar-labs/faq/stability-growth","title":"Vannevar Company Growth, Stability & Outlook 2026","pub_date":"2026","type":"independent"},{"url":"https://www.highergov.com/awardee/vannevar-labs-inc-10048398/","title":"Vannevar Labs Profile (HigherGov)","pub_date":"n/a","type":"gov"},{"url":"https://github.com/api-evangelist/vannevar","title":"Vannevar Labs - third-party public API surface profile (API Evangelist)","pub_date":"2026-08-02","type":"independent"}],"batch_id":"B02","batch_theme":"C2 applications and AI workflow startups","slug":"vannevar-labs-inc","traction":"strong"}],"discovery":[],"evidence":{"E02":{"evidence_id":"E02","name":"SAM.gov RFIs, Sources Sought, BAAs and solicitations revealing what government believes is missing","summary":"Twenty site-scoped searches (the session-wide search budget was then exhausted, and every WebFetch to sam.gov, diu.mil, army.mil, media.defense.gov, afwerx.com, tradewindai.com, sofwerx.org and the trade press was blocked by the egress proxy) surfaced roughly 45 government notices from 2024-2026 whose visible text describes what the services believe is missing. The dominant, repeated demand signal is a data-centric, hardware-agnostic C2 stack that keeps working under denied/degraded/intermittent/limited (DDIL) connectivity: the Army's NGC2 notices (RFI, draft SOO, draft-solicitation feedback, TEM 14) explicitly ask industry for API schemas, reference architectures, developer environments and a common data layer; the Army UDRA RFI admits that extending the data mesh to tactical echelons is deferred; PM Mission Command asks for a common data model, data fabric, data catalog and DDIL-robust TAK data services; DEVCOM C5ISR asks for Zero Trust data-in-use protection inside DDIL; and USSOCOM, ACC and Nett Warrior RFIs ask for modular edge compute, SD-WAN and consolidated dismounted devices. A second strong cluster is counter-UAS C2 and sensor fusion (JIATF-401 mission-planning/EMS software RFI and CSO, multi-modal fusion RFIs requiring 4-10 Hz track updates, the March 2026 SENSEI Data Fusion Correlator notice, PM LAV vehicle-mounted C-sUAS). A third cluster is service-level battle management modernization (DAF CBC2+ voice app RFI Aug 2025, Kessel Run AOC weapon-system modernization market research, Space Systems Command's single integrated Ops C2 for the Space Tasking and Joint Targeting cycles, DIU Hydra cross-system USSF tactical C2, Coast Guard Coastal Sentinel COP RFI with an invite-only industry day on 29 Sep 2026). Notably absent from my searches were any Mission Partner Environment or coalition-interoperability RFIs, which is NOT evidence of opportunity. Evidentiary caveat: because primary pages could not be opened, notice IDs, exact posting dates, set-asides and NAICS codes are mostly unverified and are labeled accordingly; all items below rest on search-result excerpts of notice text plus titles, and a follow-up agent with sam.gov access should confirm each one before it is used in an investment argument.","findings":[{"id":"E02-F1","title":"Army NGC2 RFI asks industry to co-define API schema, reference architecture and developer environments","detail":"ACC-APG, on behalf of Project Manager Next Generation Command and Control (PO NGC2) within PEO C3T, issued an RFI as continuing market research to inform future contract activities enabled by experimentation, pilots and prototyping under the Army Futures Command Characteristics of Need dated 21 May 2024. Stated objectives include managing development environments and compute/storage requirements, maximizing vendor access to capabilities and users, collaboration with the Government on technical specs (API schema, reference architectures), and defining the roles of Government and industry in a collaborative space.","quote_or_paraphrase":"Objectives such as managing development environments and compute and storage requirements, maximizing vendor access to capabilities and users, collaboration with the Government on technical specs (API schema, reference architectures), and defining the role of the Government and Industry in a collaborative space.","source_title":"Next Generation Command and Control (NGC2) - SAM.gov notice","source_url":"https://sam.gov/opp/606845d8f52044b2b8fa4c5c54ddd41f/view","pub_date":"unknown (post-2024-05-21; exact posting date not visible; primary page blocked)","event_date":"2024-05-21 (AFC Characteristics of Need)","source_tier":1,"segment_ids":["S01","S02","S09"],"chain_steps":["INGEST","NORMALIZE","STORE","VISUALIZE","DECIDE"],"pain_keywords":["API schema","reference architecture","developer environment","vendor access to users","compute and storage"],"label":"FACT","confidence":"HIGH","startup_relevance":"The Army is explicitly inviting third-party developers into an app-layer ecosystem with published APIs; a small vendor could target one application or data service rather than the integrator role."},{"id":"E02-F2","title":"NGC2 has moved to draft-solicitation / draft-SOO stage with industry feedback requested (PEO C3N)","detail":"Separate SAM.gov notices show NGC2 progressing from RFI to a draft Statement of Objectives, a 'NGC2 Capability' notice, a 'NGC2 Software' notice, a presolicitation update, a 'TEM 14 Industry-Government Strategic Engagement' event, and a request for industry feedback on the draft solicitation issued by ACC-APG on behalf of 'Program Executive Office Command, Control, Communications and Network (PEO C3N)'. The PEO C3N naming (versus PEO C3T in the earlier RFI) is visible in the search excerpt. INFERENCE: the sequence RFI -> draft SOO -> draft solicitation indicates a competitive follow-on vehicle beyond the prototype OTAs; whether it is production is not confirmed.","quote_or_paraphrase":"ACC-APG, on behalf of Program Executive Office Command, Control, Communications and Network (PEO C3N) is requesting industry feedback on the draft solicitation for Next Generation Command and Control (NGC2).","source_title":"Next Generation Command and Control (NGC2) Capability - draft solicitation feedback (SAM.gov); NGC2 Draft SOO (SAM.gov); TEM 14 (SAM.gov)","source_url":"https://sam.gov/workspace/contract/opp/fe97ef8ca1694832b18dd33b56ba5dd2/view","pub_date":"unknown (2025-2026 inferred from PEO C3N naming; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S01","S02","S05","S09"],"chain_steps":["INGEST","STORE","VISUALIZE","DECIDE","DISSEMINATE"],"pain_keywords":["draft solicitation","statement of objectives","industry feedback","technical exchange meeting"],"label":"INFERENCE","confidence":"MEDIUM","startup_relevance":"Draft SOOs and TEMs are the moment small vendors can shape API/eligibility terms; also signals that the market structure (integrator vs app vendors) is being fixed now. Related URLs: https://sam.gov/opp/0a8972aafde8473bb76ce9c781bf53fa/view ; https://sam.gov/opp/3504ec6c666d477a87ca7e8953f87640/view ; https://sam.gov/opp/a060a01a72074a7c95dc541f7ae36400/view ; https://sam.gov/opp/e1100b50a8aa4dd6b5f6b46a81a4646d/view ; https://sam.gov/opp/8e7f3548a8d7486b96f9ccabcddb7175/view"},{"id":"E02-F3","title":"NGC2 notice text defines the missing stack: transport, data/analytics platforms, hardware-agnostic UX, app-based tools","detail":"The NGC2 notice states the Army is reimagining its enterprise data architecture and operational software framework as a portfolio addressing (a) network and transport layers, (b) infrastructure, data and analytics platforms, and (c) hardware-agnostic, configurable user experiences for application-based tools and services. Read as a gap statement, the Army is saying today's C2 is not layered, not hardware-agnostic and not application-based.","quote_or_paraphrase":"the Army is reimagining its enterprise data architecture and revolutionizing its operational software framework, including a portfolio of solutions addressing the network and transport layers; infrastructure, data, and analytics platforms; and hardware agnostic, configurable user experiences for seamless application-based tools and services.","source_title":"Next Generation Command and Control (NGC2) - SAM.gov notice","source_url":"https://sam.gov/opp/ef4a68d4cec04654a5a52690df8a24dc/view","pub_date":"unknown (primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S01","S02","S05","S06"],"chain_steps":["TRANSPORT","INGEST","STORE","PROCESS","VISUALIZE"],"pain_keywords":["hardware agnostic","configurable user experience","application-based","data and analytics platform","transport layer"],"label":"FACT","confidence":"HIGH","startup_relevance":"Three explicit layers where a focused product can plug in; the UX/app layer is the least capital-intensive entry point for a two-person team."},{"id":"E02-F4","title":"Army and industry established an NGC2 common data-layer baseline after 4th ID and 25th ID validations","detail":"An army.mil article reports the Army established the NGC2 common data layer baseline following operational validations at 4th Infantry Division's Ivy Sting / Ivy Mass series and 25th Infantry Division's Lightning Surge events, and frames NGC2 as moving 'from prototyping to delivery'. The article could not be opened (army.mil blocked); detail is from the search excerpt only.","quote_or_paraphrase":"The U.S. Army established the Next Generation Command and Control (NGC2) common data layer baseline, following NGC2 operational validations at the 4th Infantry Division Ivy Sting-Ivy Mass series and 25th Infantry Division Lightning Surge events.","source_title":"Army and industry align on common data baseline, as Next Generation Command and Control moves from prototyping to delivery (army.mil)","source_url":"https://www.army.mil/article/293409/army_and_industry_align_on_common_data_baseline_as_next_generation_command_and_control_moves_from_prototyping_to_delivery","pub_date":"2026 (exact date not visible)","event_date":"2025-2026 (Ivy Sting/Ivy Mass, Lightning Surge)","source_tier":1,"segment_ids":["S02","S01"],"chain_steps":["NORMALIZE","STORE","DISSEMINATE"],"pain_keywords":["common data layer","baseline","operational validation","prototyping to delivery"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"A published common data baseline is the interface a new app vendor must conform to; it also means the data-layer slot itself is likely taken by incumbents on the prototype teams."},{"id":"E02-F5","title":"xTechIgnite 2025 topic: Generative-AI modeling and simulation of NGC2 under a DDIL tactical network","detail":"The Army xTechIgnite competition announcement (RFI PDF, Feb 2025) includes a 'Generative AI for Tactical Network' topic whose objective is a realistic M&S environment for NGC2 reflecting a DDIL tactical network with multiple real-time data access and delivery demands. The Army defines NGC2 in the same text as a data-centric C2 architecture enabling real-time access to critical data despite limited connectivity. PDF could not be opened (xtech.army.mil blocked).","quote_or_paraphrase":"NGC2 is the Army's new approach to a data-centric C2 architecture to enable real time access to critical data despite limited connectivity environments, with the environment reflecting a realistic tactical network (DDIL environment) with multiple data access and delivery demands in real time.","source_title":"The Army xTech Program - xTechIgnite Competition Announcement 1 (RFI PDF)","source_url":"https://www.xtech.army.mil/wp-content/uploads/2025/02/RFI_xTechIgnite_FINAL_APPROVED_v2.pdf","pub_date":"2025-02","event_date":"2025","source_tier":1,"segment_ids":["S05","S02","S09"],"chain_steps":["TRANSPORT","DISSEMINATE","ASSESS"],"pain_keywords":["DDIL","tactical network simulation","generative AI","data delivery demands"],"label":"FACT","confidence":"HIGH","startup_relevance":"A network-emulation / digital-twin test harness for DDIL is an explicit, software-only Army ask suited to a small team; xTech prizes are small but lead to SBIR-style follow-ons. Eligibility (US small-business ownership rules) needs legal review for the Indonesian founder."},{"id":"E02-F6","title":"xTech National Security Hackathon (Apr 2026) problem areas: sensor integration, resilient edge ops, mission C2, cyber","detail":"The FUZE xTech National Security Hackathon announcement (Apr 2026) seeks solutions that improve sensor integration and analysis, enable resilient edge-based operations, enhance mission command and control, and strengthen digital defense/cybersecurity. The xTech program also describes DDIL environments as restricting real-time communication, limiting data transfer and making cross-unit coordination difficult.","quote_or_paraphrase":"seeks innovative solutions that improve sensor integration and analysis, enable resilient edge-based operations, enhance mission command and control, and strengthen digital defense and cybersecurity capabilities.","source_title":"The Army FUZE xTech Program - xTech National Security Hackathon Announcement 1","source_url":"https://xtech.army.mil/wp-content/uploads/2026/04/xTech-Hackathon_RFI_Final.pdf","pub_date":"2026-04","event_date":"2026","source_tier":1,"segment_ids":["S06","S01","S03","S10"],"chain_steps":["COLLECT","FUSE","DECIDE"],"pain_keywords":["sensor integration","resilient edge","mission command","DDIL"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Hackathon format is unusually accessible to student founders; prize money is small but it is a documented on-ramp to Army users."},{"id":"E02-F7","title":"Army UDRA RFI concedes the data mesh does not yet extend to tactical echelons","detail":"The Office of the Deputy Assistant Secretary of the Army for Data, Engineering and Software issued an RFI on industry capabilities for implementing a Unified Data Reference Architecture that unifies data-mesh and data-fabric principles. The notice states domain data products will be produced at lower echelons 'by exception only' until implementation lessons can extend the mesh toward tactical units, which is an explicit admission that tactical-echelon data products/mesh are unsolved.","quote_or_paraphrase":"Domain data products will be produced at lower echelon levels by exception only, until UDRA implementation and adoption lessons learned can be applied to extend the mesh toward tactical level units.","source_title":"Unified Data Reference Architecture Request for Information (SAM.gov)","source_url":"https://sam.gov/opp/eb9c5cfc8ce34b2a9ac3c7fc5ca612bc/view","pub_date":"unknown (believed 2024; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S02","S06"],"chain_steps":["NORMALIZE","STORE","DISSEMINATE"],"pain_keywords":["data mesh","data fabric","domain data products","tactical echelon","reference architecture"],"label":"FACT","confidence":"HIGH","startup_relevance":"Tactical-echelon data products under DDIL is a named, deferred gap; a lightweight edge data-product/catalog tool aligned to UDRA is a plausible wedge, but ownership of the architecture sits with ODASA(DES) and its FFRDC/integrator partners."},{"id":"E02-F8","title":"PM Mission Command 'Operational Mission Command Suite' asks for common data model, data fabric, data catalog, data-science platform and DDIL-robust TAK data services","detail":"A PEO C3T / PM Mission Command notice describes requirements for data-centric capabilities centered on a common data model, data fabric, data catalog and data science platform, and requires the TAK solution to support on-prem, hybrid and cloud data services integrated via DDIL-robust protocols and architectures.","quote_or_paraphrase":"PM MC has requirements for data centric capabilities centered around a common data model, data fabric, data catalog, and data science platform ... The TAK solution shall support on-prem, hybrid, and cloud-based data services and integration with those services via Denied, Degraded, Intermittent, and Limited (DDIL) robust protocols and architectures.","source_title":"Operational Mission Command Suite (SAM.gov)","source_url":"https://sam.gov/opp/340689e568d74d08bb0c5c8cbebd42a6/view","pub_date":"unknown (2025-2026 inferred; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S01","S02","S06","S07"],"chain_steps":["INGEST","NORMALIZE","STORE","VISUALIZE","DISSEMINATE"],"pain_keywords":["common data model","data catalog","data fabric","TAK","DDIL protocols","hybrid cloud"],"label":"FACT","confidence":"HIGH","startup_relevance":"TAK plug-ins and DDIL-tolerant sync services are a documented Army requirement in an open ecosystem (TAK is government-owned), which lowers the integration barrier for a small vendor."},{"id":"E02-F9","title":"PM Mission Command Data Science Platform RFI for next-generation Mission Command","detail":"Project Manager Mission Command issued an RFI seeking industry feedback on the current state of Data Science Platform capabilities that may provide a solution for the next generation of the Mission Command system. Only the excerpt is visible; scope, date and set-aside are unverified.","quote_or_paraphrase":"RFI issued by Project Manager Mission Command to provide the United States Army industry feedback on current state of Data Science Platform capabilities that may provide a solution for the next generation of Mission Command system.","source_title":"Program Executive Office Command Control ... Data Science Platform RFI (SAM.gov)","source_url":"https://sam.gov/opp/be7d6e94c7e041f382129c2dbfacf156/view","pub_date":"unknown (primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S02","S06"],"chain_steps":["PROCESS","ASSESS"],"pain_keywords":["data science platform","next generation mission command"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Signals PM MC intends to buy a commercial data-science platform rather than build; incumbents (Palantir, Databricks-class) likely dominate, so startup value is in niche edge analytics."},{"id":"E02-F10","title":"PEO C3T PM Mission Command RFI on contracting approach and Statement of Objectives","detail":"A SAM.gov RFI from PEO C3T / PM MC requests feedback from interested parties on a proposed contracting approach and a Statement of Objectives. This is procedurally significant: asking industry to critique the vehicle itself suggests the office is choosing between OTA, IDIQ and commercial-solutions approaches for follow-on mission command work.","quote_or_paraphrase":"requests feedback from interested parties on the Contracting Approach and Statement of Objective (SOO).","source_title":"Program Executive Office Command Control Communications-Tactical, PM Mission Command RFI (SAM.gov)","source_url":"https://sam.gov/opp/6ac8eb29a0b741c38acc48083dc776b3/view","pub_date":"unknown (2025-2026; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S01","S09"],"chain_steps":["DECIDE","COLLABORATE"],"pain_keywords":["contracting approach","statement of objectives"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Vehicle design determines whether non-traditional vendors can compete; worth responding to even without a product."},{"id":"E02-F11","title":"Common Data Fabric RFI (10 Dec 2024)","detail":"A SAM.gov notice titled 'Common Data Fabric Request for Information' dated 10 December 2024 exists; the issuing office and scope were not visible in the excerpt and the page could not be opened. Public evidence insufficient on the content.","quote_or_paraphrase":"Common Data Fabric Request for Information (dated December 10, 2024).","source_title":"Common Data Fabric Request for Information (SAM.gov)","source_url":"https://sam.gov/opp/10d8c0cacb66495284037b65589a8208/view","pub_date":"2024-12-10","event_date":"2024-12-10","source_tier":1,"segment_ids":["S02"],"chain_steps":["INGEST","NORMALIZE","DISSEMINATE"],"pain_keywords":["common data fabric"],"label":"FACT","confidence":"LOW","startup_relevance":"Needs verification of issuing office (DAF Battle Network, DISA or IC) before drawing conclusions."},{"id":"E02-F12","title":"DEVCOM C5ISR RFI: Zero Trust 'Data Pillar' protection for tactical data-in-use inside DDIL","detail":"The Army Combat Capabilities Development Command C5ISR Center is surveying the market for solutions integrating DoD Zero Trust capabilities focused on the Data Pillar of the DoD ZT model, with the explicit constraint that solutions must operate in a DDIL contested communications, logistics and information environment. This is a direct statement that current ZT data protections assume enterprise connectivity.","quote_or_paraphrase":"surveying the market for solutions to integrate Department of Defense Zero Trust capabilities focused on the Data Pillar of the DoD ZT model ... operate within a denied, degraded, intermittent, or limited (DDIL) contested communications, logistics, and information environment.","source_title":"Tactical Data in Use Security RFI (SAM.gov)","source_url":"https://sam.gov/opp/784528d45bcc4bcaa163a33e6562bef2/view","pub_date":"2025 (exact date not visible; primary page blocked)","event_date":"2025","source_tier":1,"segment_ids":["S10","S02","S06"],"chain_steps":["STORE","PROCESS","DISSEMINATE"],"pain_keywords":["zero trust","data pillar","data in use","DDIL","tactical"],"label":"FACT","confidence":"HIGH","startup_relevance":"Offline-capable data-centric security (tagging, ABAC, encryption-in-use at the edge) is a narrow software problem with a named Army S&T sponsor; strong engineer-led fit but requires cryptographic/ITAR care."},{"id":"E02-F13","title":"Cross-domain at the edge: TACDS v3.0 filter buy (Dec 2025) and NEWT body-worn edge-to-enterprise terminal with CDS component","detail":"A Dec 2025 SAM.gov opportunity covers Tactical Cross Domain Solution (TACDS) Version 3.0 filters. Separately, the NavalX/IWRP 22 Oct 2024 quarterly industry day describes the Networked Edge Warfighting Terminal (NEWT), a body-worn system enabling edge-to-enterprise information sharing across different communication devices that includes a cross domain solution component. Together they show CDS demand is moving from enclave boundaries to individual tactical nodes.","quote_or_paraphrase":"NEWT is a body-worn system that aims to enable edge-to-enterprise information sharing across an array of different communication devices ... which includes a cross domain solution component.","source_title":"Tactical Cross Domain Solution (TACDS) Version 3.0 Filter (SAM.gov); IWRP October 22, 2024 Quarterly Industry Day (SAM.gov)","source_url":"https://sam.gov/workspace/contract/opp/e52a36b1ed794fb7b223696a395d5718/view","pub_date":"2025-12 (TACDS); 2024-10 (IWRP)","event_date":"2024-10-22 (IWRP industry day)","source_tier":1,"segment_ids":["S10","S05","S06"],"chain_steps":["TRANSPORT","DISSEMINATE"],"pain_keywords":["cross domain solution","tactical CDS","body-worn","edge-to-enterprise"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"CDS products require NCDSMO/Raise-the-Bar accreditation and cleared staff; not a first product for these founders, but adjacent filter/rules content is a possible niche. IWRP URL: https://sam.gov/opp/77dbee2874de4c5eb2ff9e0f1c7a11e9/view"},{"id":"E02-F14","title":"Tactical ATC command-and-control RFI issued under 'Revolutionary FAR Overhaul Part 10', responses due 28 Aug 2026","detail":"A Tactical Air Traffic Control (ATC) Command and Control RFI states it is market research under Revolutionary FAR Overhaul (RFO) Part 10 with responses requested by 28 August 2026, and requires systems to enforce cross-domain security through approved MLS boundary defenses and CDS that validate, sanitize and route data across classification enclaves. Notable both for the content and for confirming the post-overhaul FAR is now cited in C2 notices.","quote_or_paraphrase":"systems shall enforce cross-domain security through approved Multi-Level Security (MLS) boundary defenses and Cross Domain Solutions (CDS) that validate, sanitize, and route data across disparate classification enclaves.","source_title":"Tactical Air Traffic Control (ATC) Command and Control RFI (SAM.gov)","source_url":"https://sam.gov/workspace/contract/opp/2c233bf0322144bc9dceea7cdde2ccf2/view","pub_date":"2026-08 (inferred from response date)","event_date":"2026-08-28 (response deadline)","source_tier":1,"segment_ids":["S01","S10","S07"],"chain_steps":["FUSE","VISUALIZE","DISSEMINATE"],"pain_keywords":["multi-level security","cross domain","tactical ATC","RFO Part 10"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Niche airspace-C2 market with heavy certification; more useful as evidence that RFO-era market research is happening quickly and openly."},{"id":"E02-F15","title":"DAF CBC2+ Voice Communications RFI (posted 22 Aug 2025): battle-management software still lacks integrated voice/radio","detail":"The DAF Battle Network / ABMS Cloud Based Command and Control Plus (CBC2+) office posted an RFI on 22 Aug 2025 (response extended to 5 Sep 2025) seeking a voice and radio communications software application supporting rapid integration and management of internal and external voice and radio communications. This implies CBC2 today lacks a native, software-defined voice/radio integration layer.","quote_or_paraphrase":"seeks a voice and radio communications software application that supports rapid integration and management of internal and external voice and radio communications.","source_title":"Cloud Based Command and Control Plus (CBC2+) Voice Communications RFI (SAM.gov)","source_url":"https://sam.gov/workspace/contract/opp/da62e3a414ca4d3ebb09e4457f034214/view","pub_date":"2025-08-22","event_date":"2025-09-05 (extended response date)","source_tier":1,"segment_ids":["S01","S05"],"chain_steps":["COLLABORATE","DISSEMINATE","TASK"],"pain_keywords":["voice communications","radio integration","CBC2","ABMS","software application"],"label":"FACT","confidence":"HIGH","startup_relevance":"A discrete software-only capability (VoIP/radio-over-IP integration into a cloud C2 app) with a named program office; realistic scope for a small team, though prime integrators on CBC2 (SAIC-led) control the platform."},{"id":"E02-F16","title":"Kessel Run market research for Air Operations Center weapon-system modernization (PAE C3BM)","detail":"The AOC Program Office, Kessel Run Division, under the Portfolio Acquisition Executive for C3BM (PAE C3BM/C3C), initiated market research to identify cutting-edge technologies and innovative approaches to modernize the AOC Weapon System. Companion sources sought notices for 'DAF PEO C3BM Strategic Leadership Design' (updated 20 Jun 2025) confirm active C3BM org reshaping. Date of the AOC notice not visible.","quote_or_paraphrase":"initiating market research to identify and explore cutting-edge technologies and innovative approaches for the modernization of the Air Operations Center (AOC) Weapon System.","source_title":"Next-Generation Air Operations Center (AOC) Weapon System modernization (SAM.gov)","source_url":"https://sam.gov/opp/b3c69875964c40ecb02b4dcb4f7feb78/view","pub_date":"unknown (2025-2026; PAE terminology implies 2026)","event_date":"unknown","source_tier":1,"segment_ids":["S01","S09"],"chain_steps":["DECIDE","TASK","MONITOR"],"pub_note":"Companion: https://sam.gov/opp/5e798d8414a74eecbd4fa7d775e89a2a/view","pain_keywords":["air operations center","weapon system modernization","Kessel Run"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Kessel Run has a track record of onboarding small software vendors; AOC modernization (ATO planning, tasking) is one of the few C2 domains with an in-house DevSecOps pipeline a startup can deploy into."},{"id":"E02-F17","title":"USMC TBMCS system sustainment RFI shows legacy theater battle management still in service","detail":"A SAM.gov RFI seeks sources for U.S. Marine Corps Theater Battle Management Core Systems (TBMCS) sustainment. TBMCS is a 1990s-era Lockheed Martin system; continued sustainment sourcing implies the Marine Corps has not yet fielded a replacement air-tasking/battle-management application.","quote_or_paraphrase":"Sources Sought / RFI for U.S. Marine Corps Theater Battle Management Core Systems (TBMCS) System Sustainment.","source_title":"Theater Battle Management Core Systems (TBMCS) sustainment RFI (SAM.gov)","source_url":"https://sam.gov/opp/64850caf230f6030c794a2acbac458e4/view","pub_date":"unknown (2025; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S01"],"chain_steps":["TASK","MONITOR"],"pain_keywords":["TBMCS","legacy sustainment","air tasking"],"label":"INFERENCE","confidence":"MEDIUM","startup_relevance":"Legacy-sustainment notices reveal replacement windows but are usually won by incumbents; useful mainly as a market-timing signal."},{"id":"E02-F18","title":"Space Systems Command sources sought (updated 25 Mar 2025): single integrated Ops C2 for Space Tasking and Joint Targeting cycles","detail":"SSC is conducting market research for commercial technologies supporting delivery of a single integrated Operational Command and Control (Ops C2) solution for planning, tasking, deconfliction and decision aiding within the Space Tasking Cycle and Joint Targeting Cycle. The phrase 'single integrated' implies today's space ops C2 is fragmented across multiple tools.","quote_or_paraphrase":"identify commercial technologies to support delivery of a single integrated Operational Command and Control (Ops C2) solution for supporting Ops C2 planning, tasking, deconfliction and aiding decision making required within the Space Tasking Cycle (STC) and Joint Targeting Cycle (JTC) processes.","source_title":"Operational Command and Control & Battle Management System supporting the Space Tasking & Joint Targeting Cycles (SAM.gov)","source_url":"https://sam.gov/opp/759d7e820fae4c8bab9bf10be5d1ce53/view","pub_date":"2025-03-25 (last update visible)","event_date":"2025","source_tier":1,"segment_ids":["S01","S07"],"chain_steps":["DECIDE","TASK","COLLABORATE"],"pain_keywords":["space tasking cycle","joint targeting cycle","deconfliction","integrated ops C2"],"label":"FACT","confidence":"HIGH","startup_relevance":"Space C2 is a smaller, more commercially-open market (SSC's Commercial Space Office) but incumbents (e.g., Anduril/Lattice for Space C2, Parsons, L3Harris) already hold prototype awards; verify before pursuing."},{"id":"E02-F19","title":"DIU 'Hydra' open submission: collaborative, real-time, cross-system USSF tactical C2","detail":"DIU lists an open submission opportunity (PROJ00677) titled 'Hydra - Collaborative, Real-Time, Cross-System USSF Tactical Command and Control'. Only the title is visible; the problem statement, deadline and eligibility could not be opened (diu.mil blocked).","quote_or_paraphrase":"Hydra - Collaborative, Real-Time, Cross-System USSF Tactical Command and Control.","source_title":"DIU Submission Opportunity - Hydra (PROJ00677)","source_url":"https://www.diu.mil/work-with-us/submit-solution/PROJ00677","pub_date":"unknown (2025-2026)","event_date":"unknown","source_tier":1,"segment_ids":["S01","S08","S13"],"chain_steps":["COLLABORATE","TASK","MONITOR"],"pain_keywords":["cross-system","real-time","tactical C2","Space Force"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"DIU CSOs are the most startup-friendly DoD on-ramp (commercial terms, no SBIR ownership test), but foreign-owned firms face FOCI/ITAR scrutiny that needs legal review."},{"id":"E02-F20","title":"SSC Model Interoperability RFI: standards for syntactic, semantic and cross-domain interoperability of data and models","detail":"Space Systems Command seeks industry input on state-of-practice and standards enabling interoperability between data and models for collaborative system-of-systems in space missions, covering syntactic, semantic and cross-domain interoperability and the software that enables them.","quote_or_paraphrase":"practices, techniques, standards, and the use of software applications that enable different forms of interoperability, such as syntactic, semantic, and cross-domain interoperability.","source_title":"RFI for Contracting for Model Interoperability (SAM.gov)","source_url":"https://sam.gov/opp/d4cfa6871d8148cc91cc9177720a2eac/view","pub_date":"unknown (primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S02","S08"],"chain_steps":["NORMALIZE","COLLABORATE"],"pain_keywords":["semantic interoperability","model interoperability","system-of-systems"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Semantic-layer / schema translation tooling is a repeat government ask across services; commercially adjacent to data-integration startups."},{"id":"E02-F21","title":"DIU + INDOPACOM 2025 Blue Object Management Challenge: AI-enabled integration and access to blue-force data across platforms","detail":"DIU, in partnership with USINDOPACOM, ran the 2025 Blue Object Management Challenge focused on AI-enabled decision-making that improves how mission-critical data is integrated, accessed and used across DoD platforms and forces. 'Blue object management' is the Pacific-theater term for friendly-force tracking and disposition; the challenge implies current blue-force data is siloed by platform. Detail page could not be opened.","quote_or_paraphrase":"focused on advancing AI-enabled decision-making capabilities that improve how mission-critical data is integrated, accessed, and used across Department of Defense (DoD) platforms and forces.","source_title":"DIU Presents: Blue Object Management Challenge","source_url":"https://www.diu.mil/latest/diu-presents-blue-object-management-challenge","pub_date":"2025 (exact date not visible)","event_date":"2025","source_tier":1,"segment_ids":["S07","S02","S06"],"chain_steps":["INGEST","FUSE","VISUALIZE","DECIDE"],"pain_keywords":["blue force tracking","blue object management","data integration","INDOPACOM"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"A combatant-command-sponsored challenge with a named operational owner; friendly-force data fusion is tractable for a software startup, and DIU challenges pay in prototype OTAs."},{"id":"E02-F22","title":"DIU AUKUS Maritime Innovation Challenge 2025: near-real-time links from undersea vehicles to C2/battle-management systems","detail":"The tri-national AUKUS Maritime Innovation Challenge 2025 sought commercial solutions enhancing undersea command, control and communications, specifically near-real-time communications from unmanned vehicles to C2/BMS and between seabed systems, UVs and C2/BMS. Eligibility is framed around AUKUS nations (US, UK, Australia).","quote_or_paraphrase":"providing near real-time communications from UVs to Command and Control (C2) Systems/Battle Management Systems (BMS), as well as communications between seabed systems to UVs, C2 Systems, and BMS.","source_title":"Advance Underwater Communication for the Future of Naval Operations: A Call (DIU)","source_url":"https://www.diu.mil/latest/advance-underwater-communication-for-the-future-of-naval-operations-a-call","pub_date":"2025","event_date":"2025","source_tier":1,"segment_ids":["S05","S13","S08"],"chain_steps":["TRANSPORT","DISSEMINATE","TASK"],"pain_keywords":["undersea communications","UV to C2","AUKUS","battle management system"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Hardware-heavy and AUKUS-scoped (German/Indonesian founders are outside the three nations); low fit but shows autonomy-to-C2 linkage is an allied priority."},{"id":"E02-F23","title":"USSOCOM TACLAN / SDN 'King for a Day' RFI (posted 15 May 2026): modular C2 network, edge compute, SD-WAN, EW resilience","detail":"USSOCOM issued an RFI for the Tactical Local Area Network (TACLAN) and Satellite Deployable Node (SDN), inviting industry with expertise in modular C2 network architectures, tactical communications, edge computing, SD-WAN and EW resilience to shape the future of SOF deployable communications infrastructure. Seen via a GovDash mirror; the primary and mirror pages were both blocked.","quote_or_paraphrase":"an opportunity for industry partners with expertise in modular C2 network architectures, tactical communications, edge computing, SD-WAN, and EW resilience to influence the future direction of USSOCOM's deployable communication infrastructure.","source_title":"TACLAN and SDN 'King for a Day' RFI (GovDash mirror of SAM.gov)","source_url":"https://discover.govdash.com/solicitations/019e2c45-0ea1-7629-8f59-8b2664474496--tactical-local-area-network-taclan-and-satellite-deployable-node-sdn-king-for-a","pub_date":"2026-05-15","event_date":"2026-05-15","source_tier":4,"segment_ids":["S05","S06","S12"],"chain_steps":["TRANSPORT","DISSEMINATE"],"pain_keywords":["SD-WAN","edge computing","modular C2 network","EW resilience","deployable node"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"SOCOM's 'king for a day' format invites whole-architecture proposals; a software-defined networking or network-orchestration startup could partner with a hardware incumbent."},{"id":"E02-F24","title":"ACC AMIC Deployable Tactical Communications RFI: routing, edge compute, application-level QoS and cross-domain data sharing in contested forward environments","detail":"Air Combat Command's Acquisition Management and Integration Center issued an RFI to identify readily deployable tactical communications for expeditionary operations in contested forward-deployed environments, including routing, switching, edge computing, application-level QoS and traffic management in dynamic environments, interoperability with existing USAF infrastructure, and cross-domain data sharing.","quote_or_paraphrase":"capabilities for routing, switching, edge computing, application-level QoS, and managing network traffic in dynamic environments ... interoperable with existing USAF infrastructure and demonstrate cross-domain data sharing capabilities.","source_title":"RFI - Deployable Tactical Communications (SAM.gov)","source_url":"https://sam.gov/workspace/contract/opp/1e1135d1d9d74b26a435ea0f27069559/view","pub_date":"unknown (2025-2026; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S05","S06","S10"],"chain_steps":["TRANSPORT","DISSEMINATE"],"pain_keywords":["application-level QoS","traffic management","edge computing","cross-domain data sharing","ACE"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Application-aware QoS / traffic prioritization software for DDIL links is a repeated ask (also in NGC2 and xTech) and is achievable without radio hardware."},{"id":"E02-F25","title":"Nett Warrior Edge Compute Device RFI: consolidate dismounted-leader SA/C2 components into one lightweight device","detail":"The Army seeks information on a Nett Warrior Edge Compute Device intended as a single integrated system that enhances situational awareness and C2 for dismounted leaders by consolidating multiple components into a lightweight, efficient device. Seen via a SweetSpot mirror; primary page blocked; date not visible.","quote_or_paraphrase":"develop a single, integrated system that enhances situational awareness and command and control for dismounted leaders by consolidating multiple components into a lightweight, efficient device.","source_title":"Nett Warrior Edge Compute Device RFI (SweetSpot mirror of SAM.gov)","source_url":"https://console.sweetspotgov.com/federal-contracts/47728783-bfd4-528b-83a6-35a137cccb84","pub_date":"unknown (2025-2026)","event_date":"unknown","source_tier":4,"segment_ids":["S06","S07","S01"],"chain_steps":["PROCESS","VISUALIZE","DISSEMINATE"],"pain_keywords":["edge compute device","dismounted","Nett Warrior","SWaP"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Hardware-centric (Samsung/Juggernaut incumbents); the software opportunity is on-device inference and power-aware sync for ATAK, not the device itself."},{"id":"E02-F26","title":"Other tactical-edge notices: PEO IEW&S Tactical Edge Node RFI (2024) and Global Tactical Edge Acquisition Directorate (G-TEAD) Marketplace","detail":"PEO IEW&S posted a Tactical Edge Node RFI (solicitation number W56KGY24PEOIEWSISA, 2024). Two SAM.gov notices describe a 'Global Tactical Edge Acquisition Directorate (G-TEAD) Marketplace'; the parent organization was not visible and the pages were blocked. Public evidence insufficient on content beyond titles.","quote_or_paraphrase":"PEO IEW&S Tactical Edge Node RFI (W56KGY24PEOIEWSISA); Global Tactical Edge Acquisition Directorate (G-TEAD) Marketplace.","source_title":"PEO IEW&S Tactical Edge Node RFI (GovTribe mirror); G-TEAD Marketplace (SAM.gov)","source_url":"https://govtribe.com/opportunity/federal-contract-opportunity/peo-iews-tactical-edge-node-rfi-w56kgy24peoiewsisa","pub_date":"2024 (IEW&S); unknown (G-TEAD)","event_date":"unknown","source_tier":4,"segment_ids":["S06","S03","S04"],"chain_steps":["PROCESS","FUSE"],"pain_keywords":["tactical edge node","marketplace"],"label":"FACT","confidence":"LOW","startup_relevance":"A 'marketplace' notice suggests a standing vendor-onboarding vehicle worth verifying. G-TEAD URLs: https://sam.gov/workspace/contract/opp/a600f39227e54e2cb38455088997f1f6/view ; https://sam.gov/opp/3cccc0ba30614474bf891f7e9569b034/view"},{"id":"E02-F27","title":"JIATF-401 RFI for web-accessible counter-UAS mission planning, EMS management and threat-modeling software","detail":"Joint Interagency Task Force 401 (which replaced the Joint C-sUAS Office per an OSD memo dated 28 Aug 2025) is conducting market research for modern web-accessible software supporting tactical mission planning, electromagnetic spectrum management and C-UAS threat modeling, including sensor and effector catalogs with configurable parameters and threat catalogs of commercial and state/non-state UAS. An Army Contracting Command-Detroit Arsenal fact sheet dated 15 Apr 2026 describes a JIATF-401 Commercial Solutions Opening (CSO). Both PDFs were blocked; details from excerpts.","quote_or_paraphrase":"seeking information on modern, web-accessible software solutions to support tactical mission planning, electromagnetic spectrum management, and Counter-UAS threat modeling ... sensor and effector catalogs with configurable parameters, and threat catalogs with libraries of commercial and state/non-state actor UAS.","source_title":"JIATF-401 mission planning software RFI (SAM.gov); JIATF-401 CSO Fact Sheet, ACC-Detroit Arsenal (api.army.mil); Establishment of JIATF-401 memo (media.defense.gov)","source_url":"https://sam.gov/opp/b9d5a581cb674b5f8a87b72ea01e2678/view","pub_date":"2026 (RFI; exact date not visible); 2026-04-15 (CSO fact sheet); 2025-08-28 (establishment memo)","event_date":"2025-08-28 (JIATF-401 established)","source_tier":1,"segment_ids":["S01","S12","S07"],"chain_steps":["DECIDE","TASK","ASSESS"],"pain_keywords":["counter-UAS","mission planning","spectrum management","threat modeling","sensor catalog","effector catalog"],"label":"FACT","confidence":"HIGH","startup_relevance":"Pure-software, web-based planning tool with a new, well-funded joint owner that has its own CSO; one of the best-fit asks in this sweep for a two-founder software team. Related: https://api.army.mil/e2/c/downloads/2026/04/15/a013eedf/jiatf-cso-fact-sheet.pdf ; https://media.defense.gov/2025/Aug/28/2003790021/-1/-1/0/ESTABLISHMENT-OF-JOINT-INTERAGENCY-TASK-FORCE-401.PDF"},{"id":"E02-F28","title":"C-sUAS sensor RFI specifies 4-10 Hz track updates to support effector cueing and multi-modal sensor fusion","detail":"A SAM.gov C-sUAS RFI requests tracking accuracy sufficient for downstream effector and sensor cueing and multi-modal sensor fusion, with track update rates between 4 Hz and 10 Hz. This is a concrete, quantitative government statement of the track-quality bar a fusion/C2 layer must meet.","quote_or_paraphrase":"tracking accuracy sufficient to support downstream effector, sensor cueing, and multi-modal sensor fusion, with track update rates between 4 Hz and 10 Hz.","source_title":"Request for Information (RFI) for C-sUAS and ... (SAM.gov)","source_url":"https://sam.gov/workspace/contract/opp/b1686e77f72441e0bcb029f6a1b8b276/view","pub_date":"unknown (2025-2026; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S07","S03","S01"],"chain_steps":["COLLECT","FUSE","TASK"],"pain_keywords":["track update rate","sensor cueing","multi-modal fusion","C-sUAS"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Gives a measurable spec a fusion-software startup can benchmark against; the market is crowded (FAAD C2 / Anduril Lattice / others hold JIATF positions)."},{"id":"E02-F29","title":"'Data Fusion Correlator' notice (Mar 2026) admits SENSEI counter-UxS sensors are limited in coverage, accuracy and clutter rejection","detail":"A March 2026 SAM.gov notice for a Data Fusion Correlator describes SENSEI as an integrated multi-sensor, multi-weapon counter-unmanned system whose sensors have limitations in coverage, accuracy and susceptibility to noise and clutter, and seeks a correlator to fuse them. Issuing office not visible in the excerpt.","quote_or_paraphrase":"SENSEI is an integrated multi-sensor, multi-weapon counter-unmanned system whose sensors have limitations in coverage, accuracy, and susceptibility to noise and clutter.","source_title":"Data Fusion Correlator (SAM.gov)","source_url":"https://sam.gov/workspace/contract/opp/cf5c6beca1ba4964818c8ca28dd9bd86/view","pub_date":"2026-03","event_date":"2026-03","source_tier":1,"segment_ids":["S07","S04","S13"],"chain_steps":["FUSE","IDENTIFY/INTERPRET"],"pain_keywords":["data fusion correlator","multi-sensor","clutter","track correlation"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"A bounded algorithmic problem (multi-sensor track correlation) suited to a strong engineer; scope, agency and whether it is set aside must be verified."},{"id":"E02-F30","title":"PM LAV vehicle-mounted C-sUAS sources sought (May 2025) wants whole find-fix-track-identify kill chain","detail":"The Marine Corps Program Manager Light Armored Vehicle issued a sources sought in May 2025 for vehicle-mounted counter small-UAS solutions addressing the entire kill chain and enhancing find, fix, track and identification. Companion Marine notices cover an Observation and Sensing System (OSS) and an Army EO/IR sensor with automated thermal tracking.","quote_or_paraphrase":"seeks information on solutions addressing the entire kill chain, enhancing find, fix, track, and identification capabilities for counter small-UAS systems.","source_title":"RFI for Vehicle Mounted Counter small-Unmanned Aircraft System (SAM.gov)","source_url":"https://sam.gov/opp/9e1f6c27e1f64dbeb21a3fe9219e9081/view","pub_date":"2025-05","event_date":"2025-05","source_tier":1,"segment_ids":["S07","S03","S13"],"chain_steps":["COLLECT","FUSE","IDENTIFY/INTERPRET","TASK"],"pain_keywords":["kill chain","find fix track identify","vehicle-mounted C-sUAS"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Integrated-system buy favoring hardware primes; startup role is the ID/classification or track-management software subcomponent. Companions: https://sam.gov/opp/c1198dde73ec49218bc97e13329698b8/view ; https://sam.gov/opp/3aa5e21ac1524f8f809308bd78576400/view"},{"id":"E02-F31","title":"Spectrum Situational Awareness System (S2AS) notice requires DDIL operation with local compute, memory and storage","detail":"A SAM.gov notice for a Spectrum Situational Awareness System states that to support disrupted, disconnected, intermittent and low-bandwidth (DDIL) environments the system must carry enough compute, memory and storage to support current operations and local data storage. Issuing service not visible in excerpt.","quote_or_paraphrase":"To support Disrupted, Disconnected, Intermittent and low-bandwidth (DDIL) operational environments, system capabilities must be enabled with enough compute power, memory, and storage to support current operations and storage of data.","source_title":"Spectrum Situational Awareness System (S2AS) (SAM.gov)","source_url":"https://sam.gov/opp/b043b5a9bf5941f5a37bb1c085916484/view","pub_date":"unknown (2025; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S12","S06"],"chain_steps":["COLLECT","PROCESS","VISUALIZE"],"pain_keywords":["spectrum situational awareness","DDIL","edge storage"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"EMS-awareness visualization/analytics is software-heavy but SDR hardware and classified signal libraries create ITAR and clearance hurdles."},{"id":"E02-F32","title":"Mobile-Long Range Precision RFI requires DDIL resilience and self-protection against network, cyber, EMS and PNT attacks","detail":"An Army RFI for a Mobile-Long Range Precision (fires) capability requires the solution to be survivable and resilient in DDIL environments and to operate and protect itself against attacks on embedded network, cyberspace, electromagnetic spectrum and PNT capabilities. This shows fires-C2 requirements now bundle network, cyber and PNT resilience as baseline.","quote_or_paraphrase":"survivable and resilient in denied, degraded, intermittent, and limited-bandwidth (DDIL) environments, enabling the system to operate and protect itself against attacks on embedded network, cyberspace, electromagnetic spectrum (EMS), and position, navigation, and timing (PNT) capabilities.","source_title":"Request for Information for Mobile-Long Range Precision ... (SAM.gov)","source_url":"https://sam.gov/opp/202906f1bb8943bdb97054bf1bc0e964/view","pub_date":"unknown (2025; primary page blocked)","event_date":"unknown","source_tier":1,"segment_ids":["S05","S10","S11","S12"],"chain_steps":["TRANSPORT","TASK"],"pain_keywords":["PNT resilience","EMS attack","embedded network","DDIL"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Weapons-platform RFI (prime territory); relevant only as evidence that PNT/EMS assurance software is a cross-cutting requirement."},{"id":"E02-F33","title":"Coast Guard 'Coastal Sentinel' RFI: next-gen maritime surveillance/C2/comms with data-rich COP; invite-only industry day 29 Sep 2026","detail":"The USCG Office of Rapid Response and Prototyping (CG-RAPTOR) invited industry to submit information for the Coastal Sentinel portfolio, described as next-generation maritime surveillance, command-and-control and communications to help operators sense maritime activity, make sense of diverse data and act through a data-rich common operating picture, emphasizing quality, persistence, integration and operational usefulness of sensing and analytics. USCG intends to down-select no more than ten companies for an invitation-only industry day on 29 September 2026 in San Diego.","quote_or_paraphrase":"next-generation maritime surveillance, command-and-control, and communications capability intended to help operators sense maritime activity, make sense of diverse data, and act through a data-rich common operating picture ... down-select to no more than ten companies to participate in an invitation-only Coastal Sentinel Industry Day on 29 September 2026 in San Diego.","source_title":"Coastal Sentinel RFI, USCG CG-RAPTOR (SAM.gov)","source_url":"https://sam.gov/opp/834fbda5c8424575a33b7a9b4162f237/view","pub_date":"2026 (Aug-Sep inferred; primary page blocked)","event_date":"2026-09-29 (industry day)","source_tier":1,"segment_ids":["S07","S03","S01","S04"],"chain_steps":["COLLECT","FUSE","VISUALIZE","DECIDE"],"pain_keywords":["common operating picture","maritime domain awareness","sensing analytics","persistence","rapid prototyping"],"label":"FACT","confidence":"HIGH","startup_relevance":"DHS/USCG is a non-DoD buyer with lighter ITAR exposure and an explicit rapid-prototyping office; maritime COP analytics is a strong fit for a software startup, though the down-select to ten firms means late entrants must find the next cycle."},{"id":"E02-F34","title":"USSOCOM Tactical X Event 2026 wants AI/ML to speed PED of data from unmanned-system encounters, captured materials and OSINT","detail":"A SAM.gov notice for the USSOCOM Tactical X Event 2026 requires solutions to incorporate AI/ML to enhance processing, exploitation and dissemination of data extracted from unmanned systems (UxS) encounters, other collected exploitable materials and relevant open-source intelligence. A companion PD SAI notice covers aerial-ISR PED services.","quote_or_paraphrase":"must incorporate Artificial Intelligence/Machine Learning to enhance processing, exploitation, and dissemination (PED) of data extracted from Unmanned Systems (UxS) encounters, other collected exploitable materials, and relevant Open Source Intelligence (OSINT).","source_title":"USSOCOM Tactical X Event 2026 (SAM.gov)","source_url":"https://sam.gov/opp/11b9f31e57e940999defcd7a93f2e8dd/view","pub_date":"2026 (exact date not visible)","event_date":"2026","source_tier":1,"segment_ids":["S04","S06"],"chain_steps":["PROCESS","IDENTIFY/INTERPRET","DISSEMINATE"],"pain_keywords":["PED","AI/ML","OSINT","captured drone exploitation"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Drone-forensics / exploitation tooling is a narrow, software-heavy PED niche with a SOF sponsor; SOCOM Tactical X events accept live demos from small vendors. Companion: https://sam.gov/opp/231f272c9bd54f96a5f60befe6f1451d/view"},{"id":"E02-F35","title":"Navy notices: 'Navy Collaborative' sources sought (31 Aug 2026, OTA-eligible), TacMobile Increment 3 (9 Sep 2025), TM-BM battle management","detail":"A Navy sources sought titled 'Navy Collaborative ...' published 31 Aug 2026 states responses may inform a prototype project under Other Transaction Authority (10 U.S.C. 4022). A TacMobile Increment 3 Capability Product sources sought was published 9 Sep 2025 (TacMobile is the maritime-patrol/ISR C2 ground system). A 'Battle Management (TM-BM) Transformational Model' notice also appears. Content beyond titles is not visible; public evidence insufficient.","quote_or_paraphrase":"The RFI is issued solely for information and planning purposes and the Government may use the information received to inform a potential prototype project under Other Transaction Authority (OTA), pursuant to 10 U.S.C. 4022.","source_title":"Request for Information (RFI) for Navy Collaborative ... (SAM.gov); TacMobile Increment 3 (SAM.gov); TM-BM Transformational Model (SAM.gov)","source_url":"https://sam.gov/opp/9f1ccd7a09b847a684806128b982bec3/view","pub_date":"2026-08-31 (Navy Collaborative); 2025-09-09 (TacMobile)","event_date":"2026-08-31","source_tier":1,"segment_ids":["S01","S04","S07"],"chain_steps":["COLLABORATE","VISUALIZE"],"pain_keywords":["OTA prototype","TacMobile","battle management model"],"label":"FACT","confidence":"LOW","startup_relevance":"OTA-eligible Navy sources sought are open to non-traditional vendors; needs primary read. Related: https://sam.gov/opp/7903da13ea244175abe6b2c3e8ac190d/view ; https://sam.gov/opp/a6f8e78859cd45d294a8df70906c90f5/view"},{"id":"E02-F36","title":"CDAO Tradewinds: 2023 data-mesh RFI and 2025-2026 'awardable' assessments for decision-advantage and tactical data-mesh tools","detail":"CDAO queried industry about commercial data-mesh capabilities in Oct 2023 (DefenseScoop). Tradewinds Solutions Marketplace shopping notice 2025-NOI-0001 closed but awardable solutions may still be flagged for a July 2026 assessment period. Vendors assessed 'awardable' include C3 AI (Decision Advantage), NT Concepts PLANK (a tactical data mesh with localized AI agents keeping operations and logistics data synchronized without constant connectivity; dual awardable) and CACI (16 Jun 2026). 'Awardable' is a market-research designation, not a contract or revenue.","quote_or_paraphrase":"PLANK is a platform combining a tactical data mesh with localized AI agents to keep operations and logistics data synchronized without relying on constant connectivity.","source_title":"Pentagon's CDAO queries industry about commercial data-mesh capabilities (DefenseScoop, 2023-10-26); Tradewinds Opportunities; NT Concepts PLANK (ExecutiveBiz); CACI IR 2026-06-16","source_url":"https://defensescoop.com/2023/10/26/pentagons-cdao-queries-industry-about-commercial-data-mesh-capabilities/","pub_date":"2023-10-26 (RFI coverage); 2026-06-16 (CACI); 2026 (NT Concepts)","event_date":"2023-10 (RFI); 2026-07 (assessment period)","source_tier":3,"segment_ids":["S02","S06","S14","S09"],"chain_steps":["STORE","DISSEMINATE","DECIDE"],"pain_keywords":["data mesh","decision advantage","intermittent connectivity","logistics data sync","Tradewinds awardable"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"Tradewinds lets a startup become 'awardable' via a five-minute video with no prior contract, but conversion to funded work depends on a mission owner; treat as a marketing channel, not demand proof. Related: https://www.tradewindai.com/opportunities ; https://www.executivebiz.com/articles/nt-concepts-plank-cdao-tradewinds-awardable ; https://investor.caci.com/2026-06-16-CACI-Assessed-Awardable-for-Department-of-War-Work-in-the-CDAOs-Tradewinds-Solutions-Marketplace"},{"id":"E02-F37","title":"AFWERX 2026 replaced the general Open Topic with 'Focused Open Topics' where the Air Force names the gap; D2P2 requires a signed customer memo","detail":"Secondary coverage of AFWERX's 2026 program states the traditional Open Topic is gone, replaced by mission-driven Focused Open Topics in which the Air Force names the capability gap and leaves the solution open, and that Direct-to-Phase II requires a prototype-ready solution, an identified Air Force end-user and a signed Customer Memorandum. The 25.5 Release 8 webinar deck (May 2025) covered D2P2 and Focus Open Topics. At AFA 2026 (Sep 2026) the DAF PAE for C3BM, Brig. Gen. Joshua Williams, framed battle management around 'how data is being moved across the force'. Topic-level gap statements could not be opened.","quote_or_paraphrase":"The traditional Open Topic is gone for 2026, replaced by 'Focused Open Topics,' mission-driven solicitations where the Air Force names the capability gap and leaves the solution approach open.","source_title":"AFWERX in 2026: What Changed (Grant Engine); Open Topic 25.5 Release 8 Overview (afwerx.com PDF); AFA 2026 panel on DAF battle management (GlobalSecurity mirror)","source_url":"https://grantengine.com/afwerx-sbir-2026/","pub_date":"2026 (Grant Engine); 2025-05 (AFWERX deck); 2026-09-21 (AFA panel)","event_date":"2026","source_tier":4,"segment_ids":["S09","S01","S02"],"chain_steps":["DISSEMINATE","DECIDE"],"pain_keywords":["focused open topic","customer memorandum","data movement","battle network"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"SBIR/D2P2 is the classic student-founder path but (a) requires a US small business majority-owned by US citizens or permanent residents (statutory SBIR rule; needs legal review for the Indonesian founder) and (b) now requires a named DAF customer before applying. Related: https://afwerx.com/wp-content/uploads/25.5-Release-8-Open-Topic-D2P2_P2_FOT-Webinar-Spring-2025-CLEARED_AFRL-2025-2313-1.pdf ; https://www.globalsecurity.org/military/library/news/2026/09/mil-260921-usaf01.htm"},{"id":"E02-F38","title":"DARPA TTO Office-Wide BAA (exec summaries due 17 Apr 2026, rolling to 22 Jun 2026, $500K-$5M) and MINC tactical-network-control program","detail":"DARPA's Tactical Technology Office office-wide BAA solicited executive summaries by 17 Apr 2026 with proposals accepted on a rolling basis through 22 Jun 2026, estimated awards $500K to $5M, under focus areas Design/Build/Buy, Surge and Sustain, Long Range Effects and Disruptive Innovation (not C2-specific). Separately, DARPA's Mission-Integrated Network Control (MINC) program awarded BAE Systems FAST Labs a $6M Phase 2 to continue developing autonomous tactical network control software. Award value is the reported contract figure, not obligations.","quote_or_paraphrase":"Executive Summary Due: April 17, 2026 ... Proposals are accepted on a rolling basis through June 22, 2026 ... Estimated award range is $500K to $5 million.","source_title":"Opportunity Listing - TTO Office Wide (OW) BAA 2025 (grants.gov); Tactical network control development contract from DARPA won by BAE Systems (Military Embedded Systems)","source_url":"https://simpler.grants.gov/opportunity/de7207c4-980f-4dba-a286-e96db65fd55e","pub_date":"2025-2026 (BAA); unknown (MINC article)","event_date":"2026-04-17 / 2026-06-22","source_tier":1,"segment_ids":["S05","S13"],"chain_steps":["TRANSPORT"],"pain_keywords":["office-wide BAA","network control","autonomous networking","MINC"],"label":"FACT","confidence":"MEDIUM","startup_relevance":"DARPA BAAs fund research, not products; MINC shows the autonomous-network-control problem is funded at prime level. Related: https://militaryembedded.com/comms/communications/tactical-network-control-development-contract-from-darpa-won-by-bae-systems ; https://www.darpa.mil/work-with-us/communities/small-business/sbir-sttr-topics"},{"id":"E02-F39","title":"SOFWERX 2026 events: USV 'Poseidon's Fury' C2/UI assessment (submissions 24 Sep-7 Oct 2026) and Distributed Micro Sensors assessment (13-15 Oct 2026)","detail":"SOFWERX lists a PEO-Maritime USV 'Poseidon's Fury' effort whose Phase 1 collaboration event (26 Aug 2026) focused on user interface, ease of use, platform efficacy, automated/autonomous functionality and C2 functionality needs, with Phase 2 assessment submissions open 24 Sep-7 Oct 2026; a PEO-SOF Warrior Distributed Micro Sensors effort (collaboration 24 Jun 2026; assessment 13-15 Oct 2026); and Innovation Foundry 11 on situational awareness and signature management. Pages could not be opened.","quote_or_paraphrase":"Phase 1 Collaboration Event completed August 26, 2026, focused on User Interface, ease-of-use, platform efficacy, automated/autonomous functionality, and Command and Control (C2) functionality needs.","source_title":"PEO-M USV Poseidon's Fury (SOFWERX); PEO-SW Distributed Micro Sensors (SOFWERX); SOFWERX events in /294835/netcom_showcases_capabilities_at_technet_augusta_2026"},{"id":"E02-F41","title":"Absence signal: no Mission Partner Environment or coalition-interoperability RFI/sources sought surfaced in searches","detail":"Site-scoped searches for 'Mission Partner Environment', 'coalition interoperability' and 'multinational information sharing' on sam.gov returned no matching C4ISR notices (only unrelated DOE/State results and the SSC model-interoperability RFI). INFERENCE: MPE work is procured through existing DISA/JS J6 vehicles and classified channels rather than open RFIs. Per quality rule 7, absence of open solicitations is NOT evidence of opportunity; it more likely indicates a closed market.","quote_or_paraphrase":"No sam.gov notice matching 'Mission Partner Environment' appeared in search results.","source_title":"Search-result absence (site:sam.gov queries, 2026-09-24)","source_url":"https://sam.gov/opp/d4cfa6871d8148cc91cc9177720a2eac/view","pub_date":"2026-09-24","event_date":"2026-09-24","source_tier":1,"segment_ids":["S08"],"chain_steps":["COLLABORATE","DISSEMINATE"],"pain_keywords":["mission partner environment","coalition","releasability"],"label":"INFERENCE","confidence":"LOW","startup_relevance":"Coalition interoperability is the segment where a German co-founder could add value, but open US demand signals were not found; allied-side (NATO/BwB/EDF) notices should be checked by the allied-markets agent."},{"id":"E02-F42","title":"Historical: FARA data-fusion sources sought asked for a 'synthetic operating picture' from multiple aircraft data inputs (program since cancelled)","detail":"An older FARA Project sources sought (updated) sought data-fusion technology enabling fusion of multiple aircraft data inputs to create a synthetic operating picture, reducing crew workload. FARA was cancelled in Feb 2024, so the notice is historical, but the underlying demand (cockpit-level multi-source fusion) persists in FLRAA and other notices.","quote_or_paraphrase":"se
